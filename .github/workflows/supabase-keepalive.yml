# Free Supabase projects pause after 7 days without activity. This touches
# the database every two days so online play is always available.
name: Supabase keep-alive

on:
  schedule:
    - cron: '17 6 */2 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Touch the database
        run: |
          curl --fail --silent --show-error -X POST \
            "https://mqqgykgdzfyrfzdmeauu.supabase.co/rest/v1/rpc/keepalive" \
            -H "apikey: sb_publishable_lChrS3puixD70pMwnAeI8w_pU6sx-2K" \
            -H "Content-Type: application/json" \
            -d '{}'
