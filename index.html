canvas.addEventListener('click', (e)=>{
  const rect = canvas.getBoundingClientRect();
  const cellPxX = rect.width / COLS, cellPxY = rect.height / ROWS;
  const x = Math.floor((e.clientX-rect.left)/cellPxX);
  const screenY = Math.floor((e.clientY-rect.top)/cellPxY);
  const y = sy(screenY);
  if(!inBounds(x,y)) return;
  onCellClick(x,y);
});

function onCellClick(x,y){
  if(state.gameOver) return;
  if(state.phase==='deploy'){ handleDeployClick(x,y); return; }
  if(state.mode==='ai' && state.turn===state.aiSide) return; // AI's turn, ignore human clicks

  const clicked = pickUnitAtCell(x,y);
  const sel = state.selectedUnitId ? state.units.find(u=>u.id===state.selectedUnitId) : null;

  if(state.phase==='move'){
    if(sel && sel.side===state.turn && highlightCells.some(c=>c.x===x&&c.y===y&&c.kind==='charge')){
      pushUndoSnapshot();
      const fromX=sel.x, fromY=sel.y;
      displaceBrigadierIfPresent(x, y, fromX, fromY);
      animateUnitTo(sel, x, y);
      sel.charged = true;
      state.moved.add(sel.id);
      log(`${unitLabel(sel)} charges to engage!`, sel.side);
      selectUnit(sel.id);
      return;
    }
    if(sel && sel.side===state.turn && highlightCells.some(c=>c.x===x&&c.y===y&&c.kind==='move')){
      pushUndoSnapshot();
      const fromX=sel.x, fromY=sel.y;
      displaceBrigadierIfPresent(x, y, fromX, fromY);
      if(UNIT_TYPES[sel.type].isArtillery && !isHorseArtillery(sel) && terrainAt(x,y).plough) consumePloughEscort(sel);
      animateUnitTo(sel, x, y);
      state.moved.add(sel.id);
      log(`${unitLabel(sel)} moves to (${x},${y}).`, sel.side);
      selectUnit(sel.id);
      return;
    }
    if(clicked && clicked.side===state.turn){ selectUnit(clicked.id); return; }
    selectUnit(clicked ? clicked.id : null);
  } else if(state.phase==='fire'){
    if(sel && UNIT_TYPES[sel.type].isArtillery && highlightCells.some(c=>c.x===x&&c.y===y&&c.kind==='target')){
      const target = pickUnitAtCell(x,y);
      pushUndoSnapshot();
      selectUnit(null);
      fireArtillery(sel, target);
      return;
    }
    if(clicked && clicked.side===state.turn && UNIT_TYPES[clicked.type].isArtillery){ selectUnit(clicked.id); return; }
    selectUnit(clicked ? clicked.id : null);
  } else if(state.phase==='fight'){
    if(sel && sel.side===state.turn && highlightCells.some(c=>c.x===x&&c.y===y&&c.kind==='target')){
      const target = pickUnitAtCell(x,y);
      pushUndoSnapshot();
      selectUnit(null);
      resolveFight(sel, target, undefined, ()=>{
        state.fought.add(sel.id);
        if(!anyFightsAvailable(state.turn)) setTimeout(endFightPhase, 500);
      });
      return;
    }
    if(clicked && clicked.side===state.turn && canInitiateFight(clicked)){ selectUnit(clicked.id); return; }
    selectUnit(clicked ? clicked.id : null);
  }
}

function fireArtillery(gun, target, onComplete){
  onComplete = onComplete || function(){};
  const dist = chebyshev(gun,target);
  if(dist<=1){
    resolveFight(gun, target, undefined, ()=>{ state.fired.add(gun.id); selectUnit(null); onComplete(); });
    return;
  }
  gun.smokeActive = true;
  ensureAnimationLoopRunning();
  showActionLine(gun, target, '#a33330', 3800, true);
  const needed = dist; // to-hit number: a target at range N needs a roll of N or higher — pure range, no formation modifier
  const hitNotes = [];
  const minRoll = Math.max(1, Math.min(6, needed));
  hitNotes.push(minRoll<=6 ? `Need ${minRoll}+ to hit` : 'Out of range — cannot hit');

  presentRollTrigger([{label:'To Hit', diceCount:1, notes:hitNotes}], gun.side, ()=>{
    const roll = rollD6();
    const hit = roll >= needed;
    showDice([{label:'To Hit', rolls:[roll], keptValue:roll, notes:hitNotes}], hit ? 'Hit!' : 'Miss', hit ? 'win' : 'lose', ()=>{
      log(`Artillery fires at ${unitLabel(target)} (range ${dist}, needs ${needed}+): rolled ${roll}.`, 'combat');
      if(!hit){
        logNarration('artillery_miss');
        log('Shot falls wide.', 'combat');
        state.fired.add(gun.id);
        selectUnit(null);
        onComplete();
        return;
      }
      addCrater(target.x, target.y);
      const stack = unitsAt(target.x, target.y);
      const inCover = terrainAt(target.x,target.y).key==='WOODS' || terrainAt(target.x,target.y).key==='BUILDING';
      // Square/Column bonus now lands on the EFFECT roll, not the to-hit roll.
      // A "Column" here is two Infantry/Guard doubled into one open-terrain square.
      const isColumn = stack.length>1;
      const formationBonus = (target.formation==='square' || isColumn) ? 1 : 0;
      // Firing again on an already-Shaken target gets +1 effect. For a Column,
      // BOTH units in the stack must already be Shaken for the bonus to apply.
      const shakenBonus = isColumn
        ? (stack.every(u=>u.turnOnly) ? 1 : 0)
        : (target.turnOnly ? 1 : 0);
      const effNotes = [];
      if(inCover) effNotes.push('-1 effect: target in wood/building');
      if(formationBonus) effNotes.push(target.formation==='square' ? '+1 effect: Square formation' : '+1 effect: doubled Infantry (Column)');
      if(shakenBonus) effNotes.push(isColumn ? '+1 effect: both units already Shaken' : '+1 effect: target already Shaken');

      presentRollTrigger([{label:'Effect', diceCount:1, notes:effNotes}], gun.side, ()=>{
        let effRoll = rollD6();
        effRoll = Math.min(6, effRoll + formationBonus + shakenBonus);
        if(inCover) effRoll = Math.max(1, effRoll-1);
        const effLabel = effRoll<=3 ? 'No effect' : effRoll===4 ? 'Shaken' : effRoll===5 ? 'Falls back' : 'Removed';
        const effCls = effRoll<=3 ? '' : effRoll<=4 ? 'draw' : 'lose';
        showDice([{label:'Effect', rolls:[effRoll], keptValue:effRoll, notes:effNotes}], effLabel, effCls, ()=>{
          // Stacked units (doubled infantry in open terrain) suffer the same effect roll together —
          // each may need its own async Rally/Leadership sequence, so process them one at a time.
          if(stack.length>1) log(`${stack.length} units in that square share the effect.`, 'combat');
          applyArtilleryEffectToStack(stack, effRoll, 0, ()=>{
            state.fired.add(gun.id);
            selectUnit(null);
            onComplete();
          });
        });
      });
    });
  });
}

function applyArtilleryEffectToStack(stack, roll, idx, onAllDone){
  if(idx >= stack.length){ onAllDone(); return; }
  const u = stack[idx];
  if(u.removed){ applyArtilleryEffectToStack(stack, roll, idx+1, onAllDone); return; }
  applyArtilleryEffect(u, roll, ()=> applyArtilleryEffectToStack(stack, roll, idx+1, onAllDone));
}

function applyArtilleryEffect(u, roll, onComplete){
  onComplete = onComplete || function(){};
  const t = UNIT_TYPES[u.type];
  logReplay('fire', { targetId:u.id, side:u.side, x:u.x, y:u.y, roll, effect: roll<=3?'none':roll===4?'disrupt':roll===5?'rout':'destroy' });
  if(roll<=3){
    log(`${unitLabel(u)} carries on regardless.`, 'combat'); logNarration('artillery_no_effect');
    onComplete();
  } else if(roll===4){
    u.turnOnly=true;
    log(`${unitLabel(u)} is shaken — cannot move next turn, turns to face.`, 'combat'); logNarration('artillery_disrupt');
    onComplete();
  } else if(roll===5){
    logNarration('artillery_rout');
    retreatAndRally(u, onComplete);
  } else {
    logNarration('artillery_destroy');
    removeUnit(u,'destroyed by artillery');
    onComplete();
  }
}

/* =========================================================
   BOARD SETUP: random board assignment + dice-roll orientation
   Each side is given one of the two boards at random. Each side then
   rolls 1d6 for that board's table orientation: 1-3 forces a rotation
   of that many 90° clockwise turns; 4-6 lets that side's player choose
   the rotation. A human-controlled side gets an on-screen choice; the
   AI picks for itself when it's the AI's board.
========================================================= */
function beginBoardSetup(){
  const keys = Math.random()<0.5 ? ['A','B'] : ['B','A'];
  state.boardAssignment = { red: keys[0], blue: keys[1] };
  state.boardRotation = { red: 0, blue: 0 };
  processBoardRoll([SIDES.RED, SIDES.BLUE], 0);
}

function processBoardRoll(sides, i){
  if(i >= sides.length){
    document.getElementById('overlay').classList.remove('show');
    state.terrain = buildTerrainMap(state.boardAssignment, state.boardRotation);
    state.excludedRoadEdges = buildExcludedRoadEdgeSet(state.boardAssignment, state.boardRotation);
    initDeployment();
    return;
  }
  const side = sides[i];
  const roll = rollD6();
  log(`${SIDE_LABEL[side]} rolls a ${roll} for Board ${state.boardAssignment[side]}'s table orientation.`, 'system');
  if(roll <= 3){
    state.boardRotation[side] = roll;
    log(`${SIDE_LABEL[side]}'s board is rotated ${roll*90}\u00b0 clockwise.`, 'system');
    processBoardRoll(sides, i+1);
  } else {
    const isHumanControlled = !(state.mode==='ai' && side===state.aiSide);
    if(isHumanControlled){
      showRotationChoice(side, (chosen)=>{
        state.boardRotation[side] = chosen;
        log(`${SIDE_LABEL[side]} chooses a ${chosen*90}\u00b0 rotation for their board.`, 'system');
        processBoardRoll(sides, i+1);
      });
    } else {
      const chosen = Math.floor(Math.random()*4);
      state.boardRotation[side] = chosen;
      log(`${SIDE_LABEL[side]} (AI) chooses a ${chosen*90}\u00b0 rotation for their board.`, 'system');
      processBoardRoll(sides, i+1);
    }
  }
}

function renderMiniTerrainPreview(canvas, grid){
  const ctx2 = canvas.getContext('2d');
  const n = grid.length;
  const cell = canvas.width / n;
  ctx2.clearRect(0,0,canvas.width,canvas.height);
  for(let y=0;y<n;y++){
    for(let x=0;x<n;x++){
      const key = grid[y][x];
      ctx2.fillStyle = terrainColor(key==='ROAD' ? 'OPEN' : key);
      ctx2.fillRect(x*cell,y*cell,cell,cell);
    }
  }
  // roads as thin connected lines, same treatment as the main board
  ctx2.strokeStyle = terrainColor('ROAD');
  ctx2.lineWidth = Math.max(2, cell*0.16);
  ctx2.lineCap = 'round';
  for(let y=0;y<n;y++){
    for(let x=0;x<n;x++){
      if(grid[y][x]!=='ROAD') continue;
      const cx = x*cell+cell/2, cy = y*cell+cell/2;
      [[0,-1],[0,1],[-1,0],[1,0]].forEach(([dx,dy])=>{
        const nx=x+dx, ny=y+dy;
        if(nx>=0 && nx<n && ny>=0 && ny<n && grid[ny][nx]==='ROAD'){
          ctx2.beginPath(); ctx2.moveTo(cx,cy); ctx2.lineTo(x*cell+cell/2+dx*cell/2, y*cell+cell/2+dy*cell/2); ctx2.stroke();
        }
      });
    }
  }
  ctx2.lineCap = 'butt';
  const ICONS2 = { FIELD:'\u{1F33E}', WOODS:'\u{1F332}', HILL:'\u{26F0}', BUILDING:'\u{1F3E0}' };
  ctx2.textAlign = 'center'; ctx2.textBaseline = 'middle';
  ctx2.font = Math.floor(cell*0.55)+'px sans-serif';
  for(let y=0;y<n;y++){
    for(let x=0;x<n;x++){
      const icon = ICONS2[grid[y][x]];
      if(icon) ctx2.fillText(icon, x*cell+cell/2, y*cell+cell/2);
    }
  }
  ctx2.strokeStyle = 'rgba(0,0,0,0.15)'; ctx2.lineWidth = 1;
  for(let i=0;i<=n;i++){
    ctx2.beginPath(); ctx2.moveTo(i*cell,0); ctx2.lineTo(i*cell,canvas.height); ctx2.stroke();
    ctx2.beginPath(); ctx2.moveTo(0,i*cell); ctx2.lineTo(canvas.width,i*cell); ctx2.stroke();
  }
}

function showRotationChoice(side, callback){
  const boardKey = state.boardAssignment[side];
  let previewRotation = 0;
  const canvas = document.getElementById('rotationPreviewCanvas');

  function render(){
    canvas.style.display = 'block';
    renderMiniTerrainPreview(canvas, boardTerrainFor(boardKey, previewRotation));
    document.getElementById('overlayText').innerHTML =
      `You rolled a 4, 5 or 6 — you may choose which way Board ${boardKey} faces. Currently: <b>${previewRotation*90}\u00b0</b>`;

}

/* =========================================================
   CAMPAIGN MODE — chains Battles and Operations per the Hub's actual
   branching structure. Since "New Battle" already does a full page
   reload (the safest way to guarantee clean state), campaign progress
   is persisted to localStorage and picked back up on the next load,
   rather than trying to hand-reset every field in memory.
========================================================= */
const CAMPAIGN_STORAGE_KEY = 'tbCampaignProgress';
function saveCampaignProgress(){
  if(!state.campaign){ localStorage.removeItem(CAMPAIGN_STORAGE_KEY); return; }
  try {
    localStorage.setItem(CAMPAIGN_STORAGE_KEY, JSON.stringify({
      campaignId: state.campaign.id,
      flowIndex: state.campaignFlowIndex,
      lastWinner: state.campaignLastWinner,
      record: state.campaignRecord,
      mode: state.mode, aiSide: state.aiSide, aiDifficulty: state.aiDifficulty
    }));
  } catch(e){ /* storage unavailable — campaign just won't survive a reload, not fatal */ }
}
function loadCampaignProgress(){
  try {
    const raw = localStorage.getItem(CAMPAIGN_STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch(e){ return null; }
}
function clearCampaignProgress(){ try{ localStorage.removeItem(CAMPAIGN_STORAGE_KEY); }catch(e){} }

function startCampaign(camp){
  state.campaign = camp;
  state.campaignFlowIndex = 0;
  state.campaignLastWinner = null;
  state.campaignRecord = [];
  saveCampaignProgress();
  runCampaignStep();
}

function runCampaignStep(){
  const step = state.campaign.flow[state.campaignFlowIndex];
  if(!step){ showCampaignComplete(); clearCampaignProgress(); return; }
  document.getElementById('overlay').classList.remove('show');
  if(step.type==='battle'){
    state.scenario = null;
    document.getElementById('overlayTitle').textContent = step.name;
    document.getElementById('overlayText').innerHTML = `<b>${step.date}</b><br><br>${step.intro}`;
    let extra = document.getElementById('modeChoices');
    extra.innerHTML = ''; extra.style.display = 'flex';
    const beginBtn = document.createElement('button');
    beginBtn.className = 'primary';
    beginBtn.textContent = 'Begin Battle';
    beginBtn.onclick = ()=>{ extra.style.display='none'; document.getElementById('overlay').classList.remove('show'); beginBoardSetup(); };
    extra.appendChild(beginBtn);
    document.getElementById('overlay').classList.add('show');
  } else if(step.type==='branch'){
    showCampaignBranchChoice(step);
  }
}

function showCampaignBranchChoice(step){
  const chooser = state.campaignLastWinner || SIDES.RED; // fallback if somehow undecided
  const isHumanChoosing = !(state.mode==='ai' && chooser===state.aiSide);
  if(!isHumanChoosing){
    // AI picks between whichever options are actually available
    const available = step.options.filter(o=>!o.locked);
    const choice = available[Math.floor(Math.random()*available.length)];
    log(`${SIDE_LABEL[chooser]} (AI) chooses the next Operation: ${choice.name}.`, 'system');
    beginChosenOperation(choice);
    return;
  }
  document.getElementById('overlayTitle').textContent = `${SIDE_LABEL[chooser]} Chooses`;
  document.getElementById('overlayText').innerHTML = 'You won the last engagement — pick which Operation comes next.';
  let extra = document.getElementById('modeChoices');
  extra.innerHTML = ''; extra.style.display = 'flex'; extra.style.flexDirection = 'column'; extra.style.gap = '6px';
  for(const opt of step.options){
    const b = document.createElement('button');
    if(opt.locked){
      b.textContent = `${opt.name} (coming soon — needs VIP mission mechanics)`;
      b.disabled = true;
    } else {
      b.textContent = `${opt.name}${opt.missionArchetype ? ' — '+opt.missionArchetype : ''}`;
      b.onclick = ()=>{ extra.style.display='none'; beginChosenOperation(opt); };
    }
    extra.appendChild(b);
  }
  document.getElementById('overlay').classList.add('show');
}

function beginChosenOperation(opt){
  const scenario = SCENARIOS.find(s=>s.id===opt.operationId);
  if(!scenario){ log(`Could not find Operation data for ${opt.name} — skipping.`, 'system'); advanceCampaignStep(); return; }
  state.scenario = scenario;
  document.getElementById('overlay').classList.remove('show');
  beginBoardSetup();
}

function advanceCampaignStep(){
  state.campaignFlowIndex++;
  saveCampaignProgress();
  runCampaignStep();
}

function showCampaignComplete(){
  const wins = state.campaignRecord.filter(r=>r===SIDES.RED).length;
  const lwins = state.campaignRecord.length - wins;
  document.getElementById('overlayTitle').textContent = `${state.campaign.name} Complete`;
  document.getElementById('overlayText').innerHTML =
    `The campaign has run its course. Britain won ${wins} engagement${wins===1?'':'s'}; France won ${lwins}.`;
  const modeChoices = document.getElementById('modeChoices');
  if(modeChoices) modeChoices.style.display = 'none';
  document.getElementById('overlayBtn').style.display = 'inline-block';
  document.getElementById('overlayBtn').textContent = 'Done';
  document.getElementById('overlayBtn').onclick = ()=>{ state.campaign=null; location.reload(); };
  document.getElementById('overlay').classList.add('show');
}

function resumeCampaignFromStorage(progress){
  const camp = CAMPAIGNS.find(c=>c.id===progress.campaignId);
  if(!camp){ clearCampaignProgress(); showModeSelect(); return; }
  state.campaign = camp;
  state.campaignFlowIndex = progress.flowIndex;
  state.campaignLastWinner = progress.lastWinner;
  state.campaignRecord = progress.record || [];
  state.mode = progress.mode;
  state.aiSide = progress.aiSide;
  state.aiDifficulty = progress.aiDifficulty;
  runCampaignStep();
}

/* =========================================================
   BATTLE REPLAY — playback
   Steps through state.matchLog against a fresh copy of state.units
   restored from replayStartUnits. Reuses animateUnitTo/removeUnit so
   positions and Brigade-withdrawal cascades render exactly as they
   did live; log()/logReplay()/checkWinCondition() are all no-op'd
   while state.replaying is true (see their guards earlier in the file).
========================================================= */
let replayIdx = 0;
let replayTimer = null;
let replaySavedUnits = null; // the real, final game state — restored on exit
let replaySavedMeta = null;

function startReplay(){
  if(!state.matchLog || state.matchLog.length===0 || !state.replayStartUnits) return;
  document.getElementById('overlay').classList.remove('show');
  replaySavedUnits = state.units;
  replaySavedMeta = { phase:state.phase, turn:state.turn, turnNumber:state.turnNumber, selectedUnitId:state.selectedUnitId };
  state.units = JSON.parse(JSON.stringify(state.replayStartUnits));
  state.selectedUnitId = null;
  highlightCells = [];
  unitAnimations = {};
  state.replaying = true;
  replayIdx = 0;
  document.getElementById('unitOverlay').classList.remove('show');
  document.getElementById('replayOverlay').classList.remove('hidden');
  document.getElementById('replayPlayPauseBtn').textContent = 'Pause';
  document.getElementById('replayPlayPauseBtn').onclick = replayPlayPauseToggle;
  draw();
  playReplayStep();
}

function replayEventDelay(ev){
  if(ev.type==='fight' || ev.type==='fire') return 1500;
  if(ev.type==='status' && ev.newStatus==='Destroyed') return 1600;
  if(ev.type==='turnStart') return 500;
  return 320; // moves — fast auto-play, per the agreed pacing
}

function replayEventCaption(ev){
  if(ev.type==='fight'){
    const labels = {stalemate:'Held — drawn', pushback:'Pushed back', rout:'Routed', destroy:'Destroyed'};
    return `Fighting at the line: ${labels[ev.result]||ev.result}`;
  }
  if(ev.type==='fire'){
    const labels = {none:'No effect', disrupt:'Shaken', rout:'Falls back', destroy:'Destroyed'};
    return `Artillery fires: ${labels[ev.effect]||ev.effect}`;
  }
  if(ev.type==='status' && ev.newStatus==='Destroyed') return 'A unit is lost.';
  return '';
}

function showReplayHitRing(x,y){
  const wrap = document.getElementById('boardWrap');
  const rect = canvas.getBoundingClientRect();
  const wrapRect = wrap.getBoundingClientRect();
  const cellPxX = rect.width/COLS, cellPxY = rect.height/ROWS;
  const sy_ = sy(y);
  const ring = document.createElement('div');
  ring.className = 'replay-hit-ring';
  ring.style.left = (rect.left - wrapRect.left + x*cellPxX) + 'px';
  ring.style.top = (rect.top - wrapRect.top + sy_*cellPxY) + 'px';
  ring.style.width = cellPxX + 'px';
  ring.style.height = cellPxY + 'px';
  wrap.appendChild(ring);
  setTimeout(()=> ring.remove(), 1400);
}

function applyReplayEvent(ev){
  if(ev.type==='turnStart'){
    state.turn = ev.side;
    state.turnNumber = ev.turn;
    document.getElementById('replayTurnLabel').textContent = `Turn ${ev.turn} — ${SIDE_LABEL[ev.side]}`;
    return;
  }
  if(ev.type==='move'){
    const u = state.units.find(x=>x.id===ev.unitId);
    if(u && !u.removed) animateUnitTo(u, ev.to.x, ev.to.y);
    return;
  }
  if(ev.type==='fight'){
    showReplayHitRing(ev.x, ev.y);
    return;
  }
  if(ev.type==='fire'){
    showReplayHitRing(ev.x, ev.y);
    const u = state.units.find(x=>x.id===ev.targetId);
    if(u && ev.effect==='disrupt') u.turnOnly = true;
    return;
  }
  if(ev.type==='status'){
    const u = state.units.find(x=>x.id===ev.unitId);
    if(u && ev.newStatus==='Destroyed' && !u.removed){
      showReplayHitRing(ev.x, ev.y);
      removeUnit(u, ev.reason||'destroyed');
    }
    return;
  }
}

function playReplayStep(){
  if(!state.replaying) return; // exited mid-playback
  if(replayIdx >= state.matchLog.length){ finishReplay(); return; }
  const ev = state.matchLog[replayIdx];
  applyReplayEvent(ev);
  const caption = replayEventCaption(ev);
  if(caption) document.getElementById('replayEventLabel').textContent = caption;
  draw();
  replayIdx++;
  replayTimer = setTimeout(playReplayStep, replayEventDelay(ev));
}

function replayPlayPauseToggle(){
  if(replayTimer){
    clearTimeout(replayTimer); replayTimer = null;
    document.getElementById('replayPlayPauseBtn').textContent = 'Play';
  } else {
    document.getElementById('replayPlayPauseBtn').textContent = 'Pause';
    playReplayStep();
  }
}

function finishReplay(){
  document.getElementById('replayEventLabel').textContent = 'Replay complete.';
  document.getElementById('replayPlayPauseBtn').textContent = 'Watch Again';
  document.getElementById('replayPlayPauseBtn').onclick = ()=>{
    state.units = JSON.parse(JSON.stringify(state.replayStartUnits));
    state.selectedUnitId = null;
    unitAnimations = {};
    document.querySelectorAll('.replay-hit-ring').forEach(el=>el.remove());
    replayIdx = 0;
    document.getElementById('replayEventLabel').textContent = '';
    document.getElementById('replayPlayPauseBtn').textContent = 'Pause';
    document.getElementById('replayPlayPauseBtn').onclick = replayPlayPauseToggle;
    draw();
    playReplayStep();
  };
}

function exitReplay(){
  if(replayTimer){ clearTimeout(replayTimer); replayTimer = null; }
  state.replaying = false;
  state.units = replaySavedUnits;
  state.phase = replaySavedMeta.phase;
  state.turn = replaySavedMeta.turn;
  state.turnNumber = replaySavedMeta.turnNumber;
  state.selectedUnitId = replaySavedMeta.selectedUnitId;
  unitAnimations = {};
  document.getElementById('replayOverlay').classList.add('hidden');
  document.querySelectorAll('.replay-hit-ring').forEach(el=>el.remove());
  draw();
  document.getElementById('overlay').classList.add('show'); // back to the victory dialog
}
document.getElementById('replayExitBtn').onclick = exitReplay;

const _savedCampaignProgress = loadCampaignProgress();
if(_savedCampaignProgress){
  resumeCampaignFromStorage(_savedCampaignProgress);
} else {
  showModeSelect(true);
}
sizeCanvas();
</script>
