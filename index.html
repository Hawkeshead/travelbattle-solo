function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

/* =========================================================
   BATTLE REPLAY — event capture
   Every entry the replay player will step through. Kept deliberately
   lightweight (no dice arrays, no reasons lists) — just enough to drive
   the board visually and know when to pause. See REPLAY section near
   the bottom of the file for playback.
========================================================= */
function logReplay(type, data){
  if(!state.matchLog || state.replaying) return;
  state.matchLog.push(Object.assign({
    type, turn: state.turnNumber, phase: state.phase
  }, data));
}

// Assembles a short flavor paragraph from a narration bucket (opening + middle
// with {status} filled in + closing), picking randomly from each array for
// variety run to run. `variant` is 'win'|'loss' for the buckets that have a
// perspective split (always narrated from the ATTACKER's point of view — did
// their attack succeed or fail), omitted for buckets that don't (a genuine
// draw, or ranged artillery fire, which is unilateral).
function narrate(bucketKey, variant){
  const bucket = NARRATION[bucketKey];
  if(!bucket) return null;
  const scene = variant ? bucket[variant] : bucket;
  if(!scene) return null;
  const status = bucket.status;
  const line = [pick(scene.opening), pick(scene.middle).replace('{status}', status), pick(scene.closing)].join(' ');
  return line;
}
function logNarration(bucketKey, variant){
  const line = narrate(bucketKey, variant);
  if(line) log(line, 'narrative');
}
const PIP_LAYOUT = {1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
function dieFaceHTML(value, extraClass){
  const active = PIP_LAYOUT[value] || [];
  let cells = '';
  for(let i=0;i<9;i++) cells += active.includes(i) ? '<span class="pip"></span>' : '<span></span>';
  return `<div class="die ${extraClass||''}">${cells}</div>`;
}

// Shows a dice group in PENDING state (labels + bonus notes visible, dice faces
// blank) and waits for the roll to actually be triggered — a tap for a human
// player, or a brief pause for the AI, so it doesn't look abruptly different
// from watching a human turn. Nothing is randomized until onTrigger fires.
let FAST_DICE_MODE = false; // test/simulation harnesses only — never set by real gameplay
function presentRollTrigger(groups, triggerSide, onTrigger, legendText){
  const overlay = document.getElementById('diceOverlay');
  const groupsEl = overlay.querySelector('.dice-groups');
  const resultEl = overlay.querySelector('.dice-result');
  const rollBtn = document.getElementById('diceRollBtn');
  const legendEl = document.getElementById('diceLegend');
  clearTimeout(showDice._fadeT);
  clearInterval(showDice._rollT);
  clearTimeout(presentRollTrigger._aiT);

  overlay.classList.add('show');
  resultEl.textContent = '';
  resultEl.className = 'dice-result';
  if(legendEl){ legendEl.textContent = legendText || ''; legendEl.style.display = legendText ? 'block' : 'none'; }
  groupsEl.innerHTML = groups.map((g,i)=>{
    const diceHTML = Array(g.diceCount||1).fill(0).map(()=>dieFaceHTML(null,'pending')).join('');
    const notesHTML = (g.notes && g.notes.length) ?
      `<div class="dice-notes">${g.notes.map(n=>`<span>${n}</span>`).join('')}</div>` : '';
    const sep = i<groups.length-1 ? '<div class="dice-vs">vs</div>' : '';
    return `<div class="dice-group"><div class="glabel">${g.label}</div><div class="dice-set">${diceHTML}</div>${notesHTML}</div>${sep}`;
  }).join('');

  const isHuman = !(state.mode==='ai' && triggerSide===state.aiSide);
  if(FAST_DICE_MODE){ onTrigger(); return; }
  if(isHuman){
    rollBtn.style.display = 'inline-block';
    rollBtn.disabled = false;
    rollBtn.onclick = ()=>{ rollBtn.style.display='none'; onTrigger(); };
  } else {
    rollBtn.style.display = 'none';
    presentRollTrigger._aiT = setTimeout(onTrigger, 550);
  }
}

// groups: [{label, rolls:[1,4], keptValue:4, ...}] — rolls is every die actually
// rolled for that side (bonus/re-roll dice included), keptValue is the one that counts.
// The animation is purely cosmetic: the real values are already decided by the time
// this is called, so it briefly flickers random faces before settling on them.
// onSettled fires once the popup has fully faded — board consequences (push-backs,
// removals, retreats) are deferred until then, so they never animate behind
// dice you're still reading.
function showDice(groups, resultText, resultCls, onSettled){
  const overlay = document.getElementById('diceOverlay');
  const groupsEl = overlay.querySelector('.dice-groups');
  const resultEl = overlay.querySelector('.dice-result');
  const rollBtn = document.getElementById('diceRollBtn');
  const legendEl = document.getElementById('diceLegend');
  if(legendEl) legendEl.style.display = 'none';
  rollBtn.style.display = 'none';
  clearTimeout(showDice._fadeT);
  clearInterval(showDice._rollT);

  function renderFrame(final){
    groupsEl.innerHTML = groups.map((g,i)=>{
      const diceHTML = g.rolls.map(v=>{
        const shown = final ? v : (1+Math.floor(Math.random()*6));
        const cls = final ? (v===g.keptValue ? 'kept' : (g.rolls.length>1 ? 'discard' : '')) : 'rolling';
        return dieFaceHTML(shown, cls);
      }).join('');
      const notesHTML = (final && g.notes && g.notes.length) ?
        `<div class="dice-notes">${g.notes.map(n=>`<span>${n}</span>`).join('')}</div>` : '';
      const sep = i<groups.length-1 ? '<div class="dice-vs">vs</div>' : '';
      return `<div class="dice-group"><div class="glabel">${g.label}</div><div class="dice-set">${diceHTML}</div>${notesHTML}</div>${sep}`;
    }).join('');
  }

  overlay.classList.add('show');
  resultEl.textContent = '';
  resultEl.className = 'dice-result';
  if(FAST_DICE_MODE){
    renderFrame(true);
    resultEl.textContent = resultText || '';
    resultEl.className = 'dice-result ' + (resultCls||'');
    overlay.classList.remove('show');
    if(onSettled) onSettled();
    return;
  }
  renderFrame(false);
  let ticks = 0;
  showDice._rollT = setInterval(()=>{
    ticks++;
    if(ticks>=4){
      clearInterval(showDice._rollT);
      renderFrame(true);
      resultEl.textContent = resultText || '';
      resultEl.className = 'dice-result ' + (resultCls||'');
    } else {
      renderFrame(false);
    }
  }, 180);
  showDice._fadeT = setTimeout(()=>{
    overlay.classList.remove('show');
    if(onSettled) onSettled();
  }, 2900); // was 3400 — trimmed 500ms per feedback
}

/* =========================================================
   GEOMETRY HELPERS
========================================================= */
function inBounds(x,y){ return x>=0 && x<COLS && y>=0 && y<ROWS; }
function terrainAt(x,y){ return TERRAIN[state.terrain[y][x]]; }
function unitsAt(x,y){ return state.units.filter(u=>!u.removed && u.x===x && u.y===y); }
function unitAt(x,y, excludeId){ return state.units.find(u=>!u.removed && u.x===x && u.y===y && u.id!==excludeId); }

// Stacked squares (doubled infantry in open terrain) hold up to 2 units.
// A single tap only ever reached the first one — repeated taps on the same
// square now cycle through whichever units are actually there.
function pickUnitAtCell(x,y){
  const list = unitsAt(x,y);
  if(list.length===0) return null;
  if(list.length===1) return list[0];
  const key = x+','+y;
  if(state._stackCycle && state._stackCycle.key===key){
    state._stackCycle.idx = (state._stackCycle.idx+1) % list.length;
  } else {
    state._stackCycle = {key, idx:0};
  }
  return list[state._stackCycle.idx];
}
function isAdjacent(a,b){ return Math.max(Math.abs(a.x-b.x), Math.abs(a.y-b.y)) === 1; }

// Woods physically conceal whoever's standing in them (the tree-cluster piece
// acts as a lid on the real board) — this is automatic for ANY unit in a Woods
// square, not just one that's declared Lay Ambush. A declared ambush (u.hidden)
// is a separate, additional layer: same base concealment, plus the spring/bonus
// mechanics. Concealment only affects ranged targeting and AI awareness — an
// adjacent enemy can always see and fight a unit normally, concealed or not.
function isConcealedFromEnemy(unit){
  if(unit.hidden) return true;
  return terrainAt(unit.x, unit.y).key === 'WOODS';
}
// Ambush status is only meaningful while standing in the Woods that conceal it —
// a defensive invariant, checked at the start of every turn.
function enforceAmbushWoodsInvariant(){
  for(const u of state.units){
    if(u.hidden && terrainAt(u.x,u.y).key!=='WOODS') u.hidden = false;
  }
}
function neighbors8(x,y){
  const out=[];
  for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){
    if(dx===0&&dy===0) continue;
    const nx=x+dx, ny=y+dy;
    if(inBounds(nx,ny)) out.push({x:nx,y:ny,dx,dy});
  }
  return out;
}

/* =========================================================
   COHESION: which units in a brigade can currently move
   (must trace a touching-chain, incl. diagonal, back to the Brigadier)
   Computed per-Brigade — a side fields 3 independent Brigades, each
   with its own Brigadier and its own chain.
========================================================= */
function movableUnitsForSide(side){
  const mine = state.units.filter(u=>!u.removed && u.side===side);
  const brigadeIds = [...new Set(mine.map(u=>u.brigadeId))];
  const connected = new Set();
  for(const bId of brigadeIds){
    const group = mine.filter(u=>u.brigadeId===bId);
    const brig = group.find(u=>u.type==='BRIGADIER');
    if(!brig){ group.forEach(u=>connected.add(u.id)); continue; } // Brigadier down: this Brigade's survivors act independently
    const local = new Set([brig.id]);
    let changed = true;
    while(changed){
      changed = false;
      for(const u of group){
        if(local.has(u.id)) continue;
        for(const other of group){
          if(!local.has(other.id)) continue;
          if(isAdjacent(u, other)){ local.add(u.id); changed = true; break; }
        }
      }
    }
    local.forEach(id=>connected.add(id));
  }
  return connected;
}

/* =========================================================
   MOVEMENT: BFS over grid, diagonal = 1 step, respects terrain
   and stacking, road bonus if start & end both on road.
========================================================= */
// Artillery brigaded entirely with Cavalry (no other combat unit types in the
// same Brigade) fights as Horse Artillery: moves at Cavalry speed everywhere
// except a ploughed field.
function isHorseArtillery(u){
  if(u.type !== 'ARTILLERY') return false;
  const groupmates = state.units.filter(o=>!o.removed && o.side===u.side && o.brigadeId===u.brigadeId && o.id!==u.id && o.type!=='BRIGADIER');
  if(groupmates.length===0) return false;
  return groupmates.every(o => UNIT_TYPES[o.type].isCavalry);
}
function isCavalryOrHorseArtillery(u){
  return UNIT_TYPES[u.type].isCavalry || isHorseArtillery(u);
}
function brigadeCavalryCount(u){
  return state.units.filter(o=>!o.removed && o.side===u.side && o.brigadeId===u.brigadeId && UNIT_TYPES[o.type].isCavalry).length;
}
function brigadeHasCavalryEscort(u){
  const available = brigadeCavalryCount(u);
  const key = u.side+'-'+u.brigadeId;
  const used = (state.ploughEscortUsed && state.ploughEscortUsed[key]) || 0;
  return used < available;
}
function consumePloughEscort(u){
  if(!state.ploughEscortUsed) state.ploughEscortUsed = {};
  const key = u.side+'-'+u.brigadeId;
  state.ploughEscortUsed[key] = (state.ploughEscortUsed[key]||0) + 1;
}

// A clean 2-square Cavalry run in one consistent direction (no pivot), not
// crossing a ploughed field. Detected purely from start/end coordinates:
// covering a 2-square straight-line displacement in exactly 2 steps is only
// possible without a pivot, so no separate path-tracking is needed.
function isCleanChargeRun(fromX, fromY, toX, toY){
  const dx = toX - fromX, dy = toY - fromY;
  const straight = (dx===0 || Math.abs(dx)===2) && (dy===0 || Math.abs(dy)===2) && !(dx===0 && dy===0);
  if(!straight) return false;
  const midX = fromX + dx/2, midY = fromY + dy/2;
  if(terrainAt(fromX,fromY).plough || terrainAt(midX,midY).plough || terrainAt(toX,toY).plough) return false;
  return true;
}
// Is `pos` adjacent to at least one enemy this side could legally charge? (not in
// Square, and not on higher ground than the charging destination — matches the
// "can't charge uphill or against a Square" restriction).
function hasChargeableTargetAt(side, pos){
  return state.units.some(o=>!o.removed && o.side!==side && !isConcealedFromEnemy(o) && isAdjacent(pos,o) &&
    o.formation!=='square' && terrainAt(o.x,o.y).elevation<=terrainAt(pos.x,pos.y).elevation);
}
// Every legal move for a Cavalry unit that would count as a clean charge run
// AND land it adjacent to something worth charging — the set of squares the
// Charge button highlights.
function computeChargeDestinations(u){
  if(!UNIT_TYPES[u.type].isCavalry) return [];
  return legalMoves(u).filter(m => isCleanChargeRun(u.x,u.y,m.x,m.y) && hasChargeableTargetAt(u.side, m));
}

function unitBaseMove(u){
  if(isHorseArtillery(u)) return UNIT_TYPES.HEAVY_CAV.move;
  return UNIT_TYPES[u.type].move;
}

// Buildings sit on the road network (see the board art — every building square
// is placed on or beside a road), so they grant the same "+1 square if you
// start and end your move on a road" bonus a plain road square does.
function isRoadLike(terr){ return !!(terr.isRoad || terr.key==='BUILDING'); }

function legalMoves(u){
  if(u.formation==='square') return []; // squares don't move
  if(u.turnOnly) return [];
  if(state.moved && state.moved.has(u.id)) return []; // already moved (or explicitly stood pat) this phase
  const connected = movableUnitsForSide(u.side);
  if(!connected.has(u.id)) return [];

  let allowance = unitBaseMove(u);
  const startRoad = isRoadLike(terrainAt(u.x,u.y));
  const cavOrHorseArty = isCavalryOrHorseArtillery(u);
  const isFootArtillery = UNIT_TYPES[u.type].isArtillery && !isHorseArtillery(u);
  const hasEscort = isFootArtillery ? brigadeHasCavalryEscort(u) : false;

  const dist = new Map();
  const startKey = u.x+','+u.y;
  dist.set(startKey, 0);
  const queue = [{x:u.x,y:u.y,d:0}];
  const results = [];
  const maxSteps = allowance + (startRoad?1:0); // optimistic cap; road bonus validated per-destination below

  while(queue.length){
    const cur = queue.shift();
    if(cur.d >= maxSteps) continue;
    for(const n of neighbors8(cur.x, cur.y)){
      const key = n.x+','+n.y;
      const nd = cur.d + 1;
      if(dist.has(key) && dist.get(key) <= nd) continue;
      const terr = terrainAt(n.x,n.y);
      const t = UNIT_TYPES[u.type];
      if(terr.restrictTo && !terr.restrictTo.includes(t.key)) continue;
      if(terr.plough && isFootArtillery && !hasEscort) continue; // Foot Artillery needs a Cavalry escort in its Brigade to cross a ploughed field
      // occupancy check
      const occ = unitsAt(n.x,n.y).filter(o=>o.id!==u.id && o.side===u.side);
      const enemyUnitsHere = unitsAt(n.x,n.y).filter(o=>o.side!==u.side);
      const enemyOcc = enemyUnitsHere.length>0 && !(enemyUnitsHere.length===1 && enemyUnitsHere[0].type==='BRIGADIER');
      if(enemyOcc) continue; // can't move onto an enemy square (that's a fight, not a move) — except a lone Brigadier, who gets shoved aside instead
      if(occ.length>0){
        const canDouble = terr.allowDouble && (t.key==='INFANTRY'||t.key==='GUARD') && occ.every(o=>UNIT_TYPES[o.type].key==='INFANTRY'||UNIT_TYPES[o.type].key==='GUARD') && occ.length<2;
        if(!canDouble) continue;
      }
      dist.set(key, nd);
      queue.push({x:n.x,y:n.y,d:nd});
    }
  }

  const startPlough = terrainAt(u.x,u.y).plough;
  for(const [key,d] of dist){
    if(key===startKey) continue;
    const [x,y] = key.split(',').map(Number);
    const endRoad = isRoadLike(terrainAt(x,y));
    let effAllowance = (startRoad && endRoad) ? allowance+1 : allowance;
    const endPlough = terrainAt(x,y).plough;
    if(cavOrHorseArty && (startPlough || endPlough)) effAllowance = Math.min(effAllowance, 1); // hard going for horses starting or ending on a ploughed field
    if(d <= effAllowance) results.push({x,y,steps:d});
  }
  return results;
}

/* =========================================================
   ARTILLERY: RANGE, LINE OF SIGHT
========================================================= */
function chebyshev(a,b){ return Math.max(Math.abs(a.x-b.x), Math.abs(a.y-b.y)); }

function lineCells(a,b){
  // Bresenham-ish supercover line between cell centers, used for LOS sampling
  const cells = [];
  let x0=a.x, y0=a.y, x1=b.x, y1=b.y;
  const dx = Math.abs(x1-x0), dy = Math.abs(y1-y0);
  const sx = x0<x1?1:-1, sy = y0<y1?1:-1;
  let err = dx-dy, x=x0, y=y0;
  while(true){
    cells.push({x,y});
    if(x===x1 && y===y1) break;
    const e2 = 2*err;
    if(e2 > -dy){ err -= dy; x += sx; }
    if(e2 < dx){ err += dx; y += sy; }
  }
  return cells;
}

function hasLOS(gun, target){
  if(chebyshev(gun,target) > 6) return false;
  const path = lineCells(gun,target).slice(1,-1); // exclude endpoints
  const gunElev = terrainAt(gun.x,gun.y).elevation;
  const tgtElev = terrainAt(target.x,target.y).elevation;
  const shooterElevated = gunElev > 0 || tgtElev > 0;
  let blockedCount = 0;
  for(const c of path){
    const terr = terrainAt(c.x,c.y);
    const occ = unitsAt(c.x,c.y).length>0;
    const blocksHere = terr.blocksLOS || occ;
    if(blocksHere){
      // overhead fire allowed if gun or target is on higher ground than the obstruction
      if(shooterElevated && terr.elevation <= Math.max(gunElev,tgtElev)) continue;
      blockedCount++;
    }
  }
  // "needs to see half or more of target" -> simplified: no more than half the path may be blocked
  return blockedCount === 0 || (blockedCount / Math.max(path.length,1)) < 0.5;
}

function artilleryTargets(gun){
  if(gun.turnOnly) return []; // pushed/shaken: can only turn around, not fire
  if(state.fired && state.fired.has(gun.id)) return []; // already fired this phase
  if(state.moved && state.moved.has(gun.id)) return []; // moved this turn — Artillery is move OR fire, never both
  if(isInActiveFight(gun)) return []; // in contact with an enemy: it joins the Fight phase instead of firing at range
  return state.units.filter(t=>!t.removed && !isConcealedFromEnemy(t) && t.type!=='BRIGADIER' && t.side!==gun.side && hasLOS(gun,t) && !isInActiveFight(t));
}
function isInActiveFight(u){
  return state.units.some(o=>!o.removed && o.side!==u.side && isAdjacent(o,u));
}

/* =========================================================
   COMBAT
========================================================= */
function rollD6(){ return 1+Math.floor(Math.random()*6); }
function rollBest(n){ let best=0; const all=[]; for(let i=0;i<n;i++){const r=rollD6(); all.push(r); if(r>best) best=r;} return {value:best, rolls:all}; }

// Two Infantry/Guard units doubled into the same open-terrain square form
// a Column: a genuine combat bonus, not just shared artillery vulnerability.
function stackPartner(u){
  if(!(u.type==='INFANTRY'||u.type==='GUARD')) return null;
  return state.units.find(o=>!o.removed && o.id!==u.id && o.side===u.side && o.x===u.x && o.y===u.y && (o.type==='INFANTRY'||o.type==='GUARD'));
}
function isInColumn(u){ return !!stackPartner(u); }

// Every combat bonus that grants a unit a 2nd die comes from a different source
// (Guard/Hvy Cav's innate re-roll, terrain, Square vs Cavalry, Cavalry vs open
// Infantry, Attack Column, Infantry vs Square, Ambush-Advance). Only the FIRST
// applicable source actually does anything — a 2nd die is a 2nd die no matter
// how many reasons justify it. Previously every source past the first was
// simply wasted. Now each additional qualifying source instead adds +1 to the
// kept roll value (capped at 6, same mechanic already used for the Ambush and
// turned-around bonuses), so a unit that qualifies for the 2nd die three ways
// over gets a real edge from the extra two rather than nothing at all.
function combatBonuses(unit, opponent, defending, extraSources){
  const t = UNIT_TYPES[unit.type];
  const oppT = UNIT_TYPES[opponent.type];
  const terr = terrainAt(unit.x,unit.y);
  const sources = [];

  if(t.reroll) sources.push('Re-roll (Guard/Hvy Cav)');

  const eligibleDefender = t.key==='INFANTRY' || t.key==='GUARD' || t.key==='ARTILLERY';
  // A unit that sprang a Woodland Ambush this round gets no woods defence bonus until its side's next turn.
  const ambushSuppressed = terr.key==='WOODS' && unit.ambushSpentThisRound;
  if(defending && terr.defenseBonus && eligibleDefender && !ambushSuppressed){
    sources.push(terr.key==='WOODS' ? 'Defending in woods' : 'Defending in a building');
  }
  if(oppT.isCavalry && (t.key==='INFANTRY'||t.key==='GUARD') && unit.formation==='square'){
    sources.push('Square vs Cavalry');
  }
  // Cavalry fighting Infantry/Guard not in Square rolls a second die, regardless of
  // whether the Cavalry is attacking or defending (ruleset makes no attacker-only
  // distinction here).
  if(t.isCavalry && (oppT.key==='INFANTRY'||oppT.key==='GUARD') && opponent.formation!=='square'){
    sources.push('Cavalry vs non-Square Infantry');
  }
  if((t.key==='INFANTRY'||t.key==='GUARD') && isInColumn(unit)){
    sources.push('Attack Column');
  }
  // Infantry attacking a Square (and not itself in Square) rolls a second die —
  // attacker-only, since a Square never initiates a fight (it can't move).
  if(!defending && (t.key==='INFANTRY'||t.key==='GUARD') && unit.formation!=='square' && (oppT.key==='INFANTRY'||oppT.key==='GUARD') && opponent.formation==='square'){
    sources.push('Infantry vs Square');
  }
  for(const ex of (extraSources||[])){ if(ex.applies) sources.push(ex.reason); }

  let dice = 1, valueBonus = 0;
  const reasons = [];
  sources.forEach((label, i)=>{
    if(i===0){ dice = 2; reasons.push(label); }
    else { valueBonus += 1; reasons.push(`${label}: +1 to roll (2nd die already granted)`); }
  });
  return { dice, valueBonus, reasons };
}

function resolveFight(attacker, defender, ambushMode, onComplete){
  onComplete = onComplete || function(){};
  showActionLine(attacker, defender, '#a8720b', 3800);
  const aType = UNIT_TYPES[attacker.type], dType = UNIT_TYPES[defender.type];
  const aExtra = [];
  if(ambushMode==='advance') aExtra.push({applies:true, reason:'Ambush: committed second die'});
  const aBonus = combatBonuses(attacker, defender, false, aExtra);
  const dBonus = combatBonuses(defender, attacker, true, []);
  let aDice = aBonus.dice, dDice = dBonus.dice;
  const aReasons = [...aBonus.reasons], dReasons = [...dBonus.reasons];
  // Surface the Charge as a visible factor in the roll popup even when it isn't the
  // deciding one (previously only appeared if it happened to win a tie, which made
  // charging look like it did nothing most of the time).
  if(attacker.charged && aType.isCavalry && dType.key!=='BRIGADIER'){
    aReasons.push('Charging: wins ties outright');
  }
  // House rule: a unit still turned around from a prior pushback (or an artillery
  // result of 4) gives the attacker +1 to their rolled value (capped at 6) if
  // struck while in that state — same phrasing/mechanic as the Ambush bonus.
  let aValueBonus = aBonus.valueBonus, dValueBonus = dBonus.valueBonus;
  if(defender.turnOnly){ aValueBonus += 1; aReasons.push('Defender turned around: +1 to roll'); }
  if(ambushMode){ aValueBonus += 1; aReasons.push('Ambush: +1 to roll (capped at 6)'); }
  // Infantry, Guard, and Cavalry all get +1 to the roll when attacking Artillery.
  if((aType.key==='INFANTRY'||aType.key==='GUARD'||aType.isCavalry) && dType.key==='ARTILLERY'){
    aValueBonus += 1; aReasons.push('Attacking Artillery: +1 to roll');
  }

  const aName = SIDE_LABEL[attacker.side].split(' ')[0], dName = SIDE_LABEL[defender.side].split(' ')[0];
  const tieWinNote = attacker.charged && aType.isCavalry && defender.formation!=='square' ? `${aName} wins ties (Charge)`
    : isInColumn(attacker) && (aType.key==='INFANTRY'||aType.key==='GUARD') ? `${aName} wins ties (Column)`
    : null;
  const legend = 'Draw: fight continues \u00b7 Margin 1: pushed back \u00b7 Margin 2: routed \u00b7 Margin 3+: destroyed' + (tieWinNote ? ` \u00b7 ${tieWinNote}` : '');

  presentRollTrigger([
    {label:aName, diceCount:aDice, notes:aReasons},
    {label:dName, diceCount:dDice, notes:dReasons}
  ], attacker.side, ()=>{
    const aRoll = rollBest(aDice);
    const dRoll = rollBest(dDice);
    if(aValueBonus) aRoll.value = Math.min(6, aRoll.value + aValueBonus);
    if(dValueBonus) dRoll.value = Math.min(6, dRoll.value + dValueBonus);

    const isTie = aRoll.value === dRoll.value;
    const defenderHillTieWin = isTie &&
      terrainAt(defender.x,defender.y).elevation > terrainAt(attacker.x,attacker.y).elevation;
    const attackerChargeTieWin = isTie && !defenderHillTieWin && attacker.charged &&
      UNIT_TYPES[attacker.type].isCavalry && defender.formation!=='square' &&
      terrainAt(defender.x,defender.y).elevation <= terrainAt(attacker.x,attacker.y).elevation;
    const attackerColumnTieWin = isTie && !defenderHillTieWin && !attackerChargeTieWin &&
      (aType.key==='INFANTRY'||aType.key==='GUARD') && isInColumn(attacker);
    const genuineDraw = isTie && !defenderHillTieWin && !attackerChargeTieWin && !attackerColumnTieWin;

    let resultText, resultCls;
    if(genuineDraw){ resultText = 'Drawn — continues next turn'; resultCls = 'draw'; }
    else if(defenderHillTieWin){ resultText = `${dName} holds the high ground`; resultCls = 'win'; dReasons.push('Tie-win: Hill defence'); }
    else if(attackerChargeTieWin){ resultText = `${aName}'s charge carries the tie`; resultCls = 'win'; aReasons.push('Tie-win: Charge'); }
    else if(attackerColumnTieWin){ resultText = `${aName}'s Column carries the tie`; resultCls = 'win'; aReasons.push('Tie-win: Attack Column'); }
    else if(aRoll.value > dRoll.value){ resultText = `${aName} wins by ${aRoll.value-dRoll.value}`; resultCls = 'win'; }
    else { resultText = `${dName} wins by ${dRoll.value-aRoll.value}`; resultCls = 'win'; }

    showDice([
      {label:aName, rolls:aRoll.rolls, keptValue:aRoll.value, notes:aReasons},
      {label:dName, rolls:dRoll.rolls, keptValue:dRoll.value, notes:dReasons}
    ], resultText, resultCls, ()=>{
      // Deferred until the popup has fully faded — nothing on the board moves
      // while there are still dice on screen to read.
      attacker.charged = false; // spent, win or lose — a charge is a one-shot burst of momentum

      const fightOutcome = genuineDraw ? 'stalemate'
        : (defenderHillTieWin || attackerChargeTieWin || attackerColumnTieWin) ? 'pushback'
        : (Math.abs(aRoll.value-dRoll.value)>=3 ? 'destroy' : Math.abs(aRoll.value-dRoll.value)===2 ? 'rout' : 'pushback');
      logReplay('fight', {
        attackerId: attacker.id, defenderId: defender.id,
        attackerSide: attacker.side, defenderSide: defender.side,
        x: defender.x, y: defender.y, result: fightOutcome,
        aRoll: aRoll.value, dRoll: dRoll.value
      });

      if(genuineDraw){
        log(`${aType.label} vs ${dType.label}: ${aRoll.value}-${dRoll.value}, drawn — fight continues next turn.`, 'combat');
        logNarration('melee_stalemate');
        onComplete();
        return;
      }
      if(defenderHillTieWin){
        log(`${dType.label} holds the high ground against ${aType.label}: ${aRoll.value}-${dRoll.value} tie goes to the defender.`, 'combat');
        logNarration('melee_pushback', 'loss');
        pushBack(attacker, defender);
        onComplete();
        return;
      }
      if(attackerChargeTieWin || attackerColumnTieWin){
        const reason = attackerChargeTieWin ? 'a clean charge' : 'a Column formation';
        log(`${aType.label}'s ${reason} carries the ${aRoll.value}-${dRoll.value} tie against ${dType.label}.`, 'combat');
        logNarration('melee_pushback', 'win');
        pushBack(defender, attacker);
        onComplete();
        return;
      }
      const winnerIsAttacker = aRoll.value > dRoll.value;
      const winner = winnerIsAttacker ? attacker : defender;
      const loser = winnerIsAttacker ? defender : attacker;
      const diff = Math.abs(aRoll.value - dRoll.value);
      log(`${unitLabel(attacker)} (${SIDE_LABEL[attacker.side]}) vs ${unitLabel(defender)} (${SIDE_LABEL[defender.side]}): ${aRoll.value}-${dRoll.value}. ${unitLabel(loser)} of ${SIDE_LABEL[loser.side]} takes the worse of it.`, 'combat');

      const columnPartner = stackPartner(loser); // a broken Column takes both units with it
      const attackerSucceeded = winnerIsAttacker;
      if(diff===1){
        logNarration('melee_pushback', attackerSucceeded ? 'win' : 'loss');
        pushBack(loser, winner);
        onComplete();
      } else if(diff===2){
        logNarration('melee_rout', attackerSucceeded ? 'win' : 'loss');
        retreatAndRally(loser, ()=>{
          if(columnPartner) retreatAndRally(columnPartner, onComplete);
          else onComplete();
        });
      } else {
        logNarration('melee_destroy', attackerSucceeded ? 'win' : 'loss');
        removeUnit(loser, 'destroyed in combat');
        if(columnPartner) removeUnit(columnPartner, 'Column broken alongside its partner');
        onComplete();
      }
    });
  }, legend);
}

function pushBack(loser, winner){
  const dx = Math.sign(loser.x - winner.x) || 0;
  const dy = Math.sign(loser.y - winner.y) || 0;
  const nx = loser.x + dx, ny = loser.y + dy;
  if(inBounds(nx,ny) && !unitsAt(nx,ny).some(o=>o.side!==loser.side)){
    // shove any friendly unit already standing in the landing square one further step back
    const blocker = unitsAt(nx,ny).find(o=>o.side===loser.side && o.id!==loser.id);
    let landingClear = true;
    if(blocker){
      const bx = nx+dx, by = ny+dy;
      if(inBounds(bx,by) && unitsAt(bx,by).length===0){
        animateUnitTo(blocker, bx, by);
        blocker.turnOnly = true;
        log(`${unitLabel(blocker)} is shoved back by the retreat.`, 'combat');
      } else {
        landingClear = false; // nowhere for the blocker to go — loser can't retreat into it either
      }
    }
    if(landingClear){ animateUnitTo(loser, nx, ny); }
  } else if(!inBounds(nx,ny)){
    // Already at the board edge with nowhere further to go — house rule: run to the
    // nearest corner of its own edge instead of simply standing in place.
    const edgeY = loser.side===SIDES.RED ? ROWS-1 : 0;
    const preferredCornerX = loser.x < COLS/2 ? 0 : COLS-1;
    const corner = findNearestFreeEdgeCell(edgeY, preferredCornerX, loser.id);
    if(corner && (corner.x!==loser.x || corner.y!==loser.y)){
      animateUnitTo(loser, corner.x, corner.y);
      log(`${unitLabel(loser)} has nowhere left to give and bolts for the corner.`, 'combat');
    }
  }
  loser.turnOnly = true;
  log(`${unitLabel(loser)} pushed back and turned around; can only turn around next turn.`, 'combat');
}

function retreatAndRally(loser, onComplete){
  onComplete = onComplete || function(){};
  const brig = state.units.find(u=>!u.removed && u.side===loser.side && u.type==='BRIGADIER' && u.brigadeId===loser.brigadeId);
  const edgeY = loser.side===SIDES.RED ? ROWS-1 : 0;
  const preferredX = brig ? clamp(brig.x,0,COLS-1) : loser.x;
  const cell = findNearestFreeEdgeCell(edgeY, preferredX, loser.id);
  animateUnitTo(loser, cell.x, cell.y);
  loser.turnOnly = true;
  loser.rallying = true;
  const t = UNIT_TYPES[loser.type];
  let successOn = [4,5,6];
  if(t.key==='GUARD') successOn = [3,4,5,6];
  if(t.key==='ARTILLERY') successOn = [5,6];
  const rallyNote = t.key==='GUARD' ? ['Guard Infantry: needs 3+'] : t.key==='ARTILLERY' ? ['Artillery: needs 5+'] : [];

  presentRollTrigger([{label:'Rally', diceCount:1, notes:rallyNote}], loser.side, ()=>{
    const r = rollD6();
    const success = successOn.includes(r);
    showDice([{label:'Rally', rolls:[r], keptValue:r, notes:rallyNote}], success ? 'Rallies!' : 'Fails to rally', success ? 'win' : 'lose', ()=>{
      if(success){
        log(`${unitLabel(loser)} falls back to the board edge and RALLIES (rolled ${r}).`, 'combat');
        logNarration('rally_success');
        logReplay('status', { unitId:loser.id, side:loser.side, x:loser.x, y:loser.y, newStatus:'Rallied' });
        onComplete();
        return;
      }
      log(`${unitLabel(loser)} fails to rally (rolled ${r}).`, 'combat');
      if(brig && !brig.leadershipUsed){
        offerLeadershipRoll(loser, brig, onComplete);
      } else {
        logNarration('rally_failure');
        logReplay('status', { unitId:loser.id, side:loser.side, x:loser.x, y:loser.y, newStatus:'Lost' });
        removeUnit(loser, 'failed rally');
        onComplete();
      }
    });
  });
}

// Leadership Roll is one guaranteed save per Brigade for the whole match, so
// spending it on the first failed rally isn't automatically correct — it's
// worth asking (or, for the AI, weighing) whether THIS is the unit worth it.
function offerLeadershipRoll(loser, brig, onComplete){
  onComplete = onComplete || function(){};
  const isHuman = !FAST_DICE_MODE && !(state.mode==='ai' && loser.side===state.aiSide);
  if(!isHuman){
    const useIt = aiDecideLeadershipRoll(loser, brig);
    applyLeadershipRollChoice(loser, brig, useIt, onComplete);
    return;
  }
  document.getElementById('overlayTitle').textContent = 'Use Leadership Roll?';
  document.getElementById('overlayText').innerHTML =
    `${unitLabel(loser)} has failed to rally and will be removed unless you spend ${unitLabel(brig)}'s Leadership Roll — one guaranteed save for the whole match, for any unit in this Brigade. Use it now?`;
  document.getElementById('overlayBtn').style.display = 'none';
  const canvas = document.getElementById('rotationPreviewCanvas');
  if(canvas) canvas.style.display = 'none';
  let extra = document.getElementById('modeChoices');
  extra.innerHTML = '';
  extra.style.display = 'flex';
  const yesBtn = document.createElement('button');
  yesBtn.className = 'primary';
  yesBtn.textContent = 'Use Leadership Roll';
  yesBtn.onclick = ()=>{ extra.style.display='none'; document.getElementById('overlay').classList.remove('show'); applyLeadershipRollChoice(loser, brig, true, onComplete); };
  const noBtn = document.createElement('button');
  noBtn.textContent = 'Let the Unit Go';
  noBtn.onclick = ()=>{ extra.style.display='none'; document.getElementById('overlay').classList.remove('show'); applyLeadershipRollChoice(loser, brig, false, onComplete); };
  extra.appendChild(yesBtn);
  extra.appendChild(noBtn);
  document.getElementById('overlay').classList.add('show');
}

function applyLeadershipRollChoice(loser, brig, useIt, onComplete){
  onComplete = onComplete || function(){};
  if(useIt){
    brig.leadershipUsed = true;
    log(`${unitLabel(loser)} fails to rally, but ${unitLabel(brig)}'s Leadership Roll guarantees it — saved! (one-time use, now spent)`, 'combat');
    logNarration('rally_success');
  } else {
    log(`${unitLabel(loser)} is removed from the field.`, 'combat');
    logNarration('rally_failure');
    removeUnit(loser, 'failed rally');
  }
  onComplete();
}

// AI heuristic: save the unit if its Brigade is already close to breaking (this
// loss would matter a lot) or if the unit itself is high-value (Guard, Heavy
// Cavalry, Artillery) — otherwise bank the Leadership Roll for later.
function aiDecideLeadershipRoll(loser, brig){
  const remaining = state.units.filter(o=>!o.removed && o.side===loser.side && o.brigadeId===loser.brigadeId && o.type!=='BRIGADIER').length;
  const closeToBreaking = remaining<=2; // includes the loser itself, not yet removed
  const highValue = AI_UNIT_VALUE[loser.type] >= 5;
  return closeToBreaking || highValue;
}

function findNearestFreeEdgeCell(edgeY, preferredX, excludeId){
  let candidates = [];
  for(let x=0;x<COLS;x++){
    if(unitsAt(x,edgeY).some(o=>o.id!==excludeId)) continue;
    candidates.push({x, y:edgeY, dist: Math.abs(x-preferredX)});
  }
  if(candidates.length===0) return {x:clamp(preferredX,0,COLS-1), y:edgeY}; // edge is full — fall back to overlap rather than throw
  candidates.sort((a,b)=>a.dist-b.dist);
  return candidates[0];
}

function clamp(v,min,max){ return Math.max(min,Math.min(max,v)); }

function removeUnit(u, reason){
  u.removed = true;
  logReplay('status', { unitId:u.id, side:u.side, x:u.x, y:u.y, newStatus:'Destroyed', reason });
  addDeathEffect(u.x, u.y);
  log(`${unitLabel(u)} (${SIDE_LABEL[u.side]}) removed: ${reason}.`, 'system');
  if(u.type!=='BRIGADIER'){
    const brig = state.units.find(o=>!o.removed && o.side===u.side && o.brigadeId===u.brigadeId && o.type==='BRIGADIER');
    if(brig){
      const remaining = state.units.filter(o=>!o.removed && o.side===u.side && o.brigadeId===u.brigadeId && o.type!=='BRIGADIER');
      if(remaining.length===0){
        brig.removed = true; // withdraws, not killed — no death effect for a non-combat unit
        log(`${unitLabel(brig)} (${SIDE_LABEL[brig.side]}) withdraws — the Brigade is broken.`, 'system');
      }
    }
  }
  checkWinCondition();
  renderBrigadeStatus();
}

function checkWinCondition(){
  if(state.replaying) return;
  if(state.scenario){ checkScenarioObjective(); return; }
  for(const side of [SIDES.RED, SIDES.BLUE]){
    let brokenCount = 0;
    for(let bId=0; bId<3; bId++){
      const group = state.units.filter(u=>u.side===side && u.brigadeId===bId);
      if(group.length===0) continue;
      const remaining = group.filter(u=>!u.removed && u.type!=='BRIGADIER');
      if(remaining.length===0) brokenCount++;
    }
    if(brokenCount>=2){
      const winner = side===SIDES.RED ? SIDES.BLUE : SIDES.RED;
      endGame(winner);
      return;
    }
  }
}

/* =========================================================
   OPERATIONS — pluggable scenario objectives.
   Five reusable objective types cover all 14 catalogued Operations
   without needing bespoke code per scenario. A scenario's `objective`
   field is { combinator:'all'|'any', conditions:[{type,params}, ...] }.
   Each condition checker returns 'red', 'blue', or null (undecided).
========================================================= */
function otherSide(side){ return side===SIDES.RED ? SIDES.BLUE : SIDES.RED; }

function checkCaptureZone(params){
  const { zoneSquares, holdForTurns } = params;
  for(const side of [SIDES.RED, SIDES.BLUE]){
    const enemy = otherSide(side);
    const controls = zoneSquares.every(({x,y}) => {
      const here = unitsAt(x,y).filter(u=>!u.removed);
      return here.some(u=>u.side===side) && !here.some(u=>u.side===enemy);
    });
    if(controls){
      state.captureHoldCounter[side]++;
      state.captureHoldCounter[enemy] = 0;
      if(state.captureHoldCounter[side] >= holdForTurns) return side;
    } else if(state.captureHoldCounter[side] > 0 && zoneSquares.some(({x,y})=>unitsAt(x,y).some(u=>!u.removed && u.side===side))){
      // partial presence, no full control this check — hold streak broken but not reset by the enemy specifically
      state.captureHoldCounter[side] = 0;
    }
  }
  return null;
}

function checkSurviveTurns(params){
  const { defender, minUnits } = params;
  const attacker = otherSide(defender);
  const defRemaining = state.units.filter(u=>u.side===defender && !u.removed && u.type!=='BRIGADIER').length;
  if(defRemaining < (minUnits||1)) return attacker; // defender's force collapsed before time ran out
  if(state.turnNumber >= state.scenario.turnLimit) return defender; // held out to the end
  return null;
}

function checkEscapeZone(params){
  const { escapingSide, edgeRows, minUnitsToEscape } = params;
  const escaped = state.units.filter(u=>u.side===escapingSide && !u.removed && edgeRows.includes(u.y)).length;
  if(escaped >= minUnitsToEscape) return escapingSide;
  const remaining = state.units.filter(u=>u.side===escapingSide && !u.removed && u.type!=='BRIGADIER').length;
  if(remaining < minUnitsToEscape - escaped) return otherSide(escapingSide); // can't possibly reach the count anymore
  return null;
}

function checkEliminateTarget(params){
  const { targetSide, targetCount } = params;
  const eliminated = state.units.filter(u=>u.side===targetSide && u.removed).length;
  if(eliminated >= targetCount) return otherSide(targetSide);
  if(state.scenario.turnLimit && state.turnNumber >= state.scenario.turnLimit) return targetSide; // ran out the clock
  return null;
}

function checkProtectUnit(params){
  const { protectSide, unitTypes } = params;
  const assets = state.units.filter(u=>u.side===protectSide && unitTypes.includes(u.type));
  const anyLost = assets.some(u=>u.removed);
  if(anyLost) return otherSide(protectSide);
  if(state.scenario.turnLimit && state.turnNumber >= state.scenario.turnLimit) return protectSide;
  return null;
}

const OBJECTIVE_CHECKERS = {
  CAPTURE_ZONE: checkCaptureZone,
  SURVIVE_TURNS: checkSurviveTurns,
  ESCAPE_ZONE: checkEscapeZone,
  ELIMINATE_TARGET: checkEliminateTarget,
  PROTECT_UNIT: checkProtectUnit
};

function checkScenarioObjective(){
  const obj = state.scenario.objective;
  const results = obj.conditions.map(c => OBJECTIVE_CHECKERS[c.type](c.params));
  let winner = null;
  if(obj.combinator === 'any'){
    winner = results.find(r => r !== null) || null;
  } else { // 'all' — every condition must agree on the SAME winner
    if(results.every(r => r !== null) && results.every(r => r === results[0])) winner = results[0];
  }
  if(!winner){
    // Safety net: a side wiped out entirely can't go on to achieve any objective,
    // so the other side wins by default rather than the match hanging forever
    // (this matters most for scenarios with no turnLimit, resolved purely by objective).
    for(const side of [SIDES.RED, SIDES.BLUE]){
      const remaining = state.units.filter(u=>!u.removed && u.side===side && u.type!=='BRIGADIER').length;
      if(remaining===0){ winner = otherSide(side); break; }
    }
  }
  if(winner) endGame(winner);
}

function checkScenarioTurnLimit(){
  // Some objective types (SURVIVE_TURNS, ELIMINATE_TARGET, PROTECT_UNIT) resolve
  // their own turn-limit outcome inside their checker; this just forces a check
  // at the moment the limit is reached in case nothing else has triggered it yet.
  if(state.scenario.turnLimit && state.turnNumber >= state.scenario.turnLimit) checkScenarioObjective();
}

function endGame(winner){
  state.gameOver = true;
  document.getElementById('overlayTitle').textContent = `${SIDE_LABEL[winner]} Victory`;
  const bodyText = state.scenario
    ? `${SIDE_LABEL[winner]} achieves the objective: ${state.scenario.title}.`
    : `Two of the enemy's three Brigades are broken. ${SIDE_LABEL[winner]} holds the field.`;
  document.getElementById('overlayText').textContent = bodyText;
  const modeChoices = document.getElementById('modeChoices');
  if(modeChoices) modeChoices.style.display = 'none';
  document.getElementById('overlayBtn').style.display = 'inline-block';
  if(state.campaign){
    state.campaignLastWinner = winner;
    state.campaignRecord.push(winner);
    document.getElementById('overlayBtn').textContent = 'Continue Campaign';
    document.getElementById('overlayBtn').onclick = ()=>{
      state.campaignFlowIndex++;
      saveCampaignProgress();
      location.reload();
    };
  } else {
    document.getElementById('overlayBtn').textContent = 'New Battle';
    document.getElementById('overlayBtn').onclick = ()=> location.reload();
  }
  if(state.matchLog && state.matchLog.length>0 && state.replayStartUnits){
    const box = document.querySelector('#overlay .box');
    let extra = document.getElementById('modeChoices');
    if(!extra){
      extra = document.createElement('div');
      extra.id = 'modeChoices';
      extra.style.gap = '8px';
      extra.style.justifyContent = 'center';
      box.appendChild(extra);
    }
    extra.innerHTML = '';
    extra.style.display = 'flex';
    const replayBtn = document.createElement('button');
    replayBtn.textContent = 'Watch Replay';
    replayBtn.onclick = startReplay;
    extra.appendChild(replayBtn);
  }
  document.getElementById('overlay').classList.add('show');
}

/* =========================================================
   RENDERING
========================================================= */
// You always sit behind your own troops on screen, regardless of which
// side you're playing. Purely a rendering/input transform — internal
// board coordinates, movement, LOS, and board rotation are untouched.
// Self-inverse (flipping twice returns the original), so the same
// function converts board->screen and screen->board.
function screenFlipActive(){
  return state.mode==='ai' && state.aiSide===SIDES.RED; // human is playing France (Blue), whose zone is internally "top"
}
function sy(y){
  return screenFlipActive() ? (ROWS-1-y) : y;
}

/* =========================================================
   UNIT MOVEMENT ANIMATION
   Units jumped instantly to their new square, which made rapid AI
   turns hard to follow. animateUnitTo() updates the logical position
   immediately (game logic never waits on animation) but the VISUAL
   position eases toward it over a short duration; drawUnit reads the
   interpolated position instead of u.x/u.y directly.
========================================================= */
let unitAnimations = {}; // unitId -> {fromX, fromY, toX, toY, startTime, duration}
let activeActionLine = null; // {fromX, fromY, toX, toY, color, expiresAt} — who's firing/fighting whom
let deathEffects = []; // {x, y, startTime} — skull for 2s, then smoke fades over another 2s
let animFrameHandle = null;

const DEATH_SKULL_MS = 2000, DEATH_SMOKE_MS = 2000;
function addDeathEffect(x, y){
  deathEffects.push({x, y, startTime: Date.now()});
  ensureAnimationLoopRunning();
}
function addCrater(x, y){
  if(state.craters.some(c=>c.x===x && c.y===y)) return; // already scarred, don't stack markers
  state.craters.push({x, y});
}

function getUnitVisualPos(u){
  const anim = unitAnimations[u.id];
  if(!anim) return {x:u.x, y:u.y};
  const elapsed = Date.now() - anim.startTime;
  const t = Math.min(1, elapsed/anim.duration);
  if(t>=1){ delete unitAnimations[u.id]; return {x:u.x, y:u.y}; }
  const eased = 1 - Math.pow(1-t, 2); // ease-out — starts fast, settles gently
  return { x: anim.fromX + (anim.toX-anim.fromX)*eased, y: anim.fromY + (anim.toY-anim.fromY)*eased };
}

// A Brigadier is never blocked from having an enemy move into his square —
// he's simply shoved 1-2 squares clear. Called right before completing a
// move onto a square a lone enemy Brigadier currently occupies.
function displaceBrigadierIfPresent(x, y, fromX, fromY){
  const occupant = state.units.find(o=>!o.removed && o.x===x && o.y===y && o.type==='BRIGADIER');
  if(!occupant) return;
  const dx = Math.sign(x-fromX) || 0, dy = Math.sign(y-fromY) || 0;
  const candidates = [
    {x:x+dx*2, y:y+dy*2}, {x:x+dx, y:y+dy},
    {x:x+dx, y:y}, {x:x, y:y+dy},
    ...neighbors8(x,y)
  ];
  for(const c of candidates){
    if(inBounds(c.x,c.y) && unitsAt(c.x,c.y).length===0){
      occupant.x = c.x; occupant.y = c.y;
      log(`${SIDE_LABEL[occupant.side]}'s Brigadier is shoved clear.`, 'system');
      return;
    }
  }
}

function animateUnitTo(u, newX, newY){
  const start = getUnitVisualPos(u); // current rendered position, in case a prior animation was still mid-flight
  logReplay('move', { unitId:u.id, side:u.side, from:{x:u.x,y:u.y}, to:{x:newX,y:newY} });
  u.x = newX; u.y = newY; // logical position updates immediately — game rules never wait on animation
  unitAnimations[u.id] = { fromX:start.x, fromY:start.y, toX:newX, toY:newY, startTime:Date.now(), duration:520 };
  ensureAnimationLoopRunning();
}

function showActionLine(fromUnit, toUnit, color, durationMs, dashed){
  activeActionLine = { fromX:fromUnit.x, fromY:fromUnit.y, toX:toUnit.x, toY:toUnit.y, color, dashed:!!dashed, expiresAt: Date.now()+(durationMs||1800) };
  ensureAnimationLoopRunning();
}

function ensureAnimationLoopRunning(){
  if(animFrameHandle) return;
  function tick(){
    draw();
    const stillAnimating = Object.keys(unitAnimations).length>0;
    const lineActive = activeActionLine && Date.now() < activeActionLine.expiresAt;
    if(!lineActive) activeActionLine = null;
    const now = Date.now();
    deathEffects = deathEffects.filter(d => now - d.startTime < DEATH_SKULL_MS + DEATH_SMOKE_MS);
    const deathActive = deathEffects.length>0;
    if(stillAnimating || lineActive || deathActive){
      animFrameHandle = requestAnimationFrame(tick);
    } else {
      animFrameHandle = null;
    }
  }
  animFrameHandle = requestAnimationFrame(tick);
}

const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');

function computeCellSize(){
  const wrap = document.getElementById('boardWrap');
  const viewportW = document.documentElement.clientWidth || window.innerWidth;
  const availW = Math.max(200, Math.min(wrap.clientWidth, viewportW) - 16);
  const availH = Math.max(200, wrap.clientHeight - 16);
  const byWidth = Math.floor(availW / COLS);
  const byHeight = Math.floor(availH / ROWS);
  return Math.max(22, Math.min(byWidth, byHeight, 68));
}

function sizeCanvas(){
  CELL = computeCellSize();
  const dpr = window.devicePixelRatio || 1;
  canvas.style.width = (COLS*CELL) + 'px';
  canvas.style.height = (ROWS*CELL) + 'px';
  canvas.width = COLS*CELL*dpr;
  canvas.height = ROWS*CELL*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  draw();
}

function terrainColor(key){
  return { OPEN: '#3c4a34', FIELD:'#8a7d3f', PLOUGHED_FIELD:'#b89a3f', ROAD:'#8a7350', WOODS:'#26361f', BUILDING:'#6b5847', HILL:'#3c4a34' }[key];
}

/* =========================================================
   TERRAIN RENDERING HELPERS
   The map is meant to read as geomorphic and analogue, not a rigid
   grid — the grid only matters for movement/LOS/combat range. These
   helpers group same-type terrain into connected regions and render
   them as one organic shape rather than a tile-by-tile stamp.
========================================================= */
function findConnectedRegions(terrain, key){
  const h = terrain.length, w = terrain[0].length;
  const regions = [];
  const visited = new Set();
  for(let y=0;y<h;y++){
    for(let x=0;x<w;x++){
      if(terrain[y][x]!==key) continue;
      const k = x+','+y;
      if(visited.has(k)) continue;
      const region = [];
      const stack = [[x,y]];
      visited.add(k);
      while(stack.length){
        const [cx,cy] = stack.pop();
        region.push([cx,cy]);
        for(const [dx,dy] of [[0,-1],[0,1],[-1,0],[1,0]]){
          const nx=cx+dx, ny=cy+dy;
          if(nx<0||nx>=w||ny<0||ny>=h) continue;
          const nk = nx+','+ny;
          if(visited.has(nk) || terrain[ny][nx]!==key) continue;
          visited.add(nk);
          stack.push([nx,ny]);
        }
      }
      regions.push(region);
    }
  }
  return regions;
}
function seededWobble(seed){
  const v = Math.sin(seed*12.9898)*43758.5453;
  return (v - Math.floor(v)) - 0.5; // -0.5..0.5
}
function roundedBlobPath(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function draw(){
  const debugPanel = document.getElementById('aiDebugPanel');
  if(debugPanel && debugPanel.style.display==='block') renderAiDebugPanel();
  const flip = screenFlipActive();
  ctx.clearRect(0,0,canvas.width,canvas.height);
  const terrain = state.terrain;

  // base fill — road cells fill as open ground; Hill matches Open (elevation is
  // shown by its border, not a colour change); the ploughed-field/woods passes
  // paint over their own cells next.
  for(let y=0;y<ROWS;y++){
    const sy_ = sy(y);
    for(let x=0;x<COLS;x++){
      const key = terrain[y][x];
      ctx.fillStyle = terrainColor(key==='ROAD' ? 'OPEN' : key);
      ctx.fillRect(x*CELL,sy_*CELL,CELL,CELL);
    }
  }

  // Ploughed fields: wheat yellow with furrow lines along the field's long axis,
  // computed per contiguous group so a whole field reads as one shape.
  const ploughRegions = findConnectedRegions(terrain, 'PLOUGHED_FIELD');
  for(const region of ploughRegions){
    ctx.save();
    ctx.beginPath();
    for(const [x,y] of region) ctx.rect(x*CELL, sy(y)*CELL, CELL, CELL);
    ctx.clip();
    const screenYs = region.map(([,y])=>sy(y));
    const minX=Math.min(...region.map(c=>c[0])), maxX=Math.max(...region.map(c=>c[0]));
    const minSY=Math.min(...screenYs), maxSY=Math.max(...screenYs);
    const widthPx = (maxX-minX+1)*CELL, heightPx = (maxSY-minSY+1)*CELL;
    const horizontal = widthPx >= heightPx;
    ctx.strokeStyle = 'rgba(120,88,32,0.55)';
    ctx.lineWidth = Math.max(1, CELL*0.045);
    const spacing = CELL*0.24;
    if(horizontal){
      for(let ly=minSY*CELL; ly<(maxSY+1)*CELL; ly+=spacing){
        ctx.beginPath(); ctx.moveTo(minX*CELL,ly); ctx.lineTo((maxX+1)*CELL,ly); ctx.stroke();
      }
    } else {
      for(let lx=minX*CELL; lx<(maxX+1)*CELL; lx+=spacing){
        ctx.beginPath(); ctx.moveTo(lx,minSY*CELL); ctx.lineTo(lx,(maxSY+1)*CELL); ctx.stroke();
      }
    }
    ctx.restore();
  }

  // Woods: each cell is an inflated, jittered rounded blob; adjacent woods
  // cells overlap into one organic tree-mass instead of a grid of squares.
  const woodsRegions = findConnectedRegions(terrain, 'WOODS');
  ctx.fillStyle = terrainColor('WOODS');
  for(const region of woodsRegions){
    for(const [x,y] of region){
      const sy_ = sy(y);
      const jx = seededWobble(x*13+y*71+1) * CELL*0.12;
      const jy = seededWobble(x*47+y*19+2) * CELL*0.12;
      const pad = CELL*0.10, rad = CELL*0.34;
      roundedBlobPath(ctx, x*CELL-pad+jx, sy_*CELL-pad+jy, CELL+pad*2, CELL+pad*2, rad);
      ctx.fill();
    }
  }

  // Roads: one gently-curved stroke per unique connection, not filling the
  // whole square. 90-degree turns pull their anchor toward the inside corner
  // instead of routing dead-through the cell centre, softening the bend. A
  // small deterministic wobble per edge gives a hand-drawn feel rather than
  // rigid geometry, and stays stable across redraws (not re-randomized).
  function roadPoint(x,y){ return { x:x*CELL+CELL/2, y:sy(y)*CELL+CELL/2 }; }
  const excluded = state.excludedRoadEdges || new Set();
  const roadConn = {};
  for(let y=0;y<ROWS;y++) for(let x=0;x<COLS;x++){
    if(terrain[y][x]!=='ROAD') continue;
    const list = [];
    for(const [dx,dy] of [[0,-1],[0,1],[-1,0],[1,0]]){
      const nx=x+dx, ny=y+dy;
      if(!inBounds(nx,ny) || terrain[ny][nx]!=='ROAD') continue;
      const ekey = (x<nx || (x===nx && y<ny)) ? `${x},${y}-${nx},${ny}` : `${nx},${ny}-${x},${y}`;
      if(excluded.has(ekey)) continue;
      list.push({x:nx,y:ny});
    }
    roadConn[x+','+y] = list;
  }
  function roadAnchor(x,y){
    const list = roadConn[x+','+y] || [];
    const center = roadPoint(x,y);
    if(list.length !== 2) return center;
    const isOpposite = (list[0].x-x)===-(list[1].x-x) && (list[0].y-y)===-(list[1].y-y);
    if(isOpposite) return center; // straight through, no turn to soften
    const p1 = roadPoint(list[0].x,list[0].y), p2 = roadPoint(list[1].x,list[1].y);
    const midX=(p1.x+p2.x)/2, midY=(p1.y+p2.y)/2;
    const dirX=midX-center.x, dirY=midY-center.y;
    const len = Math.hypot(dirX,dirY) || 1;
    const pull = CELL*0.20;
    return { x:center.x+(dirX/len)*pull, y:center.y+(dirY/len)*pull };
  }
  ctx.strokeStyle = terrainColor('ROAD');
  ctx.lineWidth = Math.max(3, CELL*0.16);
  ctx.lineCap = 'round';
  const drawnEdges = new Set();
  for(let y=0;y<ROWS;y++){
    for(let x=0;x<COLS;x++){
      if(terrain[y][x]!=='ROAD') continue;
      const list = roadConn[x+','+y] || [];
      const a1 = roadAnchor(x,y);
      for(const n of list){
        const key = (x<n.x || (x===n.x && y<n.y)) ? `${x},${y}-${n.x},${n.y}` : `${n.x},${n.y}-${x},${y}`;
        if(drawnEdges.has(key)) continue;
        drawnEdges.add(key);
        const a2 = roadAnchor(n.x,n.y);
        const seed = x*17 + y*131 + n.x*29 + n.y*271;
        const wobble = seededWobble(seed) * CELL * 0.28;
        const dx=a2.x-a1.x, dy=a2.y-a1.y, len=Math.hypot(dx,dy)||1;
        const px=-dy/len, py=dx/len;
        const mx=(a1.x+a2.x)/2+px*wobble, my=(a1.y+a2.y)/2+py*wobble;
        ctx.beginPath(); ctx.moveTo(a1.x,a1.y); ctx.quadraticCurveTo(mx,my,a2.x,a2.y); ctx.stroke();
      }
      // a short stub into any adjacent Building, so roads visibly reach the buildings they serve
      for(const [dx,dy] of [[0,-1],[0,1],[-1,0],[1,0]]){
        const nx=x+dx, ny=y+dy;
        if(!inBounds(nx,ny) || terrain[ny][nx]!=='BUILDING') continue;
        const p1 = a1, p2 = roadPoint(nx,ny);
        ctx.beginPath();
        ctx.moveTo(p1.x + (p2.x-p1.x)*0.35, p1.y + (p2.y-p1.y)*0.35);
        ctx.lineTo(p2.x, p2.y);
        ctx.stroke();
      }
      if(list.length===0){ const c = roadPoint(x,y); ctx.beginPath(); ctx.arc(c.x,c.y,CELL*0.08,0,Math.PI*2); ctx.fillStyle=terrainColor('ROAD'); ctx.fill(); }
    }
  }
  ctx.lineCap = 'butt';

  // Hills: same grass fill as Open — elevation reads through a light rocky
  // border traced around the outer edge of each connected hill mass, not
  // per-tile, so a cluster reads as one landform (matches the real boards).
  const hillRegions = findConnectedRegions(terrain, 'HILL');
  ctx.strokeStyle = 'rgba(176,172,156,0.95)';
  ctx.lineWidth = Math.max(2, CELL*0.09);
  ctx.lineCap = 'round';
  for(const region of hillRegions){
    const cellSet = new Set(region.map(([x,y])=>x+','+y));
    for(const [x,y] of region){
      for(const {dx,dy} of [{dx:0,dy:-1},{dx:0,dy:1},{dx:-1,dy:0},{dx:1,dy:0}]){
        const nx=x+dx, ny=y+dy;
        if(inBounds(nx,ny) && cellSet.has(nx+','+ny)) continue; // interior edge, no border needed
        const sy0 = sy(y);
        let p1,p2;
        if(dy===-1){
          const nsy = sy(y-1);
          if(nsy<sy0){ p1=[x*CELL,sy0*CELL]; p2=[(x+1)*CELL,sy0*CELL]; }
          else { p1=[x*CELL,(sy0+1)*CELL]; p2=[(x+1)*CELL,(sy0+1)*CELL]; }
        } else if(dy===1){
          const nsy = sy(y+1);
          if(nsy<sy0){ p1=[x*CELL,sy0*CELL]; p2=[(x+1)*CELL,sy0*CELL]; }
          else { p1=[x*CELL,(sy0+1)*CELL]; p2=[(x+1)*CELL,(sy0+1)*CELL]; }
        } else if(dx===-1){ p1=[x*CELL,sy0*CELL]; p2=[x*CELL,(sy0+1)*CELL]; }
        else { p1=[(x+1)*CELL,sy0*CELL]; p2=[(x+1)*CELL,(sy0+1)*CELL]; }
        const seed = x*31 + y*57 + dx*211 + dy*97;
        const wobble = seededWobble(seed) * CELL * 0.22;
        const mx=(p1[0]+p2[0])/2, my=(p1[1]+p2[1])/2;
        const perpX=-(p2[1]-p1[1]), perpY=(p2[0]-p1[0]);
        const plen = Math.hypot(perpX,perpY) || 1;
        const cx_ = mx+(perpX/plen)*wobble, cy_ = my+(perpY/plen)*wobble;
        ctx.beginPath(); ctx.moveTo(p1[0],p1[1]); ctx.quadraticCurveTo(cx_,cy_,p2[0],p2[1]); ctx.stroke();
      }
    }
  }
  ctx.lineCap = 'butt';

  // terrain icons: quick at-a-glance recognition for hill/building (woods/field
  // are already visually distinct via their new shapes/colour, no icon needed)
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = Math.floor(CELL*0.46)+'px sans-serif';
  const ICONS = { HILL:'\u{26F0}', BUILDING:'\u{1F3E0}' };
  for(let y=0;y<ROWS;y++){
    for(let x=0;x<COLS;x++){
      const icon = ICONS[terrain[y][x]];
      if(!icon) continue;
      ctx.fillText(icon, x*CELL+CELL/2, sy(y)*CELL+CELL/2);
    }
  }

  // craters: every square Artillery has hit this match, above terrain, below units
  for(const c of state.craters){
    const cx = c.x*CELL+CELL/2, cy = sy(c.y)*CELL+CELL/2;
    ctx.save();
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = '#1a1710';
    ctx.beginPath(); ctx.arc(cx, cy, CELL*0.20, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 0.28;
    ctx.fillStyle = '#3a332a';
    ctx.beginPath(); ctx.arc(cx, cy, CELL*0.30, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }

  // grid
  ctx.strokeStyle = 'rgba(184,147,79,0.18)';
  ctx.lineWidth = 1;
  for(let x=0;x<=COLS;x++){ ctx.beginPath(); ctx.moveTo(x*CELL,0); ctx.lineTo(x*CELL,ROWS*CELL); ctx.stroke(); }
  for(let y=0;y<=ROWS;y++){ ctx.beginPath(); ctx.moveTo(0,y*CELL); ctx.lineTo(COLS*CELL,y*CELL); ctx.stroke(); }

  // seam between the two physical boards
  ctx.strokeStyle = 'rgba(233,228,214,0.35)';
  ctx.lineWidth = 2;
  ctx.setLineDash([6,4]);
  ctx.beginPath(); ctx.moveTo(HALF_COLS*CELL,0); ctx.lineTo(HALF_COLS*CELL,ROWS*CELL); ctx.stroke();
  ctx.setLineDash([]);
  ctx.lineWidth = 1;

  // deployment zone tint during deploy phase (Blue = rows 0-1, Red = rows ROWS-2..ROWS-1)
  if(state.phase==='deploy'){
    const blueTop = Math.min(sy(0), sy(1));
    ctx.fillStyle = 'rgba(46,69,102,0.14)';
    ctx.fillRect(0, blueTop*CELL, COLS*CELL, 2*CELL);
    const redTop = Math.min(sy(ROWS-2), sy(ROWS-1));
    ctx.fillStyle = 'rgba(163,64,58,0.10)';
    ctx.fillRect(0, redTop*CELL, COLS*CELL, 2*CELL);
  }

  // movement / target highlights
  if(highlightCells && highlightCells.length){
    for(const c of highlightCells){
      ctx.fillStyle = c.kind==='move' ? 'rgba(184,147,79,0.35)' : c.kind==='charge' ? 'rgba(224,110,30,0.5)' : 'rgba(181,69,63,0.4)';
      ctx.fillRect(c.x*CELL+3, sy(c.y)*CELL+3, CELL-6, CELL-6);
    }
  }

  // drag-and-drop hover cell during deployment
  if(dragState && dragState.dragging && dragState.hoverCell){
    ctx.fillStyle = 'rgba(184,147,79,0.5)';
    ctx.fillRect(dragState.hoverCell.x*CELL+2, sy(dragState.hoverCell.y)*CELL+2, CELL-4, CELL-4);
    ctx.strokeStyle = 'rgba(253,246,227,0.9)'; ctx.lineWidth=2;
    ctx.strokeRect(dragState.hoverCell.x*CELL+2, sy(dragState.hoverCell.y)*CELL+2, CELL-4, CELL-4);
  }

  // who's firing/fighting whom — fades out on its own after a couple of seconds
  if(activeActionLine && Date.now() < activeActionLine.expiresAt){
    const ln = activeActionLine;
    const fx = ln.fromX*CELL+CELL/2, fy = sy(ln.fromY)*CELL+CELL/2;
    const tx = ln.toX*CELL+CELL/2, ty = sy(ln.toY)*CELL+CELL/2;
    const remaining = (ln.expiresAt - Date.now()) / 3800;
    const alpha = Math.max(0, Math.min(1, remaining*2.2)); // hold steady, then fade in the last stretch
    ctx.save();
    ctx.strokeStyle = ln.color;
    ctx.globalAlpha = alpha;
    ctx.lineWidth = Math.max(2, CELL*0.06);
    if(ln.dashed) ctx.setLineDash([CELL*0.12, CELL*0.10]);
    ctx.beginPath(); ctx.moveTo(fx,fy); ctx.lineTo(tx,ty); ctx.stroke();
    ctx.setLineDash([]);
    // arrowhead at the target end
    const ang = Math.atan2(ty-fy, tx-fx);
    const ah = CELL*0.16;
    ctx.beginPath();
    ctx.moveTo(tx,ty);
    ctx.lineTo(tx-ah*Math.cos(ang-Math.PI/7), ty-ah*Math.sin(ang-Math.PI/7));
    ctx.lineTo(tx-ah*Math.cos(ang+Math.PI/7), ty-ah*Math.sin(ang+Math.PI/7));
    ctx.closePath();
    ctx.fillStyle = ln.color;
    ctx.fill();
    ctx.restore();
  }

  // units — stacked squares (doubled infantry) are offset so both are visible
  const stackGroups = {};
  for(const u of state.units){
    if(u.removed) continue;
    const key = u.x+','+u.y;
    (stackGroups[key] = stackGroups[key] || []).push(u);
  }
  const STACK_OFFSETS = [{dx:-0.15,dy:-0.15,scale:0.72},{dx:0.15,dy:0.15,scale:0.72}];
  for(const key in stackGroups){
    const list = stackGroups[key];
    if(list.length===1){ drawUnit(list[0]); }
    else if(list.length===2 && (list[0].type==='INFANTRY'||list[0].type==='GUARD') && (list[1].type==='INFANTRY'||list[1].type==='GUARD')){
      drawColumnUnitPair(list[0], list[1]);
    }
    else { list.forEach((u,i)=> drawUnit(u, STACK_OFFSETS[i % STACK_OFFSETS.length])); }
  }

  // muzzle smoke: lingers around a gun from the moment it fires until its side's next turn
  for(const u of state.units){
    if(u.removed || !u.smokeActive) continue;
    const vp = getUnitVisualPos(u);
    const cx = vp.x*CELL+CELL/2, cy = sy(vp.y)*CELL+CELL/2;
    ctx.save();
    ctx.fillStyle = '#f4f1e8';
    [[-0.22,-0.30,0.16],[0.10,-0.36,0.13],[0.28,-0.18,0.11]].forEach(([ox,oy,r])=>{
      ctx.globalAlpha = 0.45;
      ctx.beginPath(); ctx.arc(cx+ox*CELL, cy+oy*CELL, r*CELL, 0, Math.PI*2); ctx.fill();
    });
    ctx.restore();
  }

  // death markers: skull holds for a beat, then fades into drifting smoke
  const now = Date.now();
  for(const d of deathEffects){
    const elapsed = now - d.startTime;
    const cx = d.x*CELL+CELL/2, cy = sy(d.y)*CELL+CELL/2;
    if(elapsed < DEATH_SKULL_MS){
      ctx.save();
      ctx.globalAlpha = 1;
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.font = Math.floor(CELL*0.5)+'px sans-serif';
      ctx.fillText('\u{1F480}', cx, cy);
      ctx.restore();
    } else {
      const smokeT = (elapsed - DEATH_SKULL_MS) / DEATH_SMOKE_MS; // 0..1
      const fade = 1 - smokeT;
      ctx.save();
      ctx.fillStyle = '#d8d4c8';
      [[-0.15,-0.1,0.18],[0.15,-0.15,0.15],[0,0.05,0.20]].forEach(([ox,oy,r])=>{
        ctx.globalAlpha = 0.4*fade;
        const drift = smokeT*0.25;
        ctx.beginPath(); ctx.arc(cx+ox*CELL, cy+(oy-drift)*CELL, (r+smokeT*0.15)*CELL, 0, Math.PI*2); ctx.fill();
      });
      ctx.restore();
    }
  }
}

// Small gold asterisk badge, positioned in a unit's corner — marks Guard Infantry
// and Heavy Cavalry as the "upgraded" tier, replacing the old ring/reroll-star convention.
function drawGoldAsterisk(size, ox, oy){
  ctx.save();
  ctx.translate(ox, oy);
  ctx.strokeStyle = '#c9a227';
  ctx.lineWidth = Math.max(1.4, size*0.045);
  ctx.lineCap = 'round';
  const r = size*0.13;
  for(let i=0;i<3;i++){
    const a = (i/3)*Math.PI;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a)*r, Math.sin(a)*r);
    ctx.lineTo(-Math.cos(a)*r, -Math.sin(a)*r);
    ctx.stroke();
  }
  ctx.restore();
}

// 10 men, 2 ranks of 5 — the standard Infantry/Guard footprint.
function drawInfantryDots(size){
  size *= 1.4; // enlarged for legibility
  const dotR = size*0.062, spX = size*0.155, spY = size*0.20;
  for(let row=0; row<2; row++) for(let col=0; col<5; col++){
    const dx=(col-2)*spX, dy=(row-0.5)*spY;
    ctx.beginPath(); ctx.arc(dx,dy,dotR,0,Math.PI*2); ctx.fill(); ctx.stroke();
  }
}
// Square formation: the same 10 men, rearranged into an actual square perimeter.
function drawInfantrySquareDots(size){
  size *= 1.4; // enlarged for legibility
  const dotR = size*0.062, half = size*0.25;
  const pos = [];
  for(let i=0;i<4;i++) pos.push([-half + i*(half*2/3), -half]);
  for(let i=0;i<4;i++) pos.push([-half + i*(half*2/3), half]);
  pos.push([-half,0]); pos.push([half,0]);
  pos.forEach(([dx,dy])=>{
    ctx.beginPath(); ctx.arc(dx,dy,dotR,0,Math.PI*2); ctx.fill(); ctx.stroke();
  });
}
// Attack Column: 20 men, 4 ranks of 5 — two Infantry/Guard units fighting as one mass.
function drawColumnDots(size){
  size *= 1.4; // enlarged for legibility
  const dotR = size*0.052, spX = size*0.15, spY = size*0.15;
  for(let row=0; row<4; row++) for(let col=0; col<5; col++){
    const dx=(col-2)*spX, dy=(row-1.5)*spY;
    ctx.beginPath(); ctx.arc(dx,dy,dotR,0,Math.PI*2); ctx.fill(); ctx.stroke();
  }
}

    ctx.closePath(); ctx.fill(); ctx.stroke();
