<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>TravelBattle: Field Command</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Cinzel:wght@600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --map-bg:#2a2f22;
    --map-cell:#3c4a34;
    --map-cell-alt:#3f4e37;
    --map-road:#8a7350;
    --map-woods:#26361f;
    --map-building:#6b5847;
    --map-hill:#556b41;
    --map-field:#8a7d3f;

    --bg:#e9dfc4;
    --paper:#e2d6b3;
    --paper-2:#d8c99e;
    --ink:#2e2415;
    --ink-dim:#7a6b4d;
    --brass:#a8823f;
    --brass-dim:#8a6a34;
    --panel:#e9dfc4;
    --panel-2:#dccfa4;
    --line:#c9b989;

    --red:#8c2f2f;
    --red-dim:#6b2422;
    --blue:#2c3e63;
    --blue-dim:#1c2740;
    --ok:#4a7a4a;
    --warn:#a8720b;
    --danger:#a33330;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--map-bg);color:var(--ink);font-family:'Inter',sans-serif;height:100%;overflow:hidden;}
  ::selection{background:var(--brass-dim);color:#fff;}

  #app{display:flex;flex-direction:column;height:100vh;height:100dvh;}

  #topBar{
    display:flex;align-items:center;gap:8px;
    padding:4px 8px;background:var(--panel-2);border-bottom:2px solid var(--brass-dim);
    flex-shrink:0;flex-wrap:wrap;
  }
  #turnBadge{
    font-family:'IBM Plex Mono',monospace;font-size:11px;padding:4px 8px;border-radius:2px;
    border:1px solid var(--brass-dim);letter-spacing:0.02em;background:var(--paper);white-space:nowrap;
  }

  main{flex:1;display:flex;min-height:0;position:relative;}

  #brigadeStatus{
    display:flex;gap:12px;font-family:'IBM Plex Mono',monospace;font-size:10px;flex-shrink:0;white-space:nowrap;
  }
  #brigadeStatus .side-status{display:flex;align-items:center;gap:4px;}
  #brigadeStatus .pip{width:8px;height:8px;border-radius:2px;border:1px solid rgba(0,0,0,0.35);}
  #brigadeStatus .pip.alive{background:currentColor;}
  #brigadeStatus .pip.broken{background:transparent;opacity:0.4;}

  #topBarSpacer{ flex:1; }
  #topBar button{ font-size:11.5px;padding:6px 10px; }

  #boardWrap{flex:1;display:flex;align-items:center;justify-content:center;background:var(--map-bg);overflow:auto;position:relative;padding:8px;}
  canvas{image-rendering:crisp-edges;touch-action:manipulation;border-radius:2px;max-width:100%;height:auto;}

  /* Persistent icon buttons — Undo + Field Report — pinned to a corner, always reachable */
  #hudIcons{
    position:absolute;top:8px;right:8px;z-index:20;display:flex;flex-direction:column;gap:6px;
  }
  #hudIcons button{
    width:38px;height:38px;border-radius:50%;font-size:18px;padding:0;
    display:flex;align-items:center;justify-content:center;
    background:var(--panel-2);border:1px solid var(--brass-dim);box-shadow:0 2px 6px rgba(0,0,0,0.3);
  }

  /* Deploy-only persistent sidebar */
  #sidebar{
    width:250px;flex-shrink:0;background:var(--panel);border-left:2px solid var(--brass-dim);
    display:flex;flex-direction:column;min-height:0;
  }
  #sidebar h3{
    font-family:'Cormorant Garamond',serif;font-weight:700;font-size:13px;letter-spacing:0.06em;text-transform:uppercase;
    color:var(--brass-dim);margin:0;padding:8px 12px 4px;
  }

  /* Battle: slide-in unit overlay, shown only when a unit is selected */
  #unitOverlay{ position:absolute;inset:0;z-index:30;pointer-events:none; }
  #unitOverlay.hidden{ display:none; }
  #unitOverlayPanel{
    position:absolute;bottom:8px;width:230px;max-width:60vw;max-height:min(340px,70%);
    background:var(--panel);border:2px solid var(--brass-dim);border-radius:6px;box-shadow:0 4px 16px rgba(0,0,0,0.4);
    display:flex;flex-direction:column;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
    pointer-events:none;
    transform:translateY(12px);opacity:0;transition:transform 0.15s ease-out,opacity 0.15s ease-out,left 0.1s,right 0.1s;
  }
  /* Only the panel's actual interactive bits intercept clicks — its background,
     portrait and info text let taps pass straight through to the board beneath,
     so it never blocks selecting a DIFFERENT unit that happens to sit under it. */
  #unitOverlayPanel #actionRow button, #unitOverlayPanel .bio-toggle, #unitOverlayPanel .bio-text{ pointer-events:auto; }
  #unitOverlayPanel.anchor-left{ left:8px;right:auto; }
  #unitOverlayPanel.anchor-right{ right:8px;left:auto; }
  #unitOverlay.show #unitOverlayPanel{ transform:translateY(0);opacity:1; }
  #unitPortrait{
    width:100%;aspect-ratio:16/8;background:var(--paper-2);border-bottom:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;color:var(--ink-dim);font-size:11px;
    background-size:cover;background-position:center;flex-shrink:0;
  }

  #unitInfo{padding:8px 12px 10px;font-size:12.5px;line-height:1.45;min-height:60px;border-bottom:1px solid var(--line);}
  #unitInfo .empty{color:var(--ink-dim);font-style:italic;}
  #unitInfo .u-name{font-family:'Cormorant Garamond',serif;font-size:16px;font-weight:700;margin-bottom:2px;}
  #unitInfo .u-tags{display:flex;gap:5px;flex-wrap:wrap;margin:5px 0;}
  #unitInfo .tag{font-family:'IBM Plex Mono',monospace;font-size:9.5px;padding:2px 6px;border-radius:2px;background:var(--paper-2);color:var(--ink-dim);}
  #unitInfo .tag.st-active{color:var(--ok);}
  #unitInfo .tag.st-square{color:var(--warn);}
  #unitInfo .tag.st-pushed{color:var(--danger);}
  .bio-toggle{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--brass-dim);cursor:pointer;margin-top:6px;user-select:none;}
  .bio-text{font-family:'Cormorant Garamond',serif;font-size:12.5px;line-height:1.5;color:var(--ink-dim);margin-top:4px;padding-top:4px;border-top:1px solid var(--line);}

  #actionRow{display:flex;gap:6px;padding:7px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
  button{
    font-family:'Inter',sans-serif;font-size:12px;font-weight:500;padding:6px 11px;
    background:var(--paper-2);color:var(--ink);border:1px solid var(--line);border-radius:3px;cursor:pointer;
  }
  button:hover:not(:disabled){background:#cbb98a;border-color:var(--brass-dim);}
  button:disabled{opacity:0.4;cursor:default;}
  button.primary{background:var(--brass-dim);border-color:var(--brass);color:#fdf6e3;font-weight:600;}
  button.primary:hover:not(:disabled){background:var(--brass);}
  button.danger{border-color:var(--danger);color:var(--danger);}

  /* Field Report — its own icon-triggered overlay now, not a collapsible panel section */
  #logOverlay{ position:absolute;inset:0;z-index:30;pointer-events:none; }
  #logOverlay.hidden{ display:none; }
  #logOverlayBackdrop{ position:absolute;inset:0;background:rgba(20,16,8,0.35);opacity:0;transition:opacity 0.18s; }
  #logOverlayPanel{
    position:absolute;top:0;bottom:0;right:0;width:280px;max-width:85vw;
    background:var(--panel);border-left:2px solid var(--brass-dim);box-shadow:-6px 0 16px rgba(0,0,0,0.35);
    display:flex;flex-direction:column;min-height:0;
    transform:translateX(100%);transition:transform 0.18s ease-out;
  }
  #logOverlay.show{ pointer-events:auto; }
  #logOverlay.show #logOverlayBackdrop{ opacity:1; }
  #logOverlay.show #logOverlayPanel{ transform:translateX(0); }
  #logOverlayHeader{
    display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--line);
    font-family:'Cormorant Garamond',serif;font-weight:700;font-size:14px;letter-spacing:0.06em;text-transform:uppercase;color:var(--brass-dim);
  }
  #logCloseBtn{ background:none;border:none;font-size:20px;line-height:1;padding:0 4px;color:var(--ink-dim); }
  #log{flex:1;overflow-y:auto;padding:8px 12px;font-family:'IBM Plex Mono',monospace;font-size:10.5px;line-height:1.5;-webkit-overflow-scrolling:touch;}
  #log .entry{margin-bottom:4px;padding-left:7px;border-left:2px solid var(--line);color:var(--ink-dim);}
  #log .entry.red{border-color:var(--red);}
  #log .entry.blue{border-color:var(--blue);}
  #log .entry.combat{color:var(--warn);}
  #log .entry.system{color:var(--brass-dim);}
  #log .entry.narrative{color:var(--ink-dim);font-style:italic;font-family:'Cormorant Garamond',serif;font-size:12.5px;padding-left:4px;border-left:2px solid var(--line);margin:2px 0 4px 2px;}

  #rosterPanel{display:none;flex-direction:column;flex:1;min-height:0;}
  #rosterList{flex:1;overflow-y:auto;padding:6px 12px;-webkit-overflow-scrolling:touch;min-height:0;}
  .roster-chip{
    display:flex;align-items:center;gap:8px;padding:6px 8px;margin-bottom:5px;border-radius:3px;
    background:var(--paper-2);border:1px solid var(--line);cursor:pointer;font-size:12px;
  }
  .roster-chip.selected{border-color:var(--brass);background:var(--brass-dim);color:#fdf6e3;}
  .roster-chip.placed{opacity:0.35;cursor:default;}
  .roster-chip .swatch{width:15px;height:15px;border-radius:2px;flex-shrink:0;}

  #overlay{
    position:fixed;inset:0;background:rgba(20,16,8,0.72);display:none;align-items:center;justify-content:center;z-index:50;
  }
  #overlay.show{display:flex;}
  #overlay .box{
    background:var(--paper);border:2px solid var(--brass-dim);border-radius:4px;padding:24px 28px;max-width:380px;text-align:center;
    box-shadow:0 10px 40px rgba(0,0,0,0.4);
    max-height:92vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  }
  #overlay .box h2{font-family:'Cinzel',serif;color:var(--brass-dim);letter-spacing:0.05em;text-transform:uppercase;font-size:18px;margin:0 0 10px;}
  #overlay .box p{font-size:13px;color:var(--ink-dim);line-height:1.55;margin:0 0 16px;font-family:'Cormorant Garamond',serif;font-size:15px;}

  #dragGhost{
    position:fixed; z-index:60; pointer-events:none; display:none;
    width:44px;height:44px;border-radius:6px;border:2px solid #fdf6e3;
    box-shadow:0 4px 14px rgba(0,0,0,0.4); align-items:center; justify-content:center;
    font-family:'Cormorant Garamond',serif;font-weight:700;font-size:10px;color:#fdf6e3;text-align:center;padding:2px;
  }
  #dragGhost.show{display:flex;}
  .roster-chip{ touch-action:none; user-select:none; -webkit-user-select:none; }

  #diceOverlay{
    position:absolute; top:10px; left:50%; transform:translateX(-50%) translateY(-8px);
    opacity:0; pointer-events:none; transition:opacity 0.18s ease, transform 0.18s ease; z-index:20;
  }
  #diceOverlay.show{ opacity:1; transform:translateX(-50%) translateY(0); pointer-events:auto; }
  .dice-panel{
    background:rgba(233,223,196,0.97); border:2px solid var(--brass-dim); border-radius:6px;
    padding:9px 16px 8px; box-shadow:0 6px 22px rgba(0,0,0,0.4); text-align:center;
  }
  .dice-groups{ display:flex; align-items:center; justify-content:center; gap:12px; }
  .dice-group{ display:flex; flex-direction:column; align-items:center; gap:4px; }
  .dice-group .glabel{ font-family:'IBM Plex Mono',monospace; font-size:9.5px; color:var(--ink-dim); letter-spacing:0.03em; }
  .dice-notes{ display:flex; flex-direction:column; gap:1px; margin-top:3px; max-width:110px; }
  .dice-notes span{ font-family:'IBM Plex Mono',monospace; font-size:8px; color:var(--brass-dim); line-height:1.3; white-space:normal; }
  .dice-set{ display:flex; gap:4px; }
  .dice-vs{ font-family:'Cinzel',serif; font-size:11px; color:var(--ink-dim); align-self:center; padding-top:12px; }
  .die{
    width:32px;height:32px; background:#fdf6e3; border:2px solid var(--ink); border-radius:6px;
    display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr);
    padding:4px; gap:1px; transition:border-color 0.15s, opacity 0.15s;
  }
  .die.rolling{ border-color:var(--ink-dim); }
  .die.pending{ border-color:var(--line); border-style:dashed; background:transparent; opacity:0.7; }
  .die.kept{ border-color:var(--brass-dim); box-shadow:0 0 0 2px var(--brass-dim); }
  .die.discard{ opacity:0.4; }
  .die .pip{ border-radius:50%; background:var(--ink); align-self:center; justify-self:center; width:65%; height:65%; }
  .dice-result{ margin-top:5px; font-family:'Cormorant Garamond',serif; font-weight:700; font-size:14px; color:var(--ink); min-height:18px; }
  .dice-result.win{ color:var(--ok); }
  .dice-result.lose{ color:var(--danger); }
  .dice-result.draw{ color:var(--warn); }

  /* Landscape-first: this is the default row layout above (board + narrow
     sidebar), which already suits a landscape phone well. Portrait phones
     get a stacked, scrollable layout instead. */
  @media (max-width:900px) and (orientation:portrait){
    main{flex-direction:column;overflow-y:auto;-webkit-overflow-scrolling:touch;}
    #boardWrap{flex:none;width:100%;max-height:48vh;padding:8px;}
    #sidebar{
      position:static;width:100%;flex-shrink:0;
      border-left:none;border-top:2px solid var(--brass-dim);
      box-shadow:none;
    }
    #topBar{font-size:11px;}
    #brigadeStatus{flex-wrap:wrap;gap:5px 14px;font-size:9.5px;}
    #unitOverlayPanel{ bottom:6px;width:200px;max-width:56vw;max-height:50vh; }
    #logOverlayPanel{ width:100%;max-width:100%;top:auto;left:0;right:0;bottom:0;height:65vh;
      border-left:none;border-top:2px solid var(--brass-dim);transform:translateY(100%); }
    #logOverlay.show #logOverlayPanel{ transform:translateY(0); }
  }
  /* Short landscape viewports (phone chrome eating vertical space): compact the chrome */
  @media (max-height:430px){
    #topBar{padding:3px 8px;}
    #turnBadge{font-size:10px;padding:3px 6px;}
    #brigadeStatus{font-size:9px;}
    #sidebar{width:210px;}
    #hudIcons button{width:32px;height:32px;font-size:15px;}
  }
  #sidebarToggle{display:none;}
</style>
</head>
<body>
<div id="app">
<div id="dragGhost"></div>
  <div id="topBar">
    <div id="turnBadge">&mdash;</div>
    <div id="brigadeStatus"></div>
    <div id="topBarSpacer"></div>
    <button id="endMoveBtn" class="primary" disabled>End Move</button>
    <button id="endFireBtn" class="primary" style="display:none;">End Artillery</button>
    <button id="endFightBtn" class="primary" style="display:none;">End Fight</button>
  </div>

  <main>
    <div id="boardWrap">
      <canvas id="board" width="900" height="900"></canvas>
      <div id="diceOverlay"><div class="dice-panel"><div class="dice-groups"></div><div class="dice-result"></div><button id="diceRollBtn" class="primary" style="display:none;margin-top:8px;">Roll</button></div></div>
    </div>

    <div id="hudIcons">
      <button id="undoBtnBattle" title="Undo" disabled>&#8634;</button>
      <button id="logIconBtn" title="Field Report">&#9776;</button>
    </div>

    <div id="sidebar">
      <div id="rosterPanel">
        <h3 id="rosterTitle">Deploy Brigade</h3>
        <div id="brigadeProgress" style="padding:0 12px 6px;font-size:11px;color:var(--ink-dim);font-family:'IBM Plex Mono',monospace;"></div>
        <div id="rosterList"></div>
        <div id="actionRow">
          <button id="confirmBrigadeBtn" class="primary" style="display:none;" disabled>Confirm This Brigade</button>
          <button id="undoBtn" disabled>Undo</button>
        </div>
        <div id="actionRow">
          <button id="endDeployBtn" class="primary" disabled>Confirm Deployment</button>
        </div>
      </div>
    </div>

    <div id="unitOverlay" class="hidden">
      <div id="unitOverlayPanel">
        <div id="unitPortrait"></div>
        <div id="unitInfo"><span class="empty">No unit selected</span></div>
        <div id="actionRow">
          <button id="squareBtn" disabled>Form Square</button>
          <button id="ambushBtn" style="display:none;" disabled>Lay Ambush</button>
          <button id="chargeBtn" style="display:none;" disabled>Charge</button>
        </div>
      </div>
    </div>

    <div id="logOverlay" class="hidden">
      <div id="logOverlayBackdrop"></div>
      <div id="logOverlayPanel">
        <div id="logOverlayHeader"><span>Field Report</span><button id="logCloseBtn">&times;</button></div>
        <div id="log"></div>
      </div>
    </div>
  </main>
</div>

<div id="overlay">
  <div class="box">
    <h2 id="overlayTitle">TravelBattle</h2>
    <p id="overlayText"></p>
    <canvas id="rotationPreviewCanvas" width="220" height="220" style="display:none;border:2px solid var(--brass-dim);border-radius:4px;margin-bottom:14px;"></canvas>
    <button id="overlayBtn" class="primary">Begin</button>
  </div>
</div>

<script>
/* =========================================================
   CONFIG & CONSTANTS
========================================================= */
/* =========================================================
   BOARD: TWO PHYSICAL BOARDS, PLACED SIDE BY SIDE
   TravelBattle is played on two boards pushed together. They join
   along a vertical seam; both players deploy along their own top/
   bottom edge across the FULL combined width. Each half below
   represents one physical board, full depth, half width.

   BOARD_A_TERRAIN / BOARD_B_TERRAIN are traced from Matthew's actual
   board photos (Aug 2026) — best-effort read of road/woods/building/
   field placement, confirmed against his description. The light grey
   blotches visible in the photos are decorative (rocks / cliff faces
   on hill inclines) with no gameplay effect on their own, and no hill
   terrain was confidently identifiable in either photo, so both boards
   are currently coded with no HILL squares — flag this if either board
   does have a hill area, since that would need adding explicitly.

   Each game start: one board is randomly assigned to each side, then
   each side rolls a d6 for that board's table orientation (1-3 =
   forced rotation of that many 90° clockwise turns; 4-6 = that side's
   player chooses the rotation) — see beginBoardSetup().
========================================================= */
const HALF_COLS = 10, ROWS = 10, COLS = HALF_COLS*2; // each physical board is 10x10; combined map is 20 wide x 10 deep
let CELL = 68; // recomputed responsively at runtime, see computeCellSize()

// Board A — exact terrain from Matthew's annotated spreadsheet (Aug 2026).
// Roads are stored as a full ROAD square for gameplay (any unit in the square
// gets the bonus) but rendered as a thin line through the cell centre — see
// the road-drawing pass in draw() — so the visual doesn't fill the whole tile.
const BOARD_A_TERRAIN = [
  ['OPEN', 'OPEN', 'OPEN', 'OPEN', 'OPEN', 'OPEN', 'ROAD', 'ROAD', 'OPEN', 'OPEN'],
  ['OPEN', 'HILL', 'HILL', 'HILL', 'HILL', 'OPEN', 'ROAD', 'WOODS', 'HILL', 'HILL'],
  ['ROAD', 'HILL', 'HILL', 'OPEN', 'OPEN', 'ROAD', 'ROAD', 'WOODS', 'HILL', 'HILL'],
  ['ROAD', 'ROAD', 'ROAD', 'ROAD', 'ROAD', 'ROAD', 'OPEN', 'HILL', 'HILL', 'HILL'],
  ['OPEN', 'OPEN', 'ROAD', 'OPEN', 'OPEN', 'OPEN', 'OPEN', 'HILL', 'HILL', 'HILL'],
  ['OPEN', 'OPEN', 'ROAD', 'OPEN', 'OPEN', 'OPEN', 'OPEN', 'HILL', 'HILL', 'HILL'],
  ['OPEN', 'BUILDING', 'BUILDING', 'OPEN', 'OPEN', 'OPEN', 'OPEN', 'OPEN', 'HILL', 'HILL'],
  ['OPEN', 'BUILDING', 'ROAD', 'ROAD', 'ROAD', 'ROAD', 'ROAD', 'ROAD', 'ROAD', 'ROAD'],
  ['OPEN', 'OPEN', 'ROAD', 'PLOUGHED_FIELD', 'PLOUGHED_FIELD', 'PLOUGHED_FIELD', 'PLOUGHED_FIELD', 'OPEN', 'OPEN', 'OPEN'],
  ['OPEN', 'OPEN', 'ROAD', 'OPEN', 'OPEN', 'OPEN', 'OPEN', 'OPEN', 'OPEN', 'OPEN'],
];

// Board B — exact terrain from Matthew's annotated spreadsheet (Aug 2026).
const BOARD_B_TERRAIN = [
  ['OPEN', 'OPEN', 'ROAD', 'OPEN', 'OPEN', 'OPEN', 'OPEN', 'OPEN', 'OPEN', 'OPEN'],
  ['HILL', 'HILL', 'ROAD', 'OPEN', 'OPEN', 'OPEN', 'OPEN', 'PLOUGHED_FIELD', 'OPEN', 'OPEN'],
  ['HILL', 'HILL', 'ROAD', 'ROAD', 'OPEN', 'OPEN', 'OPEN', 'PLOUGHED_FIELD', 'BUILDING', 'ROAD'],
  ['OPEN', 'ROAD', 'BUILDING', 'ROAD', 'ROAD', 'OPEN', 'OPEN', 'OPEN', 'OPEN', 'OPEN'],
  ['OPEN', 'ROAD', 'PLOUGHED_FIELD', 'OPEN', 'ROAD', 'ROAD', 'OPEN', 'OPEN', 'OPEN', 'OPEN'],
  ['OPEN', 'ROAD', 'PLOUGHED_FIELD', 'ROAD', 'ROAD', 'ROAD', 'OPEN', 'OPEN', 'OPEN', 'OPEN'],
  ['ROAD', 'ROAD', 'ROAD', 'ROAD', 'WOODS', 'ROAD', 'ROAD', 'ROAD', 'HILL', 'OPEN'],
  ['OPEN', 'OPEN', 'OPEN', 'OPEN', 'WOODS', 'WOODS', 'OPEN', 'ROAD', 'HILL', 'HILL'],
  ['OPEN', 'OPEN', 'OPEN', 'OPEN', 'OPEN', 'OPEN', 'OPEN', 'ROAD', 'HILL', 'HILL'],
  ['OPEN', 'OPEN', 'OPEN', 'OPEN', 'OPEN', 'OPEN', 'OPEN', 'ROAD', 'HILL', 'HILL'],
];

// Rotate a square (N x N) grid 90° clockwise, `times` times.
function rotateGrid90CW(grid){
  const n = grid.length;
  const out = [];
  for(let y=0;y<n;y++){ const row=[]; for(let x=0;x<n;x++) row.push(null); out.push(row); }
  for(let y=0;y<n;y++) for(let x=0;x<n;x++) out[x][n-1-y] = grid[y][x];
  return out;
}
function rotateGridTimes(grid, times){
  let g = grid;
  const n = ((times%4)+4)%4;
  for(let i=0;i<n;i++) g = rotateGrid90CW(g);
  return g;
}

function boardTerrainFor(key, rotation){
  const base = key==='A' ? BOARD_A_TERRAIN : BOARD_B_TERRAIN;
  return rotateGridTimes(base, rotation||0);
}

// Specific road-to-road connections to NOT draw, even though the cells are
// adjacent ROAD squares — a visually redundant loop where the road already
// connects one square earlier (Matthew's note, Aug 2026). Coordinates are
// LOCAL to that physical board (0..HALF_COLS-1), before rotation/placement.
const BOARD_EXCLUDED_ROAD_EDGES = {
  A: [],
  B: [ {x1:4,y1:4,x2:4,y2:5} ] // left edge of the 2x2 block — the road already connects one square earlier
};

function rotatePointCW(x, y, n, times){
  let px=x, py=y;
  const t = ((times%4)+4)%4;
  for(let i=0;i<t;i++){ const nx = n-1-py, ny = px; px=nx; py=ny; }
  return [px, py];
}

// Excluded edges for one physical board, transformed by its rotation and
// shifted by colOffset (0 if it landed on the left half, HALF_COLS if right).
function excludedEdgesForBoard(boardKey, rotation, colOffset){
  return (BOARD_EXCLUDED_ROAD_EDGES[boardKey]||[]).map(e=>{
    const [rx1,ry1] = rotatePointCW(e.x1,e.y1,HALF_COLS,rotation);
    const [rx2,ry2] = rotatePointCW(e.x2,e.y2,HALF_COLS,rotation);
    return { x1:rx1+colOffset, y1:ry1, x2:rx2+colOffset, y2:ry2 };
  });
}
function edgeKey(x1,y1,x2,y2){
  // undirected — normalize so (a,b) and (b,a) produce the same key
  return (x1<x2 || (x1===x2 && y1<y2)) ? `${x1},${y1}-${x2},${y2}` : `${x2},${y2}-${x1},${y1}`;
}

function buildTerrainMap(assignment, rotation){
  assignment = assignment || { red:'A', blue:'B' };
  rotation = rotation || { red:0, blue:0 };
  const leftGrid = boardTerrainFor(assignment.red, rotation.red);
  const rightGrid = boardTerrainFor(assignment.blue, rotation.blue);
  const map = [];
  for(let y=0;y<ROWS;y++) map.push(leftGrid[y].concat(rightGrid[y]));
  return map;
}

function buildExcludedRoadEdgeSet(assignment, rotation){
  assignment = assignment || { red:'A', blue:'B' };
  rotation = rotation || { red:0, blue:0 };
  const edges = [
    ...excludedEdgesForBoard(assignment.red, rotation.red, 0),
    ...excludedEdgesForBoard(assignment.blue, rotation.blue, HALF_COLS)
  ];
  const set = new Set();
  edges.forEach(e=> set.add(edgeKey(e.x1,e.y1,e.x2,e.y2)));
  return set;
}

const CAMPAIGNS = [
  { id:'flanders', name:'The Flanders Campaign', years:'1793–1795', brief:'In 1793 Britain joined the First Coalition to check Revolutionary France\'s advance into the Low Countries, fighting alongside Austrian, Dutch and Hanoverian allies. It became a campaign of marches, sieges and hard-fought village actions rather than one decisive battle, and though it ended in a costly withdrawal, it forged a generation of British officers, Wellington among them. This campaign works well as an introduction to Napoleonic wargaming — the Battles are smaller in scale than the Peninsular fights to come, and the Operations lean on delaying actions and holding key ground rather than outright annihilation.', flow:[
    { type:'battle', id:'battle-famars', name:'Battle of Famars', date:'23 May 1793', intro:'The Duke of York led British, Austrian and Hanoverian troops against General Dampierre\'s French army near Valenciennes, attacking across a line of villages and ridges until the French abandoned their positions after a hard day\'s fighting. It was Britain\'s first major field battle against Revolutionary France and opened the road to the Siege of Valenciennes.' },

    { type:'battle', id:'battle-hondschoote', name:'Battle of Hondschoote', date:'6–8 September 1793', intro:'While besieging Dunkirk, the Duke of York\'s army found itself threatened by General Houchard\'s relief force, and fierce fighting through villages, hedgerows and open fields eventually forced a British withdrawal to avoid being cut off. The failure of the Dunkirk expedition marked a real turning point in the campaign\'s fortunes.' },

    { type:'battle', id:'battle-tourcoing', name:'Battle of Tourcoing', date:'17–18 May 1794', intro:'The Coalition attempted an ambitious encirclement of the French army near Tourcoing, but poor coordination let the French defeat the isolated Allied columns one by one, forcing a general retreat despite good fighting from the British troops involved.' },
  ]},
  { id:'peninsular', name:'The Peninsular Campaign', years:'1808–1814', brief:'From 1808 Britain committed to defending Portugal and driving Napoleon\'s marshals out of Spain, a campaign that grew into Britain\'s longest and most successful of the wars under Sir Arthur Wellesley, later Wellington. Villages, ridges, bridges and mountain passes decided battles as often as raw numbers did, and small actions by riflemen and cavalry regularly determined whether whole armies survived to fight on. This is the widest-ranging of the three campaigns, moving from desperate defensive rearguards through increasingly confident offensives to the invasion of France itself.', flow:[
    { type:'battle', id:'battle-vimeiro', name:'Battle of Vimeiro', date:'21 August 1808', intro:'Sir Arthur Wellesley fought his first major battle in Portugal here, repelling repeated French attacks on the ridge at Vimeiro with disciplined infantry volleys after defeating Junot\'s invasion force. The win secured Portugal and opened Britain\'s long campaign in the Peninsula.' },
    { type:'branch', id:'branch-peninsular-1', options:[{ operationId:'op-coa', name:'Combat of Côa', date:'24 July 1810', missionArchetype:'Rearguard Action', locked:false }, { operationId:'op-colbert', name:'The Death of General Colbert', date:'3 January 1809 — Combat of Cacabelos', missionArchetype:'Assassination Target', locked:true }] },
    { type:'battle', id:'battle-bussaco', name:'Battle of Bussaco', date:'27 September 1810', intro:'Wellington chose to stand on the Bussaco ridge and force Masséna to attack uphill, and French assaults broke repeatedly against the Allied line before Masséna gave up the frontal attack and tried to outflank the position instead.' },
    { type:'branch', id:'branch-peninsular-2', options:[{ operationId:'op-el-bodon', name:'Combat of El Bodón', date:'25 September 1811', missionArchetype:'Hold the Line', locked:false }, { operationId:'op-sabugal', name:'Battle of Sabugal', date:'3 April 1811', missionArchetype:'Break Through', locked:false }] },
    { type:'battle', id:'battle-salamanca', name:'Battle of Salamanca', date:'22 July 1812', intro:'Perhaps Wellington\'s finest battlefield win, this saw him spot Marmont overextending his left flank and launch an immediate, devastating counterattack that shattered the French army, opening the road to Madrid.' },
    { type:'branch', id:'branch-peninsular-3', options:[{ operationId:'op-arroyo-dos-molinos', name:'Battle of Arroyo dos Molinos', date:'28 October 1811', missionArchetype:'Surprise Attack', locked:false }, { operationId:'op-garcia-hernandez', name:'Battle of García Hernández', date:'23 July 1812', missionArchetype:'Break the Retreat', locked:false }] },
    { type:'battle', id:'battle-vitoria', name:'Battle of Vitoria', date:'21 June 1813', intro:'Joseph Bonaparte tried to withdraw through the valleys around Vitoria while dragging along a huge baggage train, and Wellington attacked on multiple fronts at once, overwhelming the French and capturing enormous quantities of equipment. The win effectively ended French rule in Spain.' },
    { type:'battle', id:'battle-toulouse', name:'Battle of Toulouse', date:'10 April 1814', intro:'Crossing into southern France, Wellington fought Soult in one last major battle around fortified villages and ridges, unaware that Napoleon had already abdicated days earlier. After hard fighting, Soult withdrew and the Peninsular campaign was finally over.' },
  ]},
  { id:'waterloo', name:'The Waterloo Campaign', years:'1815', brief:'Napoleon\'s escape from Elba in March 1815 forced the Seventh Coalition to move fast, and his own plan was to strike Wellington and Blücher separately before their armies could combine. What followed was only four days of campaigning, 15–18 June, but produced some of the most famous fighting in military history, as Wellington\'s Anglo-Allied army bought time for the Prussians to arrive. This campaign naturally alternates between the two enormous set-piece battles and the smaller, desperate actions fought around the farms and crossroads that decided them.', flow:[

/* =========================================================
   UNDO
   Snapshot the whole game state before each human-initiated mutating
   action. Only human actions push a snapshot — the AI's own move/fire/
   fight decisions never call pushUndoSnapshot, so there's nothing to
   rewind into on the AI's turn. The stack is reset at the start of
   every human turn (and deployment turn-change), so undo can only ever
   reach back to the start of the current turn, never before it.
========================================================= */
let undoStack = [];

function snapshotState(){
  return JSON.stringify(state, (key, value) => (value instanceof Set) ? {__isSet:true, items:[...value]} : value);
}
function restoreState(snap){
  state = JSON.parse(snap, (key, value) => (value && value.__isSet) ? new Set(value.items) : value);
}
function pushUndoSnapshot(){
  undoStack.push(snapshotState());
  if(undoStack.length>50) undoStack.shift(); // cap memory use
  updateUndoButtons();
}
function resetUndoStack(){
  undoStack = [];
  updateUndoButtons();
}
function undoLastAction(){
  if(undoStack.length===0) return;
  const diceOverlay = document.getElementById('diceOverlay');
  if(diceOverlay && diceOverlay.classList.contains('show')){
    log('Cannot undo while dice are on screen — wait for the result to clear.', 'system');
    return;
  }
  const snap = undoStack.pop();
  restoreState(snap);
  unitAnimations = {};
  activeActionLine = null;
  deathEffects = [];
  selectedDeployType = null;
  dragState = null;
  highlightCells = [];
  if(state.phase==='deploy') renderRoster();
  else selectUnit(null);
  syncPhaseButtons();
  updateHeader();
  draw();
  log('Undone.', 'system');
  updateUndoButtons();
}
// Ensures the visible End-Phase button always matches state.phase — called
// after undo as a defensive re-sync (the undo stack is now scoped so it can
// never actually cross a phase boundary, but this keeps the UI honest regardless).
function syncPhaseButtons(){
  const moveBtn = document.getElementById('endMoveBtn');
  const fireBtn = document.getElementById('endFireBtn');
  const fightBtn = document.getElementById('endFightBtn');
  if(!moveBtn || !fireBtn || !fightBtn) return;
  moveBtn.style.display = state.phase==='move' ? 'inline-block' : 'none';
  fireBtn.style.display = state.phase==='fire' ? 'inline-block' : 'none';
  fightBtn.style.display = state.phase==='fight' ? 'inline-block' : 'none';
}
function updateUndoButtons(){
  const disabled = undoStack.length===0;
  const b1 = document.getElementById('undoBtn'); if(b1) b1.disabled = disabled;
  const b2 = document.getElementById('undoBtnBattle'); if(b2) b2.disabled = disabled;
}

let historicalSlotCounters = { red:{}, blue:{} };
function resetHistoricalIdentities(){ historicalSlotCounters = { red:{}, blue:{} }; }
function newUnit(side, typeKey, x, y, brigadeId){
  const counters = historicalSlotCounters[side];
  const idx = counters[typeKey] || 0;
  counters[typeKey] = idx + 1;
  const archiveList = (UNIT_ARCHIVE[side] && UNIT_ARCHIVE[side][typeKey]) || [];
  const historical = archiveList.length ? archiveList[idx % archiveList.length] : null;
  return {
    id: 'u'+(uidCounter++), side, type: typeKey, brigadeId,
    x, y, removed:false, formation:'line', pushed:false,
    turnOnly:false, // true = can only turn around this coming turn
    rallying:false,
    charged:false,          // clean 2-square Cavalry run this turn — wins ties in the ensuing fight
    leadershipUsed:false,   // Brigadiers only: one guaranteed Rally save per match
    hidden:false,           // Woodland Ambush — invisible to artillery and to the AI's own targeting
    ambushSpentThisRound:false, // sprang an ambush this round — no woods defence bonus until side's next turn
    noActionThisTurn:false, // stood down an ambush without springing — can't move or fight for the rest of this turn
    smokeActive:false,      // fired this cycle — shows muzzle smoke until this unit's side's next turn
    historicalName: historical ? historical.name : null,
    historicalBio: historical ? historical.bio : null
  };
}

/* =========================================================
