  UNIT_IMAGES[key] = img;
}

// Small gold asterisk badge, positioned in a unit's corner — marks Guard Infantry
// and Heavy Cavalry as the "upgraded" tier, replacing the old ring/reroll-star convention.
function drawGoldAsterisk(size, ox, oy){
  ctx.save();
  ctx.translate(ox, oy);
  ctx.strokeStyle = '#c9a227';
  ctx.lineWidth = Math.max(1.4, size*0.045);
  ctx.lineCap = 'round';
  const r = size*0.13;
  for(let i=0;i<3;i++){
    const a = (i/3)*Math.PI;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a)*r, Math.sin(a)*r);
    ctx.lineTo(-Math.cos(a)*r, -Math.sin(a)*r);
    ctx.stroke();
  }
  ctx.restore();
}

// 10 men, 2 ranks of 5 — the standard Infantry/Guard footprint.
function drawInfantryDots(size){
  const dotR = size*0.062, spX = size*0.155, spY = size*0.20;
  for(let row=0; row<2; row++) for(let col=0; col<5; col++){
    const dx=(col-2)*spX, dy=(row-0.5)*spY;
    ctx.beginPath(); ctx.arc(dx,dy,dotR,0,Math.PI*2); ctx.fill(); ctx.stroke();
  }
}
// Square formation: the same 10 men, rearranged into an actual square perimeter.
function drawInfantrySquareDots(size){
  const dotR = size*0.062, half = size*0.25;
  const pos = [];
  for(let i=0;i<4;i++) pos.push([-half + i*(half*2/3), -half]);
  for(let i=0;i<4;i++) pos.push([-half + i*(half*2/3), half]);
  pos.push([-half,0]); pos.push([half,0]);
  pos.forEach(([dx,dy])=>{
    ctx.beginPath(); ctx.arc(dx,dy,dotR,0,Math.PI*2); ctx.fill(); ctx.stroke();
  });
}
// Attack Column: 20 men, 4 ranks of 5 — two Infantry/Guard units fighting as one mass.
function drawColumnDots(size){
  const dotR = size*0.052, spX = size*0.15, spY = size*0.15;
  for(let row=0; row<4; row++) for(let col=0; col<5; col++){
    const dx=(col-2)*spX, dy=(row-1.5)*spY;
    ctx.beginPath(); ctx.arc(dx,dy,dotR,0,Math.PI*2); ctx.fill(); ctx.stroke();
  }
}
// Cavalry: 3 chevrons, one per horseman in the unit.
function drawCavalryChevrons(size){
  const chevR = size*0.15;
  const pts = [[-size*0.20,size*0.05],[size*0.20,size*0.05],[0,-size*0.20]];
  pts.forEach(([dx,dy])=>{
    ctx.save(); ctx.translate(dx,dy);
    ctx.beginPath();
    ctx.moveTo(0,-chevR); ctx.lineTo(chevR*0.85,chevR*0.7); ctx.lineTo(0,chevR*0.25); ctx.lineTo(-chevR*0.85,chevR*0.7);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();
  });
}
function drawCannonImage(size, side){
  const img = UNIT_IMAGES[side===SIDES.RED ? 'cannon_red' : 'cannon_blue'];
  if(img && img.complete && img.naturalWidth>0){
    const h = size*0.95, w = h*(img.naturalWidth/img.naturalHeight);
    ctx.drawImage(img, -w/2, -h/2, w, h);
  } else {
    // fallback while the image decodes (rare — local base64 data URIs resolve almost immediately)
    ctx.beginPath(); ctx.moveTo(0,-size*0.35); ctx.lineTo(size*0.35,0); ctx.lineTo(0,size*0.35); ctx.lineTo(-size*0.35,0);
    ctx.closePath(); ctx.fill(); ctx.stroke();
  }
}
function drawBrigadierPortrait(size, u, isSel){
  const key = BRIGADIER_PORTRAIT_KEY[u.historicalName];
  const img = key ? UNIT_IMAGES[key] : null;
  if(img && img.complete && img.naturalWidth>0){
    const s = size*0.92, r = s*0.12;
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(-s/2+r,-s/2); ctx.arcTo(s/2,-s/2,s/2,s/2,r); ctx.arcTo(s/2,s/2,-s/2,s/2,r);
    ctx.arcTo(-s/2,s/2,-s/2,-s/2,r); ctx.arcTo(-s/2,-s/2,s/2,-s/2,r); ctx.closePath();
    ctx.clip();
    ctx.drawImage(img, -s/2,-s/2,s,s);
    ctx.restore();
    if(isSel){
      ctx.strokeStyle = '#f4e9c9'; ctx.lineWidth = Math.max(2, size*0.09);
      ctx.beginPath();
      ctx.moveTo(-s/2+r,-s/2); ctx.arcTo(s/2,-s/2,s/2,s/2,r); ctx.arcTo(s/2,s/2,-s/2,s/2,r);
      ctx.arcTo(-s/2,s/2,-s/2,-s/2,r); ctx.arcTo(-s/2,-s/2,s/2,-s/2,r); ctx.closePath();
      ctx.stroke();
    }
    ctx.strokeStyle = '#c9a227'; ctx.lineWidth = Math.max(1.5, size*0.05);
    ctx.beginPath();
    ctx.moveTo(-s/2+r,-s/2); ctx.arcTo(s/2,-s/2,s/2,s/2,r); ctx.arcTo(s/2,s/2,-s/2,s/2,r);
    ctx.arcTo(-s/2,s/2,-s/2,-s/2,r); ctx.arcTo(-s/2,-s/2,s/2,-s/2,r); ctx.closePath();
    ctx.stroke();
    return true; // portrait drawn
  }
  return false; // no match or not yet loaded — caller falls back to the star
}

function drawUnit(u, off){
  off = off || {dx:0, dy:0, scale:1};
  const vp = getUnitVisualPos(u);
  const cx = vp.x*CELL+CELL/2 + off.dx*CELL, cy = sy(vp.y)*CELL+CELL/2 + off.dy*CELL;
  const t = UNIT_TYPES[u.type];
  const isSel = state.selectedUnitId===u.id;
  const col = SIDE_COLOR[u.side];
  const size = CELL*0.62*off.scale; // common scale basis for the new marker drawing functions
  const r = CELL*0.30*off.scale;    // legacy radius, still used by the Brigadier star fallback

  const concealed = isConcealedFromEnemy(u);

  // Brigadier: portrait photo instead of a drawn shape (falls back to the star below if unmatched).
  if(t.key==='BRIGADIER'){
    ctx.save();
    ctx.translate(cx,cy);
    ctx.globalAlpha = concealed ? 0.55 : 1;
    const drew = drawBrigadierPortrait(size, u, isSel);
    ctx.globalAlpha = 1;
    ctx.restore();
    if(drew) return;
    // fall through to the star shape below if no portrait was available
  }

  ctx.save();
  ctx.translate(cx,cy);
  ctx.globalAlpha = concealed ? 0.55 : 1;
  ctx.fillStyle = col;
  ctx.strokeStyle = isSel ? '#f4e9c9' : 'rgba(0,0,0,0.4)';
  ctx.lineWidth = isSel ? 3 : 1.5;
  if(concealed) ctx.setLineDash([3,2]);

  if(t.key==='INFANTRY' || t.key==='GUARD'){
    if(u.formation==='square') drawInfantrySquareDots(size);
    else drawInfantryDots(size);
  } else if(t.key==='HEAVY_CAV' || t.key==='LIGHT_CAV'){
    drawCavalryChevrons(size);
  } else if(t.isArtillery){
    drawCannonImage(size, u.side);
  } else if(t.key==='BRIGADIER'){
    // star fallback (no historical portrait match)
    ctx.beginPath();
    for(let i=0;i<5;i++){
      const ang = -Math.PI/2 + i*(2*Math.PI/5);
      const ang2 = ang + Math.PI/5;
      ctx.lineTo(Math.cos(ang)*r, Math.sin(ang)*r);
      ctx.lineTo(Math.cos(ang2)*r*0.45, Math.sin(ang2)*r*0.45);
    }
    ctx.closePath(); ctx.fill(); ctx.stroke();
  }
  ctx.setLineDash([]);
  ctx.globalAlpha = 1;
  ctx.restore();

  // Guard / Heavy Cavalry tier marker — gold asterisk in the corner
  if((t.key==='GUARD') || (t.key==='HEAVY_CAV')){
    drawGoldAsterisk(size, cx + size*0.36, cy - size*0.34);
  }

  // status pip: turned-around indicator, kept clear of the guard/heavy asterisk corner
  if(u.turnOnly){
    ctx.fillStyle = '#c9a24a';
    ctx.beginPath(); ctx.arc(cx-size*0.36, cy-size*0.34, 5, 0, Math.PI*2); ctx.fill();
  }
}

// Attack Column: two Infantry/Guard units sharing a square, drawn as a single
// combined 20-man mass (4 ranks of 5) rather than two overlapping icons.
function drawColumnUnitPair(u1, u2){
  const vp = getUnitVisualPos(u1);
  const cx = vp.x*CELL+CELL/2, cy = sy(vp.y)*CELL+CELL/2;
  const isSel = state.selectedUnitId===u1.id || state.selectedUnitId===u2.id;
  const col = SIDE_COLOR[u1.side];
  const size = CELL*0.66;
  const concealed = isConcealedFromEnemy(u1) || isConcealedFromEnemy(u2);

  ctx.save();
  ctx.translate(cx,cy);
  ctx.globalAlpha = concealed ? 0.55 : 1;
  ctx.fillStyle = col;
  ctx.strokeStyle = isSel ? '#f4e9c9' : 'rgba(0,0,0,0.4)';
  ctx.lineWidth = isSel ? 3 : 1.5;
  if(concealed) ctx.setLineDash([3,2]);
  drawColumnDots(size);
  ctx.setLineDash([]);
  ctx.globalAlpha = 1;
  ctx.restore();

  if(u1.type==='GUARD' || u2.type==='GUARD'){
    drawGoldAsterisk(size, cx + size*0.34, cy - size*0.36);
  }
  if(u1.turnOnly || u2.turnOnly){
    ctx.fillStyle = '#c9a24a';
    ctx.beginPath(); ctx.arc(cx-size*0.34, cy-size*0.36, 5, 0, Math.PI*2); ctx.fill();
  }
}

let highlightCells = [];

/* =========================================================
   DEPLOYMENT PHASE
   Rulebook: players alternate placing whole Brigades, not individual
   units, and choose freely which units go into each Brigade — the
   only constraint is a Brigadier first, then at least 2 more units.
   state.deployPool[side] holds every not-yet-placed unit type for
   that side (starts as the full 17-unit army). state.deployBrigadeIndex
   tracks which Brigade (0-2) a side is currently filling. Control only
   passes to the other side once the active side confirms their current
   Brigade (Brigadier + at least 2 more units).
========================================================= */
const FULL_ARMY_POOL = BRIGADE_COMPOSITIONS.flat(); // 3 Brigadier, 2 Guard, 6 Infantry, 2 Heavy Cav, 2 Light Cav, 2 Artillery

function initDeployment(){
  resetHistoricalIdentities();
  state.captureHoldCounter = { red:0, blue:0 };
  state.turnNumber = 1;
  if(state.scenario){
    state.deployPool = { red: [...state.scenario.sides.red.units], blue: [...state.scenario.sides.blue.units] };
  } else {
    state.deployPool = { red: [...FULL_ARMY_POOL], blue: [...FULL_ARMY_POOL] };
  }
  state.deployBrigadeIndex = { red: 0, blue: 0 };
  state.currentBrigadeHasBrigadier = { red: false, blue: false };
  state.currentBrigadeCount = { red: 0, blue: 0 };
  state.deployTurn = Math.random()<0.5 ? SIDES.RED : SIDES.BLUE;
  resetUndoStack();
  log(`Roll for first placement: ${SIDE_LABEL[state.deployTurn]} places their first Brigade.`, 'system');
  document.getElementById('sidebar').style.display='flex';
  document.getElementById('rosterPanel').style.display='flex';
  document.getElementById('unitOverlay').classList.add('hidden');
  renderRoster();
  updateHeader();
  if(state.mode==='ai' && state.deployTurn===state.aiSide){
    setTimeout(aiDeployStep, 500);
  }
}

function sideFullyDeployed(side){ return state.deployBrigadeIndex[side] >= 3; }

// How many more non-Brigadier units side may add to their CURRENT Brigade
// right now without leaving a future Brigade short of its 2-unit minimum.
function canAddMoreToCurrentBrigade(side){
  const bIdx = state.deployBrigadeIndex[side];
  const remainingBrigadesAfter = 2 - bIdx;
  const poolNonBrig = state.deployPool[side].filter(t=>t!=='BRIGADIER').length;
  return (poolNonBrig - 1) >= 2*remainingBrigadesAfter;
}

let selectedDeployType = null;
function renderRoster(){
  const list = document.getElementById('rosterList');
  const progress = document.getElementById('brigadeProgress');
  const confirmBtn = document.getElementById('confirmBrigadeBtn');
  list.innerHTML = '';
  const side = state.deployTurn;

  if(sideFullyDeployed(side)){
    document.getElementById('rosterTitle').textContent = `${SIDE_LABEL[side]}: fully deployed`;
    progress.textContent = '';
    confirmBtn.style.display = 'none';
    checkDeployAdvance();
    return;
  }

  const bIdx = state.deployBrigadeIndex[side];
  const hasBrig = state.currentBrigadeHasBrigadier[side];
  const count = state.currentBrigadeCount[side];
  document.getElementById('rosterTitle').textContent = `${SIDE_LABEL[side]}: Brigade ${bIdx+1} of 3`;
  progress.textContent = !hasBrig
    ? 'Place a Brigadier to start this Brigade'
    : `${count} unit${count===1?'':'s'} placed (minimum 2)`;

  const pool = state.deployPool[side];
  const showTypes = !hasBrig
    ? pool.filter(t=>t==='BRIGADIER')
    : pool.filter(t=>t!=='BRIGADIER');
  const capped = hasBrig && !canAddMoreToCurrentBrigade(side);

  // de-duplicate for display (e.g. 6x Infantry shows as one chip you can tap repeatedly)
  const seen = {};
  showTypes.forEach((typeKey)=>{
    if(seen[typeKey]) return;
    seen[typeKey] = true;
    const remainingOfType = showTypes.filter(t=>t===typeKey).length;
    const t = UNIT_TYPES[typeKey];
    const chip = document.createElement('div');
    const disabled = capped;
    chip.className = 'roster-chip' + (selectedDeployType===typeKey ? ' selected' : '') + (disabled ? ' placed' : '');
    chip.innerHTML = `<div class="swatch" style="background:${SIDE_COLOR[side]}"></div><div>${t.label} ${remainingOfType>1?`(${remainingOfType} left)`:''}</div>`;
    if(!disabled){
      chip.onclick = ()=>{ selectedDeployType = typeKey; renderRoster(); };
      chip.addEventListener('pointerdown', (e)=> startChipDrag(e, typeKey));
    }
    list.appendChild(chip);
  });
  if(capped){
    const note = document.createElement('div');
    note.style.cssText = 'color:var(--ink-dim);font-size:11px;padding:4px 2px;font-style:italic;';
    note.textContent = 'Remaining units are reserved for your other Brigades.';
    list.appendChild(note);
  }

  confirmBtn.style.display = hasBrig ? 'inline-block' : 'none';
  confirmBtn.disabled = !(hasBrig && count>=2);
  draw();
}

/* =========================================================
   DEPLOYMENT: DRAG AND DROP
   A roster chip can be tapped (existing select-then-tap-board flow,
   unchanged) or dragged straight onto the board. Movement past a small
   threshold counts as a drag; anything less falls through to a normal
   tap so short/imprecise taps still work.
========================================================= */
let dragState = null; // {typeKey, startX, startY, dragging, hoverCell}

function startChipDrag(e, typeKey){
  if(state.phase!=='deploy') return;
  dragState = { typeKey, startX:e.clientX, startY:e.clientY, dragging:false, hoverCell:null };
  const move = (ev)=>{
    if(!dragState) return;
    const dx = ev.clientX-dragState.startX, dy = ev.clientY-dragState.startY;
    if(!dragState.dragging && Math.hypot(dx,dy) > 8){
      dragState.dragging = true;
      const ghost = document.getElementById('dragGhost');
      ghost.classList.add('show');
      ghost.style.background = SIDE_COLOR[state.deployTurn];
      ghost.textContent = UNIT_TYPES[typeKey].label;
    }
    if(dragState.dragging){
      const ghost = document.getElementById('dragGhost');
      ghost.style.left = (ev.clientX-22)+'px';
      ghost.style.top = (ev.clientY-22)+'px';
      updateDragHoverCell(ev.clientX, ev.clientY);
      draw();
    }
  };
  const up = (ev)=>{
    document.removeEventListener('pointermove', move);
    document.removeEventListener('pointerup', up);
    if(dragState && dragState.dragging){
      document.getElementById('dragGhost').classList.remove('show');
      if(dragState.hoverCell){
        pushUndoSnapshot();
        const placed = attemptDeployAt(dragState.typeKey, dragState.hoverCell.x, dragState.hoverCell.y);
        if(!placed) undoStack.pop();
      }
    }
    dragState = null;
    draw();
  };
  document.addEventListener('pointermove', move);
  document.addEventListener('pointerup', up);
}

function updateDragHoverCell(clientX, clientY){
  const rect = canvas.getBoundingClientRect();
  if(clientX<rect.left || clientX>rect.right || clientY<rect.top || clientY>rect.bottom){
    dragState.hoverCell = null; return;
  }
  const cellPxX = rect.width / COLS, cellPxY = rect.height / ROWS;
  const x = Math.floor((clientX-rect.left)/cellPxX);
  const screenY = Math.floor((clientY-rect.top)/cellPxY);
  const y = sy(screenY);
  dragState.hoverCell = inBounds(x,y) ? {x,y} : null;
}

// Shared deployment-placement validation, used by both tap-to-place and drag-and-drop.
// Returns true on success, false if the attempt was rejected (and logs why).
function attemptDeployAt(typeKey, x, y){
  const side = state.deployTurn;
  const zoneOk = side===SIDES.RED ? (y>=ROWS-2) : (y<=1);
  if(!zoneOk){ log('Deployment must be within your first two rows.', 'system'); return false; }
  const terr = terrainAt(x,y);
  if(terr.restrictTo && !terr.restrictTo.includes(typeKey)){ log(`${UNIT_TYPES[typeKey].label} cannot deploy there.`, 'system'); return false; }
  const occ = unitsAt(x,y);
  if(occ.length>0){ log('Square already occupied.', 'system'); return false; }
  placeUnit(side, typeKey, x, y);
  return true;
}

function checkDeployAdvance(){
  if(sideFullyDeployed(SIDES.RED) && sideFullyDeployed(SIDES.BLUE)){
    document.getElementById('endDeployBtn').disabled = false;
  }
}

function handleDeployClick(x,y){
  const side = state.deployTurn;
  if(state.mode==='ai' && side===state.aiSide) return; // not human's turn to click
  if(selectedDeployType===null){ log('Select a unit from the roster first, or drag it onto the board.', 'system'); return; }
  const typeKey = selectedDeployType;
  pushUndoSnapshot();
  const placed = attemptDeployAt(typeKey, x, y);
  if(placed) selectedDeployType = null;
  else undoStack.pop(); // nothing happened — don't leave a no-op snapshot in the undo stack
}

// Shared by human clicks and the AI: places one unit of `typeKey` from
// side's pool at (x,y), into their currently in-progress Brigade.
function placeUnit(side, typeKey, x, y){
  const bIdx = state.deployBrigadeIndex[side];
  const pool = state.deployPool[side];
  const poolIdx = pool.indexOf(typeKey);
  if(poolIdx===-1) return; // none left of that type
  const t = UNIT_TYPES[typeKey];
  const u = newUnit(side, typeKey, x, y, bIdx);
  state.units.push(u);
  pool.splice(poolIdx,1);
  log(`${SIDE_LABEL[side]} deploys ${unitLabel(u)} (Brigade ${bIdx+1}) at (${x},${y}).`);

  if(typeKey==='BRIGADIER'){
    state.currentBrigadeHasBrigadier[side] = true;
  } else {
    state.currentBrigadeCount[side]++;
  }

  renderRoster();
  updateHeader();
  draw();

  if(state.mode==='ai' && state.deployTurn===state.aiSide && !sideFullyDeployed(state.aiSide)){
    setTimeout(aiDeployStep, 450);
  }
}

// Called when a side confirms their current Brigade is done (Brigadier +
// at least 2 more units placed). Advances to the next Brigade and passes
// the turn to the other side, matching the alternate-Brigade rule.
function confirmCurrentBrigade(){
  const side = state.deployTurn;
  if(!(state.currentBrigadeHasBrigadier[side] && state.currentBrigadeCount[side]>=2)) return;
  const bIdx = state.deployBrigadeIndex[side];
  log(`${SIDE_LABEL[side]}'s Brigade ${bIdx+1} is fully deployed.`, 'system');
  state.deployBrigadeIndex[side]++;
  state.currentBrigadeHasBrigadier[side] = false;
  state.currentBrigadeCount[side] = 0;
  selectedDeployType = null;

  const other = side===SIDES.RED ? SIDES.BLUE : SIDES.RED;
  if(!sideFullyDeployed(other)){
    state.deployTurn = other;
  } // else: other side already finished all 3 — this side keeps going on its own remaining Brigades
  resetUndoStack(); // confirming is a commit point — the next Brigade starts with a clean undo slate

  renderRoster();
  updateHeader();
  draw();

  if(state.mode==='ai' && state.deployTurn===state.aiSide && !sideFullyDeployed(state.aiSide)){
    setTimeout(aiDeployStep, 450);
  }
}

/* =========================================================
   AI: DEPLOYMENT
   One formation plan per Brigade, each anchored to its own column
   band so every Brigade starts as its own connected cluster.
   Front = the row of the AI's 2-row zone closer to the enemy.
========================================================= */
const AI_DEPLOY_PLANS = [
  // Brigade 0 — cols 2-5 (matches BRIGADE_COMPOSITIONS[0])
  [
    { type:'LIGHT_CAV',  col:2, front:true  },
    { type:'GUARD',      col:3, front:true  },
    { type:'INFANTRY',   col:4, front:true  },
    { type:'INFANTRY',   col:5, front:true  },
    { type:'ARTILLERY',  col:3, front:false },
    { type:'BRIGADIER',  col:4, front:false }
  ],
  // Brigade 1 — cols 9-11 (matches BRIGADE_COMPOSITIONS[1])
  [
    { type:'INFANTRY',   col:9,  front:true  },
    { type:'INFANTRY',   col:10, front:true  },
    { type:'HEAVY_CAV',  col:11, front:true  },
    { type:'ARTILLERY',  col:9,  front:false },
    { type:'BRIGADIER',  col:10, front:false }
  ],
  // Brigade 2 — cols 15-18 (matches BRIGADE_COMPOSITIONS[2])
  [
    { type:'LIGHT_CAV',  col:15, front:true  },
    { type:'GUARD',      col:16, front:true  },
    { type:'INFANTRY',   col:17, front:true  },
    { type:'INFANTRY',   col:18, front:true  },
    { type:'HEAVY_CAV',  col:16, front:false },
    { type:'BRIGADIER',  col:17, front:false }
  ]
];

function aiDeployStep(){
  const side = state.aiSide;
  if(sideFullyDeployed(side)) return;
  const bIdx = state.deployBrigadeIndex[side];
  const plan = AI_DEPLOY_PLANS[bIdx];

  // Brigadier must go first, same as the human flow requires
  if(!state.currentBrigadeHasBrigadier[side]){
    const brigEntry = plan.find(p=>p.type==='BRIGADIER');
    placeAiPlanEntry(side, brigEntry);
    return;
  }

  const usedPlanEntries = (state._aiPlanUsed || (state._aiPlanUsed = {red:new Set(), blue:new Set()}))[side];
  const remainingPlanEntries = plan.filter(p => p.type!=='BRIGADIER' && !usedPlanEntries.has(p) && state.deployPool[side].includes(p.type));

  if(remainingPlanEntries.length===0){
    confirmCurrentBrigade();
    return;
  }

  placeAiPlanEntry(side, remainingPlanEntries[0]);
}

function placeAiPlanEntry(side, planEntry){
  const usedPlanEntries = (state._aiPlanUsed || (state._aiPlanUsed = {red:new Set(), blue:new Set()}))[side];
  usedPlanEntries.add(planEntry);
  const frontRow = side===SIDES.RED ? ROWS-2 : 1;
  const backRow  = side===SIDES.RED ? ROWS-1 : 0;
  const targetRow = planEntry.front ? frontRow : backRow;
  const cell = findNearestFreeDeployCell(side, planEntry.col, targetRow, planEntry.type);
  placeUnit(side, planEntry.type, cell.x, cell.y);
}

function findNearestFreeDeployCell(side, col, row, typeKey){
  const zoneRows = side===SIDES.RED ? [ROWS-2, ROWS-1] : [0,1];
  const candidates = [];
  for(const y of zoneRows){
    for(let x=0;x<COLS;x++){
      const terr = terrainAt(x,y);
      if(terr.restrictTo && !terr.restrictTo.includes(typeKey)) continue;
      if(unitsAt(x,y).length>0) continue;
      const dist = Math.abs(x-col) + Math.abs(y-row)*0.5;
      candidates.push({x,y,dist});
    }
  }
  candidates.sort((a,b)=>a.dist-b.dist);
  return candidates[0] || {x:col,y:row};
}

/* =========================================================
   AI: EVALUATION
========================================================= */
const AI_UNIT_VALUE = { BRIGADIER:2, INFANTRY:4, GUARD:5, HEAVY_CAV:5, LIGHT_CAV:4, ARTILLERY:6 };

function evaluateState(perspective){
  let score = 0;
  const enemy = perspective===SIDES.RED ? SIDES.BLUE : SIDES.RED;
  const connMine  = movableUnitsForSide(perspective);
  const connEnemy = movableUnitsForSide(enemy);
  for(const u of state.units){
    if(u.removed) continue;
    let unitScore = AI_UNIT_VALUE[u.type];
    const terr = terrainAt(u.x,u.y);
    if(terr.defenseBonus && (u.type==='INFANTRY'||u.type==='GUARD')) unitScore += 0.6;
    if(terr.elevation>0) unitScore += 0.3;
    if(u.formation==='square') unitScore += 0.4;
    const conn = u.side===perspective ? connMine : connEnemy;
    if(!conn.has(u.id)) unitScore -= 1.0;
    score += (u.side===perspective ? 1 : -1) * unitScore;
  }
  return score;
}

// Rough estimate of how exposed `unit` would be, standing where it is now,
// to enemy units that could reach + fight it on their next turn.
function threatPenalty(unit, side){
  let penalty = 0;
  const enemy = side===SIDES.RED ? SIDES.BLUE : SIDES.RED;
  for(const e of state.units){
    if(e.removed || e.side!==enemy || isConcealedFromEnemy(e)) continue;
    const eType = UNIT_TYPES[e.type];
    if(!eType.canFight) continue;
    const reach = unitBaseMove(e) + 1; // move then engage
    if(chebyshev(e,unit) <= reach){
      let w = 1;
      if(eType.isCavalry && (unit.type==='INFANTRY'||unit.type==='GUARD') && unit.formation!=='square') w = 1.6;
      if(eType.isArtillery) w = 0.6;
      penalty += w;
    }
  }
  return penalty;
}

/* =========================================================
   AI: MOVEMENT
========================================================= */
// Core Tactic #5, Ground Worth Bleeding For: Medium+ values ending a move on
// terrain that actually helps, rather than pure distance-to-enemy pull.
function terrainSeekBonus(unitTypeKey, x, y){
  const terr = terrainAt(x,y);
  if(terr.key==='HILL') return 0.35; // tie-win vs a lower attacker, benefits any unit type
  if(terr.key==='WOODS' && (unitTypeKey==='INFANTRY'||unitTypeKey==='GUARD')) return 0.3;
  if(terr.key==='BUILDING' && (unitTypeKey==='INFANTRY'||unitTypeKey==='GUARD'||unitTypeKey==='ARTILLERY')) return 0.3;
  return 0;
}

// Core Tactic #2, The Gunner's Creed: Medium+ non-artillery units value ending a
// move screening a friendly gun that doesn't already have a screener.
function screensGunBonus(mover, side, pos){
  const t = UNIT_TYPES[mover.type];
  if(t.isArtillery || t.key==='BRIGADIER') return 0;
  const unscreenedGun = state.units.find(o=>!o.removed && o.side===side && o.type==='ARTILLERY' &&
    isAdjacent(pos,o) &&
    !state.units.some(s=>!s.removed && s.id!==mover.id && s.id!==o.id && s.side===side &&
      UNIT_TYPES[s.type].key!=='ARTILLERY' && UNIT_TYPES[s.type].key!=='BRIGADIER' && isAdjacent(o,s)));
  return unscreenedGun ? 0.5 : 0;
}

// Manoeuvre #12, Reserve Doctrine: Hard holds a Guard/Heavy Cavalry unit back
// from the opening exchanges unless a genuine crisis point already exists —
// a friendly unit already in contact and under real threat.
function reserveCrisisExists(side){
  return state.units.some(u=>!u.removed && u.side===side && u.type!=='BRIGADIER' && !UNIT_TYPES[u.type].isArtillery &&
    state.units.some(o=>!o.removed && o.side!==side && isAdjacent(u,o)) && threatPenalty(u,side) > 1.0);
}

// Manoeuvre #20, The Bogged Column: Hard scouts for an enemy gun stuck on/beside
// ploughed ground with no Cavalry escort in its own Brigade, and exploits it.
function findBoggedEnemyGun(side){
  const enemy = otherSide(side);
  return state.units.find(o=>!o.removed && o.side===enemy && UNIT_TYPES[o.type].isArtillery &&
    terrainAt(o.x,o.y).plough && brigadeCavalryCount(o)===0);
}

// Operations: how much a candidate position or fight target actually serves the
// active scenario's objective — generalizes brigadeBreakBonus to whatever the
// real win condition is, rather than always assuming "break 2 of 3 Brigades."
function scenarioMoveBonus(mover, side, pos){
  if(!state.scenario) return 0;
  let bonus = 0;
  for(const cond of state.scenario.objective.conditions){
    if(cond.type==='CAPTURE_ZONE'){
      const dists = cond.params.zoneSquares.map(z=>chebyshev(pos,z));
      bonus += Math.max(0, 3 - Math.min(...dists)) * 0.25; // pull toward the zone as it gets close
    } else if(cond.type==='ESCAPE_ZONE' && cond.params.escapingSide===side){
      const edgeDist = Math.min(...cond.params.edgeRows.map(r=>Math.abs(pos.y-r)));
      bonus += Math.max(0, 4 - edgeDist) * 0.2; // pull toward the exit edge
    } else if(cond.type==='PROTECT_UNIT' && cond.params.protectSide===side){
      const asset = state.units.find(o=>!o.removed && o.side===side && cond.params.unitTypes.includes(o.type));
      if(asset && UNIT_TYPES[mover.type].key!=='BRIGADIER' && !UNIT_TYPES[mover.type].isArtillery && isAdjacent(pos,asset)) bonus += 0.4;
    } else if(cond.type==='SURVIVE_TURNS' && cond.params.defender===side){
      bonus += terrainSeekBonus(mover.type, pos.x, pos.y) * 0.6; // lean harder into defensible ground
    }
  }
  return bonus;
}

function orderAiUnitsForMove(side){
  // Brigadiers move first: they anchor their Brigade's cohesion chain (never
  // penalized for their own "disconnection" — see movableUnitsForSide), so
  // leading with them gives everyone else a new, already-moved anchor to
  // path toward. Moving them last caused a standoff: nobody wants to be the
  // first unit to step away from the Brigadier's stale position, so an
  // entire Brigade could freeze in place once no immediate threat pushed it.
  const pri = { BRIGADIER:0, INFANTRY:1, GUARD:1, LIGHT_CAV:2, HEAVY_CAV:2, ARTILLERY:3 };
  return state.units.filter(u=>!u.removed && u.side===side).sort((a,b)=>pri[a.type]-pri[b.type]).map(u=>u.id);
}

function nearestEnemyDist(pos, side){
  const enemy = side===SIDES.RED ? SIDES.BLUE : SIDES.RED;
  let best = 999;
  for(const e of state.units){
    if(e.removed || e.side!==enemy || isConcealedFromEnemy(e)) continue;
    const d = chebyshev(pos, e);
    if(d<best) best = d;
  }
  return best;
}

function aiDecideAndExecuteMove(u){
  if(u.removed || u.turnOnly) return;
  const side = u.side;
  const t = UNIT_TYPES[u.type];

  if(u.formation==='square'){
    // Reconsider every phase: leaving Square costs this whole move phase (per rulebook),
    // so only bother once the threat that justified it has actually passed.
    if(threatPenalty(u, side) < 0.8){
      u.formation = 'line';
      state.moved.add(u.id);
      log(`${unitLabel(u)} (${SIDE_LABEL[side]}) reforms Line, no longer threatened.`, side);
    }
    return; // whether it left Square or stayed, a squared unit takes no other move action this phase
  }

  const candidates = [{x:u.x,y:u.y,stay:true}].concat(legalMoves(u));
  const seekTactics = state.aiDifficulty !== 'easy';

  // Hard only: lay an ambush instead of advancing, when an enemy is close enough
  // to plausibly walk into it but not already close enough that fighting normally
  // is clearly better. A first-pass heuristic, not a deep tactical read.
  if(state.aiDifficulty==='hard' && canLayAmbush(u)){
    const near = nearestEnemyDist(u, side);
    if(near>=2 && near<=5){
      u.hidden = true;
      state.moved.add(u.id);
      log(`${unitLabel(u)} (${SIDE_LABEL[side]}) lies in ambush, sensing the enemy closing in.`, side);
      return;
    }
  }

  let best = candidates[0], bestScore = -Infinity;
  const isReserveType = t.key==='GUARD' || (t.isCavalry && t.key==='HEAVY_CAV');
  const holdingReserve = state.aiDifficulty==='hard' && isReserveType && !reserveCrisisExists(side);
  const boggedTarget = (state.aiDifficulty==='hard' && t.isCavalry) ? findBoggedEnemyGun(side) : null;
  for(const c of candidates){
    const ox=u.x, oy=u.y;
    u.x=c.x; u.y=c.y;
    let s = evaluateState(side) - 0.5*threatPenalty(u, side);
    // Without some positional pull, every "safe" square scores identically and the
    // AI never closes to fight. Infantry/cavalry are pulled toward the nearest enemy;
    // artillery is pulled toward its ideal firing band (3-5 squares) instead.
    // Reserve Doctrine (Hard): suppress this pull for a held-back Guard/Heavy
    // Cavalry unit until a real crisis exists, so it doesn't rush the opening exchanges.
    if(!holdingReserve){
      if(t.isArtillery){
        const d = nearestEnemyDist(c, side);
        s -= Math.abs(d-4) * 0.06;
      } else {
        s -= nearestEnemyDist(c, side) * 0.12;
      }
    }

    // Medium+: deliberately seek out a Charge instead of only charging by accident.
    // Also coordinates with an Attack Column already formed this turn (Manoeuvre
    // #19, Hammer and Column) — a charge against the same target the Column is
    // already threatening is worth more than an isolated one.
    if(seekTactics && t.isCavalry && !c.stay && isCleanChargeRun(ox,oy,c.x,c.y)){
      const chargeableTarget = state.units.find(o=>!o.removed && o.side!==side && isAdjacent(c,o) &&
        o.formation!=='square' && terrainAt(o.x,o.y).elevation<=terrainAt(c.x,c.y).elevation);
      if(chargeableTarget){
        s += 2.2;
        if(state.turnComboTarget && state.turnComboTarget===chargeableTarget.id) s += 1.0;
      }
    }
    // Medium+: deliberately form an Attack Column ahead of a fight it can already see coming,
    // instead of doubling up only as an accidental byproduct of two units picking the same square.
    if(seekTactics && (t.key==='INFANTRY'||t.key==='GUARD') && !c.stay){
      const occ = unitsAt(c.x,c.y).filter(o=>!o.removed && o.side===side && (o.type==='INFANTRY'||o.type==='GUARD'));
      if(occ.length===1 && terrainAt(c.x,c.y).allowDouble && nearestEnemyDist(c, side)<=3) s += 1.4;
    }
    // Core Tactic #5, Ground Worth Bleeding For: value good terrain when otherwise similar.
    if(seekTactics) s += terrainSeekBonus(t.key, c.x, c.y);
    // Core Tactic #2, The Gunner's Creed: value screening an unguarded friendly gun.
    if(seekTactics) s += screensGunBonus(u, side, c);
    // Manoeuvre #20, The Bogged Column (Hard): close on a stuck, unescorted enemy gun.
    if(boggedTarget) s -= chebyshev(c, boggedTarget) * 0.15;
    // Operations: pull toward whatever the active scenario's objective actually rewards.
    if(state.scenario) s += scenarioMoveBonus(u, side, c);

    s += Math.random() * 0.03; // tie-breaking jitter: prevents an exact repeated stall between equally-scored options
    u.x=ox; u.y=oy;
    if(s>bestScore){ bestScore=s; best=c; }
  }

  const canSquare = t.canFormSquare && terrainAt(u.x,u.y).key!=='WOODS' && terrainAt(u.x,u.y).key!=='BUILDING' && unitsAt(u.x,u.y).length<=1;
  if(canSquare && threatPenalty(u, side) >= 1.4){
    const origForm = u.formation;
    u.formation = 'square';
    const squareScore = evaluateState(side) - 0.15*threatPenalty(u, side);
    u.formation = origForm;
    if(squareScore > bestScore){
      u.formation = 'square';
      state.moved.add(u.id);
      log(`${unitLabel(u)} (${SIDE_LABEL[side]}) forms Square, sensing cavalry nearby.`, side);
      return;
    }
  }

  if(best && !best.stay){
    const fromX=u.x, fromY=u.y;
    displaceBrigadierIfPresent(best.x, best.y, fromX, fromY);
    if(t.isArtillery && !isHorseArtillery(u) && terrainAt(best.x,best.y).plough) consumePloughEscort(u);
    animateUnitTo(u, best.x, best.y);
    if(t.isCavalry && isCleanChargeRun(fromX,fromY,best.x,best.y) && hasChargeableTargetAt(side, best)){
      u.charged = true;
      log(`${unitLabel(u)} (${SIDE_LABEL[side]}) charges to engage!`, side);
    } else {
      log(`${unitLabel(u)} (${SIDE_LABEL[side]}) advances to (${best.x},${best.y}).`, side);
    }
    if(seekTactics && (t.key==='INFANTRY'||t.key==='GUARD')){
      const stacked = unitsAt(best.x,best.y).some(o=>!o.removed && o.id!==u.id && o.side===side && (o.type==='INFANTRY'||o.type==='GUARD'));
      if(stacked){
        const nearbyEnemy = state.units.find(o=>!o.removed && o.side!==side && isAdjacent(best,o));
        if(nearbyEnemy) state.turnComboTarget = nearbyEnemy.id;
      }
    }
    state.moved.add(u.id);
  }
}

function aiDoMovePhase(){
  const order = orderAiUnitsForMove(state.aiSide);
  let i = 0;
  function step(){
    if(state.gameOver) return;
    if(i>=order.length){ endMovePhase(); return; }
    const u = state.units.find(x=>x.id===order[i]); i++;
    aiDecideAndExecuteMove(u);
    draw();
    setTimeout(step, 340);
  }
  step();
}

/* =========================================================
   AI: ARTILLERY FIRE
========================================================= */
function aiFireDecision(gun, onComplete){
  onComplete = onComplete || function(){};
  const targets = artilleryTargets(gun);
  if(targets.length===0){ state.fired.add(gun.id); onComplete(); return; }
  let best=null, bestScore=-Infinity;
  for(const t of targets){
    const dist = chebyshev(gun,t);
    const pHit = dist<=1 ? 1 : Math.max(0,(7-dist))/6;
    let score = pHit * AI_UNIT_VALUE[t.type];
    if(state.aiDifficulty!=='easy') score += pHit * brigadeBreakBonus(t);
    // Manoeuvre #11, Grand Battery (Hard): concentrate onto a target another
    // friendly gun already hit this phase, while still within effective range.
    if(state.aiDifficulty==='hard' && dist<=3 && state.turnGunTargets && state.turnGunTargets.has(t.id)) score += 1.5;
    if(score>bestScore){ bestScore=score; best=t; }
  }
  if(!state.turnGunTargets) state.turnGunTargets = new Set();
  state.turnGunTargets.add(best.id);
  fireArtillery(gun, best, onComplete);
}

function aiDoFirePhase(){
  const guns = state.units.filter(u=>!u.removed && u.side===state.aiSide && UNIT_TYPES[u.type].isArtillery && !state.fired.has(u.id));
  let i=0;
  function step(){
    if(state.gameOver) return;
    if(i>=guns.length){ endFirePhase(); return; }
    const gun = guns[i]; i++;
    if(!gun.removed){
      aiFireDecision(gun, ()=>{ draw(); setTimeout(step, 250); });
    } else {
      setTimeout(step, 100);
    }
  }
  step();
}

/* =========================================================
   AI: FIGHTING
========================================================= */
function estimateFightValue(a, t){
  let aD = bonusDiceCount(a, t, false).count;
  let dD = bonusDiceCount(t, a, true).count;
  const aType = UNIT_TYPES[a.type], tType = UNIT_TYPES[t.type];
  if(aType.isCavalry && (tType.key==='INFANTRY'||tType.key==='GUARD') && t.formation!=='square') aD = Math.max(aD,2);
  if((aType.key==='INFANTRY'||aType.key==='GUARD') && a.formation!=='square' && (tType.key==='INFANTRY'||tType.key==='GUARD') && t.formation==='square') aD = Math.max(aD,2);
  const edge = aD - dD;
  return edge*2 + AI_UNIT_VALUE[t.type]*0.4 - AI_UNIT_VALUE[a.type]*0.15;
}

// Medium+: how much finishing off `target` matters for actually winning the game —
// Easy has no concept of this and just takes the best immediate trade available.
function brigadeBreakBonus(target){
  const remaining = state.units.filter(o=>!o.removed && o.side===target.side && o.brigadeId===target.brigadeId && o.type!=='BRIGADIER').length;
  if(remaining<=1) return 6;   // this IS the Brigade's last unit — taking it breaks the Brigade outright
  if(remaining===2) return 2.5; // one hit from breaking
  return 0;
}

// Hard only: a cheap, deterministic stand-in for real lookahead. Rather than a
// single random roll, use the EXPECTED margin from the dice-count edge to predict
// the likely outcome bucket, apply it to a temporary clone of the two units, score
// the resulting position with evaluateState, then revert. Not true minimax — the
// branching factor here doesn't justify that — but a genuine step past the
// immediate trade instead of a static heuristic.
function simulateFightAftermathScore(attacker, defender, side){
  const aD = bonusDiceCount(attacker, defender, false).count;
  const dD = bonusDiceCount(defender, attacker, true).count;
  const EV_BY_DICE = {1:3.5, 2:4.47};
  const margin = (EV_BY_DICE[Math.min(aD,2)]||3.5) - (EV_BY_DICE[Math.min(dD,2)]||3.5);

  const snap = { aRemoved:attacker.removed, aX:attacker.x, aY:attacker.y, aTurnOnly:attacker.turnOnly,
                 dRemoved:defender.removed, dX:defender.x, dY:defender.y, dTurnOnly:defender.turnOnly };

  if(margin >= 3){ defender.removed = true; }
  else if(margin >= 1){ defender.turnOnly = true; }
  else if(margin <= -3){ attacker.removed = true; }
  else if(margin <= -1){ attacker.turnOnly = true; }
  // roughly even (|margin|<1): treat as a draw, no change — matches the real rule's tie-continues behaviour

  const score = evaluateState(side) + brigadeBreakBonus(defender)*0.5;

  attacker.removed=snap.aRemoved; attacker.x=snap.aX; attacker.y=snap.aY; attacker.turnOnly=snap.aTurnOnly;
  defender.removed=snap.dRemoved; defender.x=snap.dX; defender.y=snap.dY; defender.turnOnly=snap.dTurnOnly;

  return score;
}

// Single entry point the AI's Fight-phase loop calls — branches on difficulty,
// Easy's exact original behaviour untouched.
// Operations: fight decisions need to serve whatever the active objective
// actually is — chasing Brigade-breaks in an escape or survival scenario is
// actively counterproductive, not just unsophisticated.
function scenarioFightBonus(target, side){
  if(!state.scenario) return 0;
  let bonus = 0;
  for(const cond of state.scenario.objective.conditions){
    if(cond.type==='ELIMINATE_TARGET' && cond.params.targetSide===target.side) bonus += 1.0;
    if(cond.type==='SURVIVE_TURNS' && cond.params.defender===side) bonus -= 0.6;
    if(cond.type==='ESCAPE_ZONE' && cond.params.escapingSide===side) bonus -= 0.8;
  }
  return bonus;
}

function aiEstimateFightValue(a, t, side){
  const scenarioAdj = scenarioFightBonus(t, side);
  if(state.aiDifficulty==='hard') return simulateFightAftermathScore(a, t, side) + estimateFightValue(a,t)*0.15 + scenarioAdj;
  if(state.aiDifficulty==='medium') return estimateFightValue(a,t) + (state.scenario ? scenarioAdj : brigadeBreakBonus(t));
  return estimateFightValue(a,t) + scenarioAdj*0.5; // even Easy needs baseline awareness a non-standard objective exists, not full doctrine
}

function aiDoFightPhase(){
  function step(){
    if(state.gameOver) return;
    const attackers = state.units.filter(u=>u.side===state.aiSide && canInitiateFight(u) && !state.fought.has(u.id) &&
      state.units.some(o=>!o.removed && o.side!==state.aiSide && isAdjacent(u,o) && canAttackTarget(u,o)));
    if(attackers.length===0){ endFightPhase(); return; }
    let bestA=null, bestT=null, bestScore=-Infinity;
    for(const a of attackers){
      const targets = state.units.filter(o=>!o.removed && o.side!==state.aiSide && isAdjacent(a,o) && canAttackTarget(a,o));
      for(const t of targets){
        const s = aiEstimateFightValue(a, t, state.aiSide);
        if(s>bestScore){ bestScore=s; bestA=a; bestT=t; }
      }
    }
    if(bestA){
      resolveFight(bestA, bestT, undefined, ()=>{
        state.fought.add(bestA.id);
        draw();
        setTimeout(step, 300);
      });
    } else {
      endFightPhase();
    }
  }
  step();
}

/* =========================================================
   MAIN GAME FLOW
========================================================= */
function startBattle(){
  document.getElementById('overlay').classList.remove('show');
  state.turn = Math.random()<0.5 ? SIDES.RED : SIDES.BLUE;
  log(`Roll for initiative: ${SIDE_LABEL[state.turn]} moves first.`, 'system');
  document.getElementById('sidebar').style.display='none';
  document.getElementById('unitOverlay').classList.remove('hidden');
  document.getElementById('unitOverlay').classList.remove('show');
  beginMovePhase();
}

function updateHeader(){
  const badge = document.getElementById('turnBadge');
  const sideName = SIDE_LABEL[state.phase==='deploy' ? state.deployTurn : state.turn].split(' ')[0];
  if(state.phase==='deploy'){
    badge.textContent = `Deploying: ${sideName}`;
    badge.style.borderColor = SIDE_COLOR[state.deployTurn];
  } else {
    badge.textContent = sideName;
    badge.style.borderColor = SIDE_COLOR[state.turn];
  }
  renderBrigadeStatus();
}
function phaseLabel(p){
  return {deploy:'Deployment', move:'Movement', fire:'Artillery Fire', fight:'Fighting', rally:'Rally / Turnaround'}[p] || p;
}

function brigadeBrokenStatus(side){
  // Returns an array of 3 booleans (broken/not) — a Brigade with no units yet (pre-deployment) counts as not broken.
  const out = [];
  for(let bId=0; bId<3; bId++){
    const group = state.units.filter(u=>u.side===side && u.brigadeId===bId);
    if(group.length===0){ out.push(false); continue; }
    out.push(group.filter(u=>!u.removed && u.type!=='BRIGADIER').length===0);
  }
  return out;
}

function renderBrigadeStatus(){
  const el = document.getElementById('brigadeStatus');
  if(!el) return;
  const renderSide = (side)=>{
    const statuses = brigadeBrokenStatus(side);
    const pips = statuses.map(broken=>`<span class="pip ${broken?'broken':'alive'}"></span>`).join('');
    const brokenCount = statuses.filter(Boolean).length;
    return `<span class="side-status" style="color:${SIDE_COLOR[side]}">${SIDE_LABEL[side]}: ${pips} <span style="color:var(--ink-dim);margin-left:2px;">(${brokenCount}/3 broken)</span></span>`;
  };
  el.innerHTML = renderSide(SIDES.RED) + renderSide(SIDES.BLUE);
}

function beginMovePhase(){
  if(state.gameOver) return;
  state.phase = 'move';
  state.moved = new Set();
  state.turnComboTarget = null;
  enforceAmbushWoodsInvariant();
  resetUndoStack();
  clearPendingTurnaroundFlagsIfDue();
  document.getElementById('endMoveBtn').style.display='inline-block';
  document.getElementById('endFireBtn').style.display='none';
  document.getElementById('endFightBtn').style.display='none';
  selectUnit(null);
  updateHeader();
  draw();
  const aiTurn = state.mode==='ai' && state.turn===state.aiSide;
  document.getElementById('endMoveBtn').disabled = aiTurn;
  if(aiTurn) setTimeout(aiDoMovePhase, 500);
}

function clearPendingTurnaroundFlagsIfDue(){
  // units flagged turnOnly get exactly one phase of "turn around only", then are free again
  for(const u of state.units){
    if(u.side!==state.turn) continue;
    if(u._turnOnlyConsumed){
      u.turnOnly = false;
      u._turnOnlyConsumed = false;
    } else if(u.turnOnly){
      u._turnOnlyConsumed = true;
    }
    // ambush cooldown and stand-down both last only until this side's next turn
    u.ambushSpentThisRound = false;
    u.noActionThisTurn = false;
    u.smokeActive = false;
    u.charged = false; // a declared charge only counts for the turn it was made
  }
  state.ploughEscortUsed = {};
}

function beginFirePhase(){
  state.phase = 'fire';
  state.fired = new Set();
  state.turnGunTargets = new Set();
  resetUndoStack();
  document.getElementById('endMoveBtn').style.display='none';
  document.getElementById('endFireBtn').style.display='inline-block';
  selectUnit(null);
  updateHeader();
  draw();
  const aiTurn = state.mode==='ai' && state.turn===state.aiSide;
  document.getElementById('endFireBtn').disabled = aiTurn;
  if(aiTurn) setTimeout(aiDoFirePhase, 400);
}

function beginFightPhase(){
  state.phase = 'fight';
  state.fought = new Set();
  resetUndoStack();
  document.getElementById('endFireBtn').style.display='none';
  document.getElementById('endFightBtn').style.display='inline-block';
  selectUnit(null);
  updateHeader();
  draw();
  const aiTurn = state.mode==='ai' && state.turn===state.aiSide;
  document.getElementById('endFightBtn').disabled = aiTurn;
  if(aiTurn){
    if(!anyFightsAvailable(state.turn)){ setTimeout(endFightPhase, 400); return; }
    setTimeout(aiDoFightPhase, 500);
    return;
  }
  // auto-skip if no fights available (human turn)
  if(!anyFightsAvailable(state.turn)){
    log('No units in contact — skipping Fight phase.', 'system');
    setTimeout(endFightPhase, 400);
  }
}
// Woodland Ambush: an Infantry-class unit in woods, untouched by the enemy,
// that hasn't already acted this Move phase, may lie in wait instead of
// moving. It's invisible to artillery and to the AI's own tactical reads
// (see threatPenalty/nearestEnemyDist) until it springs.
function canLayAmbush(u){
  const t = UNIT_TYPES[u.type];
  if(!(t.key==='INFANTRY'||t.key==='GUARD')) return false;
  if(u.hidden) return false;
  if(state.phase!=='move' || u.side!==state.turn || (state.moved && state.moved.has(u.id)) || u.turnOnly) return false;
  if(terrainAt(u.x,u.y).key!=='WOODS') return false;
  if(unitsAt(u.x,u.y).length>1) return false; // Square-style formations need the square to itself, same for an ambush position
  const adjacentEnemy = state.units.some(o=>!o.removed && o.side!==u.side && isAdjacent(u,o));
  return !adjacentEnemy;
}

function canInitiateFight(u){
  return !u.removed && UNIT_TYPES[u.type].canFight && !u.turnOnly && !u.noActionThisTurn && !(state.fought && state.fought.has(u.id));
}
// Cavalry cannot attack a unit sheltering inside a building under any circumstance.
// A Brigadier is never a valid target at all — he's not a combat unit, only a
// chain-of-command marker. He's immune to being attacked and simply withdraws
// from the board once every other unit in his Brigade is gone (see removeUnit).
function canAttackTarget(attacker, defender){
  if(defender.type==='BRIGADIER') return false;
  if(UNIT_TYPES[attacker.type].isCavalry && terrainAt(defender.x,defender.y).key==='BUILDING') return false;
  return true;
}
function anyFightsAvailable(side){
  return state.units.some(u=>u.side===side && canInitiateFight(u) &&
    state.units.some(o=>!o.removed && o.side!==side && isAdjacent(u,o) && canAttackTarget(u,o)));
}

function endMovePhase(){
  const springs = collectAmbushSprings();
  processAmbushSpringsSequentially(springs, 0, beginFirePhase);
}

// Detects (but does not resolve) any hidden unit now adjacent to an enemy
// that just moved. Resolution is handled separately since a human-owned
// ambush needs to pause for the Hold/Advance choice before any dice are rolled.
function collectAmbushSprings(){
  const movingSide = state.turn;
  const ambushSide = movingSide===SIDES.RED ? SIDES.BLUE : SIDES.RED;
  const ambushers = state.units.filter(u=>!u.removed && u.side===ambushSide && u.hidden);
  const springs = [];
  for(const amb of ambushers){
    const targets = state.units.filter(o=>!o.removed && o.side===movingSide && isAdjacent(amb,o));
    if(targets.length===0) continue;
    let best=null, bestScore=-Infinity;
    for(const t of targets){
      const s = estimateFightValue(amb, t);
      if(s>bestScore){ bestScore=s; best=t; }
    }
    springs.push({ambusherId:amb.id, targetId:best.id});
  }
  return springs;
}

function processAmbushSpringsSequentially(springs, idx, onDone){
  if(idx >= springs.length){ onDone(); return; }
  const amb = state.units.find(u=>u.id===springs[idx].ambusherId);
  const target = state.units.find(u=>u.id===springs[idx].targetId);
  if(!amb || amb.removed || !amb.hidden || !target || target.removed){
    processAmbushSpringsSequentially(springs, idx+1, onDone); return; // already resolved (e.g. shared target)
  }
  const isHumanOwner = !(state.mode==='ai' && amb.side===state.aiSide);
  if(isHumanOwner){
    showAmbushChoice(amb, target, (mode)=>{
      springAmbush(amb, target, mode, ()=> processAmbushSpringsSequentially(springs, idx+1, onDone));
    });
  } else {
    springAmbush(amb, target, 'hold', ()=> processAmbushSpringsSequentially(springs, idx+1, onDone)); // AI doesn't lay ambush itself, but resolve gracefully if it ever inherits one
  }
}

function showAmbushChoice(ambusher, target, callback){
  document.getElementById('overlayTitle').textContent = `AMBUSH! ${SIDE_LABEL[ambusher.side]}`;
  document.getElementById('overlayText').innerHTML =
    `Your ${unitLabel(ambusher)} springs on ${unitLabel(target)}. +1 to the roll either way. `+
    `<b>Hold</b> stays in the wood with a single die. <b>Advance</b> gets a genuine second die for this attack, and moves your unit into the open ground if it wins. Either way, the ambush ends and the wood's defence bonus won't apply again until your next turn.`;
  document.getElementById('overlayBtn').style.display = 'none';
  const canvas = document.getElementById('rotationPreviewCanvas');
  if(canvas) canvas.style.display = 'none';
  let extra = document.getElementById('modeChoices');
  extra.innerHTML = '';
  extra.style.display = 'flex';
  extra.style.flexWrap = 'wrap';
  const holdBtn = document.createElement('button');
  holdBtn.textContent = 'Hold Position';
  holdBtn.onclick = ()=>{ extra.style.display='none'; document.getElementById('overlay').classList.remove('show'); callback('hold'); };
  const advBtn = document.createElement('button');
  advBtn.className = 'primary';
  advBtn.textContent = 'Commit to Advance';
  advBtn.onclick = ()=>{ extra.style.display='none'; document.getElementById('overlay').classList.remove('show'); callback('advance'); };
  extra.appendChild(holdBtn);
  extra.appendChild(advBtn);
  document.getElementById('overlay').classList.add('show');
}

function springAmbush(ambusher, target, mode, onComplete){
  onComplete = onComplete || function(){};
  ambusher.hidden = false;
  ambusher.ambushSpentThisRound = true;
  log(`AMBUSH! ${unitLabel(ambusher)} springs from the woods on ${unitLabel(target)} (${mode}).`, 'combat');
  const beforeX = target.x, beforeY = target.y;
  resolveFight(ambusher, target, mode, ()=>{
    if(mode==='advance'){
      const stillThere = state.units.some(o=>!o.removed && o.id===target.id && o.x===beforeX && o.y===beforeY);
      if(!stillThere && unitsAt(beforeX,beforeY).length===0 && isAdjacent(ambusher,{x:beforeX,y:beforeY})){
        animateUnitTo(ambusher, beforeX, beforeY);
        log(`${unitLabel(ambusher)} advances into the vacated ground.`, 'combat');
      }
    }
    onComplete();
  });
}
function endFirePhase(){ beginFightPhase(); }
function endFightPhase(){
  if(state.gameOver) return;
  if(anyFightsAvailable(state.turn)){
    log('Units in contact must fight before the phase can end.', 'system');
    return;
  }
  state.phase = 'rally';
  updateHeader();
  log(`${SIDE_LABEL[state.turn]} turn complete.`, 'system');
  setTimeout(()=>{
    state.turn = state.turn===SIDES.RED ? SIDES.BLUE : SIDES.RED;
    state.turnNumber++;
    if(state.scenario && !state.gameOver) checkScenarioTurnLimit();
    if(!state.gameOver) beginMovePhase();
  }, 300);
}

function selectUnit(id){
  state.selectedUnitId = id;
  highlightCells = [];
  const u = id ? state.units.find(x=>x.id===id) : null;
  renderUnitInfo(u);
  if(u && u.side===state.turn){
    if(state.phase==='move'){
      const moves = legalMoves(u);
      highlightCells = moves.map(m=>({x:m.x,y:m.y,kind:'move'}));
    } else if(state.phase==='fire' && UNIT_TYPES[u.type].isArtillery){
      const targets = artilleryTargets(u);
      highlightCells = targets.map(t=>({x:t.x,y:t.y,kind:'target'}));
    } else if(state.phase==='fight'){
      const targets = state.units.filter(o=>!o.removed && o.side!==u.side && isAdjacent(u,o) && canAttackTarget(u,o));
      highlightCells = targets.map(t=>({x:t.x,y:t.y,kind:'target'}));
    }
  }
  draw();
}

function unitLabel(u){ return (u && u.historicalName) || UNIT_TYPES[u.type].label; }
function toggleUnitBio(){
  const bioText = document.getElementById('bioText');
  const btn = document.getElementById('bioToggleBtn');
  if(!bioText || !btn) return;
  const showing = bioText.style.display !== 'none';
  bioText.style.display = showing ? 'none' : 'block';
  btn.textContent = showing ? 'History ▾' : 'History ▴';
}
function renderUnitInfo(u){
  const el = document.getElementById('unitInfo');
  const sqBtn = document.getElementById('squareBtn');
  const ambBtn = document.getElementById('ambushBtn');
  const overlay = document.getElementById('unitOverlay');
  if(!u){ el.innerHTML='<span class="empty">No unit selected</span>'; sqBtn.disabled=true; ambBtn.style.display='none'; if(overlay) overlay.classList.remove('show'); return; }
  if(overlay && state.phase!=='deploy') overlay.classList.add('show');
  const panelEl = document.getElementById('unitOverlayPanel');
  if(panelEl){
    const inLeftHalf = u.x < COLS/2;
    panelEl.classList.toggle('anchor-right', inLeftHalf);  // unit on the left -> panel on the right
    panelEl.classList.toggle('anchor-left', !inLeftHalf);  // unit on the right -> panel on the left
  }
  const t = UNIT_TYPES[u.type];
  const terr = terrainAt(u.x,u.y);
  const heading = u.historicalName || t.label;
  const subheading = u.historicalName ? t.label : null;
  el.innerHTML = `
    <div class="u-name" style="color:${SIDE_COLOR[u.side]}">${heading}</div>
    <div style="color:var(--ink-dim);font-size:11px;">${SIDE_LABEL[u.side]}${subheading?(' &middot; '+subheading):''} &middot; (${u.x},${u.y}) &middot; ${terr.key}</div>
    <div class="u-tags">
      <span class="tag st-active">Move ${t.move}</span>
      ${t.reroll?'<span class="tag">Re-roll ★</span>':''}
      ${u.formation==='square'?'<span class="tag st-square">SQUARE</span>':''}
      ${u.turnOnly?'<span class="tag st-pushed">Turning Around</span>':''}
      ${u.rallying?'<span class="tag">Rallying</span>':''}
      ${u.hidden?'<span class="tag st-square">IN AMBUSH</span>':(isConcealedFromEnemy(u)?'<span class="tag">IN COVER (Woods)</span>':'')}
      ${u.charged?'<span class="tag st-active">CHARGED</span>':''}
    </div>
    ${u.historicalBio ? `<div class="bio-toggle" id="bioToggleBtn" onclick="toggleUnitBio()">History ▾</div><div class="bio-text" id="bioText" style="display:none;">${u.historicalBio}</div>` : ''}
  `;
  const portraitEl = document.getElementById('unitPortrait');
  if(portraitEl){
    portraitEl.style.background = `linear-gradient(160deg, ${SIDE_COLOR[u.side]}22, var(--paper-2))`;
    if(t.key==='BRIGADIER' && BRIGADIER_PORTRAIT_KEY[u.historicalName]){
      portraitEl.innerHTML = `<img src="${UNIT_IMAGE_DATA[BRIGADIER_PORTRAIT_KEY[u.historicalName]]}" style="width:78%;height:78%;object-fit:cover;border-radius:6px;border:3px solid #c9a227;">`;
    } else if(t.isArtillery){
      portraitEl.innerHTML = `<img src="${UNIT_IMAGE_DATA[u.side===SIDES.RED?'cannon_red':'cannon_blue']}" style="width:80%;height:auto;">`;
    } else {
      const glyph = (t.key==='HEAVY_CAV'||t.key==='LIGHT_CAV') ? '\u25B2\u25B2\u25B2' : (t.key==='BRIGADIER' ? '\u2605' : '\u25CF\u25CF\u25CF\u25CF\u25CF');
      portraitEl.innerHTML = `<span style="font-size:26px;letter-spacing:2px;color:${SIDE_COLOR[u.side]};">${glyph}</span>`;
    }
  }
  sqBtn.textContent = u.formation==='square' ? 'Leave Square' : 'Form Square';
  const baseOk = t.canFormSquare && state.phase==='move' && u.side===state.turn && !state.moved.has(u.id) && !u.turnOnly;
  if(u.formation==='square'){
    sqBtn.disabled = !baseOk;
  } else {
    sqBtn.disabled = !(baseOk && terrainAt(u.x,u.y).key!=='WOODS' && terrainAt(u.x,u.y).key!=='BUILDING' && unitsAt(u.x,u.y).length<=1);
  }

  if(u.hidden){
    ambBtn.style.display = 'inline-block';
    ambBtn.textContent = 'Stand Down';
    ambBtn.disabled = !(state.phase==='move' && u.side===state.turn && !state.moved.has(u.id));
  } else if(canLayAmbush(u)){
    ambBtn.style.display = 'inline-block';
    ambBtn.textContent = 'Lay Ambush';
    ambBtn.disabled = false;
  } else {
    ambBtn.style.display = 'none';
  }

  const chargeBtn = document.getElementById('chargeBtn');
  const chargeOk = t.isCavalry && state.phase==='move' && u.side===state.turn && !state.moved.has(u.id) && !u.turnOnly;
  if(chargeOk && computeChargeDestinations(u).length>0){
    chargeBtn.style.display = 'inline-block';
    chargeBtn.disabled = false;
  } else {
    chargeBtn.style.display = 'none';
  }
}

canvas.addEventListener('click', (e)=>{
  const rect = canvas.getBoundingClientRect();
  const cellPxX = rect.width / COLS, cellPxY = rect.height / ROWS;
  const x = Math.floor((e.clientX-rect.left)/cellPxX);
  const screenY = Math.floor((e.clientY-rect.top)/cellPxY);
  const y = sy(screenY);
  if(!inBounds(x,y)) return;
  onCellClick(x,y);
});

function onCellClick(x,y){
  if(state.gameOver) return;
  if(state.phase==='deploy'){ handleDeployClick(x,y); return; }
  if(state.mode==='ai' && state.turn===state.aiSide) return; // AI's turn, ignore human clicks

  const clicked = pickUnitAtCell(x,y);
  const sel = state.selectedUnitId ? state.units.find(u=>u.id===state.selectedUnitId) : null;

  if(state.phase==='move'){
    if(sel && sel.side===state.turn && highlightCells.some(c=>c.x===x&&c.y===y&&c.kind==='charge')){
      pushUndoSnapshot();
      const fromX=sel.x, fromY=sel.y;
      displaceBrigadierIfPresent(x, y, fromX, fromY);
      animateUnitTo(sel, x, y);
      sel.charged = true;
      state.moved.add(sel.id);
      log(`${unitLabel(sel)} charges to engage!`, sel.side);
      selectUnit(sel.id);
      return;
    }
    if(sel && sel.side===state.turn && highlightCells.some(c=>c.x===x&&c.y===y&&c.kind==='move')){
      pushUndoSnapshot();
      const fromX=sel.x, fromY=sel.y;
      displaceBrigadierIfPresent(x, y, fromX, fromY);
      if(UNIT_TYPES[sel.type].isArtillery && !isHorseArtillery(sel) && terrainAt(x,y).plough) consumePloughEscort(sel);
      animateUnitTo(sel, x, y);
      state.moved.add(sel.id);
      log(`${unitLabel(sel)} moves to (${x},${y}).`, sel.side);
      selectUnit(sel.id);
      return;
    }
    if(clicked && clicked.side===state.turn){ selectUnit(clicked.id); return; }
    selectUnit(clicked ? clicked.id : null);
  } else if(state.phase==='fire'){
    if(sel && UNIT_TYPES[sel.type].isArtillery && highlightCells.some(c=>c.x===x&&c.y===y&&c.kind==='target')){
      const target = pickUnitAtCell(x,y);
      pushUndoSnapshot();
      selectUnit(null);
      fireArtillery(sel, target);
      return;
    }
    if(clicked && clicked.side===state.turn && UNIT_TYPES[clicked.type].isArtillery){ selectUnit(clicked.id); return; }
    selectUnit(clicked ? clicked.id : null);
  } else if(state.phase==='fight'){
    if(sel && sel.side===state.turn && highlightCells.some(c=>c.x===x&&c.y===y&&c.kind==='target')){
      const target = pickUnitAtCell(x,y);
      pushUndoSnapshot();
      selectUnit(null);
      resolveFight(sel, target, undefined, ()=>{
        state.fought.add(sel.id);
        if(!anyFightsAvailable(state.turn)) setTimeout(endFightPhase, 500);
      });
      return;
    }
    if(clicked && clicked.side===state.turn && canInitiateFight(clicked)){ selectUnit(clicked.id); return; }
    selectUnit(clicked ? clicked.id : null);
  }
}

function fireArtillery(gun, target, onComplete){
  onComplete = onComplete || function(){};
  const dist = chebyshev(gun,target);
  if(dist<=1){
    resolveFight(gun, target, undefined, ()=>{ state.fired.add(gun.id); selectUnit(null); onComplete(); });
    return;
  }
  gun.smokeActive = true;
  ensureAnimationLoopRunning();
  showActionLine(gun, target, '#a33330', 3800, true);
  const needed = dist; // to-hit number: a target at range N needs a roll of N or higher (rulebook table)
  let bonus = 0;
  if(target.formation==='square') bonus = 1;
  const occSame = unitsAt(target.x,target.y).length;
  if(occSame>1) bonus = Math.max(bonus,1);
  const hitNotes = bonus>0 ? [target.formation==='square' ? '+1 to hit: Square formation' : '+1 to hit: doubled Infantry'] : [];

  presentRollTrigger([{label:'To Hit', diceCount:1, notes:hitNotes}], gun.side, ()=>{
    const roll = rollD6();
    const adjRoll = roll+bonus;
    const hit = adjRoll >= needed;
    showDice([{label:'To Hit', rolls:[roll], keptValue:roll, notes:hitNotes}], hit ? 'Hit!' : 'Miss', hit ? 'win' : 'lose', ()=>{
      log(`Artillery fires at ${unitLabel(target)} (range ${dist}, needs ${needed}+): rolled ${roll}${bonus?('+'+bonus):''}.`, 'combat');
      if(!hit){
        logNarration('artillery_miss');
        log('Shot falls wide.', 'combat');
        state.fired.add(gun.id);
        selectUnit(null);
        onComplete();
        return;
      }
      addCrater(target.x, target.y);
      const inCover = terrainAt(target.x,target.y).key==='WOODS' || terrainAt(target.x,target.y).key==='BUILDING';
      const effNotes = inCover ? ['-1 effect: target in wood/building'] : [];

      presentRollTrigger([{label:'Effect', diceCount:1, notes:effNotes}], gun.side, ()=>{
        let effRoll = rollD6();
        if(inCover) effRoll = Math.max(1, effRoll-1);
        const effLabel = effRoll<=3 ? 'No effect' : effRoll===4 ? 'Shaken' : effRoll===5 ? 'Falls back' : 'Removed';
        const effCls = effRoll<=3 ? '' : effRoll<=4 ? 'draw' : 'lose';
        showDice([{label:'Effect', rolls:[effRoll], keptValue:effRoll, notes:effNotes}], effLabel, effCls, ()=>{
          // Stacked units (doubled infantry in open terrain) suffer the same effect roll together —
          // each may need its own async Rally/Leadership sequence, so process them one at a time.
          const stack = unitsAt(target.x, target.y);
          if(stack.length>1) log(`${stack.length} units in that square share the effect.`, 'combat');
          applyArtilleryEffectToStack(stack, effRoll, 0, ()=>{
            state.fired.add(gun.id);
            selectUnit(null);
            onComplete();
          });
        });
      });
    });
  });
}

function applyArtilleryEffectToStack(stack, roll, idx, onAllDone){
  if(idx >= stack.length){ onAllDone(); return; }
  const u = stack[idx];
  if(u.removed){ applyArtilleryEffectToStack(stack, roll, idx+1, onAllDone); return; }
  applyArtilleryEffect(u, roll, ()=> applyArtilleryEffectToStack(stack, roll, idx+1, onAllDone));
}

function applyArtilleryEffect(u, roll, onComplete){
  onComplete = onComplete || function(){};
  const t = UNIT_TYPES[u.type];
  if(roll<=3){
    log(`${unitLabel(u)} carries on regardless.`, 'combat'); logNarration('artillery_no_effect');
    onComplete();
  } else if(roll===4){
    u.turnOnly=true;
    log(`${unitLabel(u)} is shaken — cannot move next turn, turns to face.`, 'combat'); logNarration('artillery_disrupt');
    onComplete();
  } else if(roll===5){
    logNarration('artillery_rout');
    retreatAndRally(u, onComplete);
  } else {
    logNarration('artillery_destroy');
    removeUnit(u,'destroyed by artillery');
    onComplete();
  }
}

document.getElementById('squareBtn').onclick = ()=>{
  const u = state.units.find(x=>x.id===state.selectedUnitId);
  if(!u) return;
  pushUndoSnapshot();
  if(u.formation==='square'){
    u.formation = 'line';
    state.moved.add(u.id);
    log(`${unitLabel(u)} reforms Line.`, u.side);
  } else {
    u.formation = 'square';
    state.moved.add(u.id);
    log(`${unitLabel(u)} forms Square.`, u.side);
  }
  selectUnit(u.id);
  draw();
};

document.getElementById('ambushBtn').onclick = ()=>{
  const u = state.units.find(x=>x.id===state.selectedUnitId);
  if(!u) return;
  pushUndoSnapshot();
  if(u.hidden){
    u.hidden = false;
    state.moved.add(u.id);
    u.noActionThisTurn = true;
    log(`${unitLabel(u)} stands down from ambush — no move or fight for the rest of this turn.`, u.side);
  } else if(canLayAmbush(u)){
    u.hidden = true;
    state.moved.add(u.id);
    log(`${unitLabel(u)} lies in ambush in the woods.`, u.side);
  }
  selectUnit(u.id);
  draw();
};

document.getElementById('chargeBtn').onclick = ()=>{

  const dests = computeChargeDestinations(u);

  draw();
};

/* =========================================================
   BOARD SETUP: random board assignment + dice-roll orientation
   Each side is given one of the two boards at random. Each side then
   rolls 1d6 for that board's table orientation: 1-3 forces a rotation
   of that many 90° clockwise turns; 4-6 lets that side's player choose
   the rotation. A human-controlled side gets an on-screen choice; the
   AI picks for itself when it's the AI's board.
========================================================= */
function beginBoardSetup(){
  const keys = Math.random()<0.5 ? ['A','B'] : ['B','A'];
  state.boardAssignment = { red: keys[0], blue: keys[1] };
  state.boardRotation = { red: 0, blue: 0 };
  processBoardRoll([SIDES.RED, SIDES.BLUE], 0);
}

function processBoardRoll(sides, i){
  if(i >= sides.length){
    document.getElementById('overlay').classList.remove('show');
    state.terrain = buildTerrainMap(state.boardAssignment, state.boardRotation);
    state.excludedRoadEdges = buildExcludedRoadEdgeSet(state.boardAssignment, state.boardRotation);
    initDeployment();
    return;
  }
  const side = sides[i];
  const roll = rollD6();
  log(`${SIDE_LABEL[side]} rolls a ${roll} for Board ${state.boardAssignment[side]}'s table orientation.`, 'system');
  if(roll <= 3){
    state.boardRotation[side] = roll;
    log(`${SIDE_LABEL[side]}'s board is rotated ${roll*90}\u00b0 clockwise.`, 'system');
    processBoardRoll(sides, i+1);
  } else {
    const isHumanControlled = !(state.mode==='ai' && side===state.aiSide);
    if(isHumanControlled){
      showRotationChoice(side, (chosen)=>{
        state.boardRotation[side] = chosen;
        log(`${SIDE_LABEL[side]} chooses a ${chosen*90}\u00b0 rotation for their board.`, 'system');
        processBoardRoll(sides, i+1);
      });
    } else {
      const chosen = Math.floor(Math.random()*4);
      state.boardRotation[side] = chosen;
      log(`${SIDE_LABEL[side]} (AI) chooses a ${chosen*90}\u00b0 rotation for their board.`, 'system');
      processBoardRoll(sides, i+1);
    }
  }
}

function renderMiniTerrainPreview(canvas, grid){
  const ctx2 = canvas.getContext('2d');
  const n = grid.length;
  const cell = canvas.width / n;
  ctx2.clearRect(0,0,canvas.width,canvas.height);
  for(let y=0;y<n;y++){
    for(let x=0;x<n;x++){
      const key = grid[y][x];
      ctx2.fillStyle = terrainColor(key==='ROAD' ? 'OPEN' : key);
      ctx2.fillRect(x*cell,y*cell,cell,cell);
    }
  }
  // roads as thin connected lines, same treatment as the main board
  ctx2.strokeStyle = terrainColor('ROAD');
  ctx2.lineWidth = Math.max(2, cell*0.16);
  ctx2.lineCap = 'round';
  for(let y=0;y<n;y++){
    for(let x=0;x<n;x++){
      if(grid[y][x]!=='ROAD') continue;
      const cx = x*cell+cell/2, cy = y*cell+cell/2;
      [[0,-1],[0,1],[-1,0],[1,0]].forEach(([dx,dy])=>{
        const nx=x+dx, ny=y+dy;
        if(nx>=0 && nx<n && ny>=0 && ny<n && grid[ny][nx]==='ROAD'){
          ctx2.beginPath(); ctx2.moveTo(cx,cy); ctx2.lineTo(x*cell+cell/2+dx*cell/2, y*cell+cell/2+dy*cell/2); ctx2.stroke();
        }
      });
    }
  }
  ctx2.lineCap = 'butt';
  const ICONS2 = { FIELD:'\u{1F33E}', WOODS:'\u{1F332}', HILL:'\u{26F0}', BUILDING:'\u{1F3E0}' };
  ctx2.textAlign = 'center'; ctx2.textBaseline = 'middle';
  ctx2.font = Math.floor(cell*0.55)+'px sans-serif';
  for(let y=0;y<n;y++){
    for(let x=0;x<n;x++){
      const icon = ICONS2[grid[y][x]];
      if(icon) ctx2.fillText(icon, x*cell+cell/2, y*cell+cell/2);
    }
  }
  ctx2.strokeStyle = 'rgba(0,0,0,0.15)'; ctx2.lineWidth = 1;
  for(let i=0;i<=n;i++){
    ctx2.beginPath(); ctx2.moveTo(i*cell,0); ctx2.lineTo(i*cell,canvas.height); ctx2.stroke();
    ctx2.beginPath(); ctx2.moveTo(0,i*cell); ctx2.lineTo(canvas.width,i*cell); ctx2.stroke();
  }
}

function showRotationChoice(side, callback){
  const boardKey = state.boardAssignment[side];
  let previewRotation = 0;
  const canvas = document.getElementById('rotationPreviewCanvas');

  function render(){
    canvas.style.display = 'block';
    renderMiniTerrainPreview(canvas, boardTerrainFor(boardKey, previewRotation));
    document.getElementById('overlayText').innerHTML =
      `You rolled a 4, 5 or 6 — you may choose which way Board ${boardKey} faces. Currently: <b>${previewRotation*90}\u00b0</b>`;
  }

  document.getElementById('overlayTitle').textContent = `${SIDE_LABEL[side]}: Choose Board Orientation`;
  document.getElementById('overlayBtn').style.display = 'none';
  let extra = document.getElementById('modeChoices');
  extra.innerHTML = '';
  extra.style.display = 'flex';
  extra.style.flexWrap = 'wrap';

  const rotateBtn = document.createElement('button');
  rotateBtn.textContent = 'Rotate \u21bb';
  rotateBtn.onclick = ()=>{ previewRotation = (previewRotation+1)%4; render(); };
  const confirmBtn = document.createElement('button');
  confirmBtn.className = 'primary';
  confirmBtn.textContent = 'Confirm This Orientation';
  confirmBtn.onclick = ()=>{
    extra.style.display='none';
    canvas.style.display='none';
    document.getElementById('overlay').classList.remove('show');
    callback(previewRotation);
  };
  extra.appendChild(rotateBtn);
  extra.appendChild(confirmBtn);

  render();
  document.getElementById('overlay').classList.add('show');
}

/* =========================================================
   CAMPAIGN MODE — chains Battles and Operations per the Hub's actual
   branching structure. Since "New Battle" already does a full page
   reload (the safest way to guarantee clean state), campaign progress
   is persisted to localStorage and picked back up on the next load,
   rather than trying to hand-reset every field in memory.
========================================================= */
const CAMPAIGN_STORAGE_KEY = 'tbCampaignProgress';
function saveCampaignProgress(){
  if(!state.campaign){ localStorage.removeItem(CAMPAIGN_STORAGE_KEY); return; }
  try {
    localStorage.setItem(CAMPAIGN_STORAGE_KEY, JSON.stringify({
      campaignId: state.campaign.id,
      flowIndex: state.campaignFlowIndex,
      lastWinner: state.campaignLastWinner,
      record: state.campaignRecord,
      mode: state.mode, aiSide: state.aiSide, aiDifficulty: state.aiDifficulty
    }));
  } catch(e){ /* storage unavailable — campaign just won't survive a reload, not fatal */ }
}
function loadCampaignProgress(){
  try {
    const raw = localStorage.getItem(CAMPAIGN_STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch(e){ return null; }
}
function clearCampaignProgress(){ try{ localStorage.removeItem(CAMPAIGN_STORAGE_KEY); }catch(e){} }

function showCampaignMenu(){
  document.getElementById('overlayTitle').textContent = 'Campaigns';

  let extra = document.getElementById('modeChoices');

  extra.style.flexDirection = 'column';
  extra.style.gap = '6px';

    b.textContent = `${camp.name} (${camp.years})`;
    b.onclick = ()=>{ showCampaignBrief(camp); };

  }
  const backBtn = document.createElement('button');
  backBtn.textContent = '← Back';
  backBtn.onclick = ()=>{ showModeSelect(); };
  extra.appendChild(backBtn);
  document.getElementById('overlay').classList.add('show');
}

  const aiBtn = document.createElement('button');
  aiBtn.textContent = 'vs AI Opponent';
  aiBtn.onclick = ()=>{
    extra.style.display='none';
    document.getElementById('overlayTitle').textContent = 'Choose Your Side';
    document.getElementById('overlayText').innerHTML = 'This is who you\'ll play as for the whole campaign.';
    let extra2 = document.getElementById('modeChoices');
    extra2.innerHTML=''; extra2.style.display='flex';
    const redBtn = document.createElement('button');
    redBtn.className='primary'; redBtn.textContent='Play Britain (Red)';

    blueBtn.textContent='Play France (Blue)';
    blueBtn.onclick = ()=>{ state.mode='ai'; state.aiSide=SIDES.RED; extra2.style.display='none'; showCampaignDifficultySelect(camp); };

    const b = document.createElement('button');

    b.onclick = ()=>{ state.aiDifficulty = value; extra.style.display='none'; startCampaign(camp); };
    return b;
  };

function startCampaign(camp){
  state.campaign = camp;
  state.campaignFlowIndex = 0;
  state.campaignLastWinner = null;
  state.campaignRecord = [];
  saveCampaignProgress();
  runCampaignStep();
}

function runCampaignStep(){
  const step = state.campaign.flow[state.campaignFlowIndex];
  if(!step){ showCampaignComplete(); clearCampaignProgress(); return; }
  document.getElementById('overlay').classList.remove('show');
  if(step.type==='battle'){
    state.scenario = null;
    document.getElementById('overlayTitle').textContent = step.name;
    document.getElementById('overlayText').innerHTML = `<b>${step.date}</b><br><br>${step.intro}`;
    let extra = document.getElementById('modeChoices');
    extra.innerHTML = ''; extra.style.display = 'flex';
    const beginBtn = document.createElement('button');
    beginBtn.className = 'primary';
    beginBtn.textContent = 'Begin Battle';
    beginBtn.onclick = ()=>{ extra.style.display='none'; document.getElementById('overlay').classList.remove('show'); beginBoardSetup(); };
    extra.appendChild(beginBtn);
    document.getElementById('overlay').classList.add('show');
  } else if(step.type==='branch'){
    showCampaignBranchChoice(step);
  }
}

function showCampaignBranchChoice(step){
  const chooser = state.campaignLastWinner || SIDES.RED; // fallback if somehow undecided
  const isHumanChoosing = !(state.mode==='ai' && chooser===state.aiSide);
  if(!isHumanChoosing){
    // AI picks between whichever options are actually available
    const available = step.options.filter(o=>!o.locked);
    const choice = available[Math.floor(Math.random()*available.length)];
    log(`${SIDE_LABEL[chooser]} (AI) chooses the next Operation: ${choice.name}.`, 'system');
    beginChosenOperation(choice);
    return;
  }
  document.getElementById('overlayTitle').textContent = `${SIDE_LABEL[chooser]} Chooses`;
  document.getElementById('overlayText').innerHTML = 'You won the last engagement — pick which Operation comes next.';
  let extra = document.getElementById('modeChoices');
  extra.innerHTML = ''; extra.style.display = 'flex'; extra.style.flexDirection = 'column'; extra.style.gap = '6px';
  for(const opt of step.options){
    const b = document.createElement('button');
    if(opt.locked){
      b.textContent = `${opt.name} (coming soon — needs VIP mission mechanics)`;
      b.disabled = true;
    } else {
      b.textContent = `${opt.name}${opt.missionArchetype ? ' — '+opt.missionArchetype : ''}`;
      b.onclick = ()=>{ extra.style.display='none'; beginChosenOperation(opt); };
    }
    extra.appendChild(b);
  }
  document.getElementById('overlay').classList.add('show');
}

function beginChosenOperation(opt){
  const scenario = SCENARIOS.find(s=>s.id===opt.operationId);
  if(!scenario){ log(`Could not find Operation data for ${opt.name} — skipping.`, 'system'); advanceCampaignStep(); return; }
  state.scenario = scenario;
  document.getElementById('overlay').classList.remove('show');
  beginBoardSetup();
}

function advanceCampaignStep(){
  state.campaignFlowIndex++;
  saveCampaignProgress();
  runCampaignStep();
}

function showCampaignComplete(){
  const wins = state.campaignRecord.filter(r=>r===SIDES.RED).length;
  const lwins = state.campaignRecord.length - wins;
  document.getElementById('overlayTitle').textContent = `${state.campaign.name} Complete`;
  document.getElementById('overlayText').innerHTML =
    `The campaign has run its course. Britain (Red) won ${wins} engagement${wins===1?'':'s'}; France (Blue) won ${lwins}.`;
  const modeChoices = document.getElementById('modeChoices');
  if(modeChoices) modeChoices.style.display = 'none';
  document.getElementById('overlayBtn').style.display = 'inline-block';
  document.getElementById('overlayBtn').textContent = 'Done';
  document.getElementById('overlayBtn').onclick = ()=>{ state.campaign=null; location.reload(); };
  document.getElementById('overlay').classList.add('show');
}

function resumeCampaignFromStorage(progress){
  const camp = CAMPAIGNS.find(c=>c.id===progress.campaignId);
  if(!camp){ clearCampaignProgress(); showModeSelect(); return; }
  state.campaign = camp;
  state.campaignFlowIndex = progress.flowIndex;
  state.campaignLastWinner = progress.lastWinner;
  state.campaignRecord = progress.record || [];
  state.mode = progress.mode;
  state.aiSide = progress.aiSide;
  state.aiDifficulty = progress.aiDifficulty;
  runCampaignStep();
}

const _savedCampaignProgress = loadCampaignProgress();
if(_savedCampaignProgress){
  resumeCampaignFromStorage(_savedCampaignProgress);
} else {
  showModeSelect();
}
sizeCanvas();
