<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>TravelBattle: Field Command</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Cinzel:wght@600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --map-bg:#2a2f22;
    --map-cell:#3c4a34;
    --map-cell-alt:#3f4e37;
    --map-road:#8a7350;
    --map-woods:#26361f;
    --map-building:#6b5847;
    --map-hill:#556b41;
    --map-field:#8a7d3f;

    --bg:#e9dfc4;
    --paper:#e2d6b3;
    --paper-2:#d8c99e;
    --ink:#2e2415;
    --ink-dim:#7a6b4d;
    --brass:#a8823f;
    --brass-dim:#8a6a34;
    --panel:#e9dfc4;
    --panel-2:#dccfa4;
    --line:#c9b989;

    --red:#8c2f2f;
    --red-dim:#6b2422;
    --blue:#2c3e63;
    --blue-dim:#1c2740;
    --ok:#4a7a4a;
    --warn:#a8720b;
    --danger:#a33330;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--map-bg);color:var(--ink);font-family:'Inter',sans-serif;height:100%;overflow:hidden;}
  ::selection{background:var(--brass-dim);color:#fff;}

  #app{display:flex;flex-direction:column;height:100vh;height:100dvh;}

  header{
    display:flex;align-items:center;justify-content:space-between;
    padding:8px 14px;background:var(--panel-2);border-bottom:2px solid var(--brass-dim);
    flex-shrink:0;
  }
  header .title{
    font-family:'Cinzel',serif;font-weight:700;letter-spacing:0.06em;
    font-size:15px;text-transform:uppercase;color:var(--brass-dim);
  }
  header .title span{color:var(--ink-dim);font-weight:500;font-size:10px;display:block;letter-spacing:0.1em;margin-top:1px;font-family:'Inter',sans-serif;text-transform:none;}
  #turnBadge{
    font-family:'IBM Plex Mono',monospace;font-size:11.5px;padding:5px 10px;border-radius:2px;
    border:1px solid var(--brass-dim);letter-spacing:0.03em;background:var(--paper);
  }

  #phaseBar{
    display:flex;gap:0;background:var(--panel-2);border-bottom:1px solid var(--line);flex-shrink:0;
    font-family:'Cormorant Garamond',serif;font-weight:600;font-size:12.5px;letter-spacing:0.05em;text-transform:uppercase;
  }
  #phaseBar .step{flex:1;text-align:center;padding:5px 2px;color:var(--ink-dim);border-right:1px solid var(--line);position:relative;}
  #phaseBar .step:last-child{border-right:none;}
  #phaseBar .step.active{color:#fff;background:var(--brass-dim);}
  #phaseBar .step.done{color:var(--ok);}

  main{flex:1;display:flex;min-height:0;}

  #brigadeStatus{
    display:flex;justify-content:center;gap:22px;padding:4px 10px;background:var(--panel-2);
    border-bottom:1px solid var(--line);font-family:'IBM Plex Mono',monospace;font-size:10.5px;flex-shrink:0;
  }
  #brigadeStatus .side-status{display:flex;align-items:center;gap:6px;}
  #brigadeStatus .pip{width:9px;height:9px;border-radius:2px;border:1px solid rgba(0,0,0,0.35);}
  #brigadeStatus .pip.alive{background:currentColor;}
  #brigadeStatus .pip.broken{background:transparent;opacity:0.4;}

  #boardWrap{flex:1;display:flex;align-items:center;justify-content:center;background:var(--map-bg);overflow:auto;position:relative;padding:8px;}
  canvas{image-rendering:crisp-edges;touch-action:manipulation;border-radius:2px;max-width:100%;height:auto;}

  #sidebar{
    width:250px;flex-shrink:0;background:var(--panel);border-left:2px solid var(--brass-dim);
    display:flex;flex-direction:column;min-height:0;
  }
  #sidebar h3{
    font-family:'Cormorant Garamond',serif;font-weight:700;font-size:13px;letter-spacing:0.06em;text-transform:uppercase;
    color:var(--brass-dim);margin:0;padding:8px 12px 4px;
  }
  #unitInfo{padding:0 12px 10px;font-size:12.5px;line-height:1.45;min-height:90px;border-bottom:1px solid var(--line);}
  #unitInfo .empty{color:var(--ink-dim);font-style:italic;}
  #unitInfo .u-name{font-family:'Cormorant Garamond',serif;font-size:16px;font-weight:700;margin-bottom:2px;}
  #unitInfo .u-tags{display:flex;gap:5px;flex-wrap:wrap;margin:5px 0;}
  #unitInfo .tag{font-family:'IBM Plex Mono',monospace;font-size:9.5px;padding:2px 6px;border-radius:2px;background:var(--paper-2);color:var(--ink-dim);}
  #unitInfo .tag.st-active{color:var(--ok);}
  #unitInfo .tag.st-square{color:var(--warn);}
  #unitInfo .tag.st-pushed{color:var(--danger);}

  #actionRow{display:flex;gap:6px;padding:7px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
  button{
    font-family:'Inter',sans-serif;font-size:12px;font-weight:500;padding:6px 11px;
    background:var(--paper-2);color:var(--ink);border:1px solid var(--line);border-radius:3px;cursor:pointer;
  }
  button:hover:not(:disabled){background:#cbb98a;border-color:var(--brass-dim);}
  button:disabled{opacity:0.4;cursor:default;}
  button.primary{background:var(--brass-dim);border-color:var(--brass);color:#fdf6e3;font-weight:600;}
  button.primary:hover:not(:disabled){background:var(--brass);}
  button.danger{border-color:var(--danger);color:var(--danger);}

  #logWrap{border-bottom:1px solid var(--line);}
  #logToggle{
    display:flex;align-items:center;justify-content:space-between;width:100%;
    background:none;border:none;border-radius:0;padding:6px 12px;cursor:pointer;
    font-family:'Cormorant Garamond',serif;font-weight:700;font-size:13px;letter-spacing:0.06em;text-transform:uppercase;color:var(--brass-dim);
  }
  #logToggle .chev{font-family:'Inter',sans-serif;font-size:11px;transition:transform 0.15s;}
  #logToggle.collapsed .chev{transform:rotate(-90deg);}
  #log{max-height:130px;overflow-y:auto;padding:0 12px 8px;font-family:'IBM Plex Mono',monospace;font-size:10.5px;line-height:1.5;}
  #log.collapsed{display:none;}
  #log .entry{margin-bottom:4px;padding-left:7px;border-left:2px solid var(--line);color:var(--ink-dim);}
  #log .entry.red{border-color:var(--red);}
  #log .entry.blue{border-color:var(--blue);}
  #log .entry.combat{color:var(--warn);}
  #log .entry.system{color:var(--brass-dim);}

  #rosterPanel{display:none;flex-direction:column;flex:1;min-height:0;}
  #rosterList{flex:1;overflow-y:auto;padding:6px 12px;}
  .roster-chip{
    display:flex;align-items:center;gap:8px;padding:6px 8px;margin-bottom:5px;border-radius:3px;
    background:var(--paper-2);border:1px solid var(--line);cursor:pointer;font-size:12px;
  }
  .roster-chip.selected{border-color:var(--brass);background:var(--brass-dim);color:#fdf6e3;}
  .roster-chip.placed{opacity:0.35;cursor:default;}
  .roster-chip .swatch{width:15px;height:15px;border-radius:2px;flex-shrink:0;}

  #overlay{
    position:fixed;inset:0;background:rgba(20,16,8,0.72);display:none;align-items:center;justify-content:center;z-index:50;
  }
  #overlay.show{display:flex;}
  #overlay .box{
    background:var(--paper);border:2px solid var(--brass-dim);border-radius:4px;padding:24px 28px;max-width:380px;text-align:center;
    box-shadow:0 10px 40px rgba(0,0,0,0.4);
  }
  #overlay .box h2{font-family:'Cinzel',serif;color:var(--brass-dim);letter-spacing:0.05em;text-transform:uppercase;font-size:18px;margin:0 0 10px;}
  #overlay .box p{font-size:13px;color:var(--ink-dim);line-height:1.55;margin:0 0 16px;font-family:'Cormorant Garamond',serif;font-size:15px;}

  #dragGhost{
    position:fixed; z-index:60; pointer-events:none; display:none;
    width:44px;height:44px;border-radius:6px;border:2px solid #fdf6e3;
    box-shadow:0 4px 14px rgba(0,0,0,0.4); align-items:center; justify-content:center;
    font-family:'Cormorant Garamond',serif;font-weight:700;font-size:10px;color:#fdf6e3;text-align:center;padding:2px;
  }
  #dragGhost.show{display:flex;}
  .roster-chip{ touch-action:none; user-select:none; -webkit-user-select:none; }

  #diceOverlay{
    position:absolute; top:10px; left:50%; transform:translateX(-50%) translateY(-8px);
    opacity:0; pointer-events:none; transition:opacity 0.18s ease, transform 0.18s ease; z-index:20;
  }
  #diceOverlay.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  .dice-panel{
    background:rgba(233,223,196,0.97); border:2px solid var(--brass-dim); border-radius:6px;
    padding:9px 16px 8px; box-shadow:0 6px 22px rgba(0,0,0,0.4); text-align:center;
  }
  .dice-groups{ display:flex; align-items:center; justify-content:center; gap:12px; }
  .dice-group{ display:flex; flex-direction:column; align-items:center; gap:4px; }
  .dice-group .glabel{ font-family:'IBM Plex Mono',monospace; font-size:9.5px; color:var(--ink-dim); letter-spacing:0.03em; }
  .dice-set{ display:flex; gap:4px; }
  .dice-vs{ font-family:'Cinzel',serif; font-size:11px; color:var(--ink-dim); align-self:center; padding-top:12px; }
  .die{
    width:32px;height:32px; background:#fdf6e3; border:2px solid var(--ink); border-radius:6px;
    display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr);
    padding:4px; gap:1px; transition:border-color 0.15s, opacity 0.15s;
  }
  .die.rolling{ border-color:var(--ink-dim); }
  .die.kept{ border-color:var(--brass-dim); box-shadow:0 0 0 2px var(--brass-dim); }
  .die.discard{ opacity:0.4; }
  .die .pip{ border-radius:50%; background:var(--ink); align-self:center; justify-self:center; width:65%; height:65%; }
  .dice-result{ margin-top:5px; font-family:'Cormorant Garamond',serif; font-weight:700; font-size:14px; color:var(--ink); min-height:18px; }
  .dice-result.win{ color:var(--ok); }
  .dice-result.lose{ color:var(--danger); }
  .dice-result.draw{ color:var(--warn); }

  /* Landscape-first: this is the default row layout above (board + narrow
     sidebar), which already suits a landscape phone well. Portrait phones
     get a stacked, scrollable layout instead. */
  @media (max-width:900px) and (orientation:portrait){
    main{flex-direction:column;overflow-y:auto;-webkit-overflow-scrolling:touch;}
    #boardWrap{flex:none;width:100%;max-height:48vh;padding:8px;}
    #sidebar{
      position:static;width:100%;flex-shrink:0;
      border-left:none;border-top:2px solid var(--brass-dim);
      box-shadow:none;
    }
    header .title{font-size:12px;}
    #brigadeStatus{flex-wrap:wrap;gap:5px 14px;font-size:9.5px;}
  }
  /* Short landscape viewports (phone chrome eating vertical space): compact the chrome */
  @media (max-height:430px){
    header{padding:4px 12px;}
    header .title{font-size:12px;}
    header .title span{display:none;}
    #phaseBar .step{padding:3px 2px;font-size:11px;}
    #brigadeStatus{padding:2px 10px;font-size:9.5px;}
    #sidebar{width:210px;}
    #log{max-height:80px;}
  }
  #sidebarToggle{display:none;}
</style>
</head>
<body>
<div id="app">
<div id="dragGhost"></div>
  <header>
    <div class="title">TravelBattle<span>Field Command &mdash; Solo Engine v1</span></div>
    <div style="display:flex;align-items:center;gap:8px;">
      <div id="turnBadge">&mdash;</div>
      <button id="sidebarToggle">&#9776;</button>
    </div>
  </header>

  <div id="phaseBar">
    <div class="step" data-phase="deploy">Deploy</div>
    <div class="step" data-phase="move">Move</div>
    <div class="step" data-phase="fire">Artillery</div>
    <div class="step" data-phase="fight">Fight</div>
    <div class="step" data-phase="rally">Rally / Turnaround</div>
  </div>
  <div id="brigadeStatus"></div>

  <main>
    <div id="boardWrap">
      <canvas id="board" width="900" height="900"></canvas>
      <div id="diceOverlay"><div class="dice-panel"><div class="dice-groups"></div><div class="dice-result"></div></div></div>
    </div>
    <div id="sidebar">
      <div id="rosterPanel">
        <h3 id="rosterTitle">Deploy Brigade</h3>
        <div id="brigadeProgress" style="padding:0 12px 6px;font-size:11px;color:var(--ink-dim);font-family:'IBM Plex Mono',monospace;"></div>
        <div id="rosterList"></div>
        <div id="actionRow">
          <button id="confirmBrigadeBtn" class="primary" style="display:none;" disabled>Confirm This Brigade</button>
          <button id="undoBtn" disabled>Undo</button>
        </div>
        <div id="actionRow">
          <button id="endDeployBtn" class="primary" disabled>Confirm Deployment</button>
        </div>
      </div>

      <div id="battlePanel" style="display:none;flex-direction:column;flex:1;min-height:0;">
        <h3>Selected</h3>
        <div id="unitInfo"><span class="empty">No unit selected</span></div>
        <div id="actionRow">
          <button id="squareBtn" disabled>Form Square</button>
          <button id="ambushBtn" style="display:none;" disabled>Lay Ambush</button>
          <button id="chargeBtn" style="display:none;" disabled>Charge</button>
          <button id="endMoveBtn" disabled>End Move Phase</button>
          <button id="endFireBtn" style="display:none;">End Artillery Phase</button>
          <button id="endFightBtn" style="display:none;">End Fight Phase</button>
          <button id="undoBtnBattle" disabled>Undo</button>
        </div>
        <div id="logWrap">
          <button id="logToggle" class="collapsed"><span>Field Report</span><span class="chev">&#9660;</span></button>
          <div id="log" class="collapsed"></div>
        </div>
      </div>
    </div>
  </main>
</div>

<div id="overlay">
  <div class="box">
    <h2 id="overlayTitle">TravelBattle</h2>
    <p id="overlayText"></p>
    <canvas id="rotationPreviewCanvas" width="220" height="220" style="display:none;border:2px solid var(--brass-dim);border-radius:4px;margin-bottom:14px;"></canvas>
    <button id="overlayBtn" class="primary">Begin</button>
  </div>
</div>

<script>
/* =========================================================
   CONFIG & CONSTANTS
========================================================= */
/* =========================================================
   BOARD: TWO PHYSICAL BOARDS, PLACED SIDE BY SIDE
   TravelBattle is played on two boards pushed together. They join
   along a vertical seam; both players deploy along their own top/
   bottom edge across the FULL combined width. Each half below
   represents one physical board, full depth, half width.

   BOARD_A_TERRAIN / BOARD_B_TERRAIN are traced from Matthew's actual
   board photos (Aug 2026) — best-effort read of road/woods/building/
   field placement, confirmed against his description. The light grey
   blotches visible in the photos are decorative (rocks / cliff faces
   on hill inclines) with no gameplay effect on their own, and no hill
   terrain was confidently identifiable in either photo, so both boards
   are currently coded with no HILL squares — flag this if either board
   does have a hill area, since that would need adding explicitly.

   Each game start: one board is randomly assigned to each side, then
   each side rolls a d6 for that board's table orientation (1-3 =
   forced rotation of that many 90° clockwise turns; 4-6 = that side's
   player chooses the rotation) — see beginBoardSetup().
========================================================= */
const HALF_COLS = 10, ROWS = 10, COLS = HALF_COLS*2; // each physical board is 10x10; combined map is 20 wide x 10 deep
let CELL = 68; // recomputed responsively at runtime, see computeCellSize()

// Board A — exact terrain from Matthew's annotated spreadsheet (Aug 2026).
// Roads are stored as a full ROAD square for gameplay (any unit in the square
// gets the bonus) but rendered as a thin line through the cell centre — see
// the road-drawing pass in draw() — so the visual doesn't fill the whole tile.
const BOARD_A_TERRAIN = [
  ['OPEN', 'OPEN', 'OPEN', 'OPEN', 'OPEN', 'OPEN', 'ROAD', 'ROAD', 'OPEN', 'OPEN'],
  ['OPEN', 'HILL', 'HILL', 'HILL', 'HILL', 'OPEN', 'ROAD', 'WOODS', 'HILL', 'HILL'],
  ['ROAD', 'HILL', 'HILL', 'OPEN', 'OPEN', 'ROAD', 'ROAD', 'WOODS', 'HILL', 'HILL'],
  ['ROAD', 'ROAD', 'ROAD', 'ROAD', 'ROAD', 'ROAD', 'OPEN', 'HILL', 'HILL', 'HILL'],
  ['OPEN', 'OPEN', 'ROAD', 'OPEN', 'OPEN', 'OPEN', 'OPEN', 'HILL', 'HILL', 'HILL'],
  ['OPEN', 'OPEN', 'ROAD', 'OPEN', 'OPEN', 'OPEN', 'OPEN', 'HILL', 'HILL', 'HILL'],
  ['OPEN', 'BUILDING', 'BUILDING', 'OPEN', 'OPEN', 'OPEN', 'OPEN', 'OPEN', 'HILL', 'HILL'],
  ['OPEN', 'BUILDING', 'ROAD', 'ROAD', 'ROAD', 'ROAD', 'ROAD', 'ROAD', 'ROAD', 'ROAD'],
  ['OPEN', 'OPEN', 'ROAD', 'PLOUGHED_FIELD', 'PLOUGHED_FIELD', 'PLOUGHED_FIELD', 'PLOUGHED_FIELD', 'OPEN', 'OPEN', 'OPEN'],
  ['OPEN', 'OPEN', 'ROAD', 'OPEN', 'OPEN', 'OPEN', 'OPEN', 'OPEN', 'OPEN', 'OPEN'],
];

// Board B — exact terrain from Matthew's annotated spreadsheet (Aug 2026).
const BOARD_B_TERRAIN = [
  ['OPEN', 'OPEN', 'ROAD', 'OPEN', 'OPEN', 'OPEN', 'OPEN', 'OPEN', 'OPEN', 'OPEN'],
  ['HILL', 'HILL', 'ROAD', 'OPEN', 'OPEN', 'OPEN', 'OPEN', 'PLOUGHED_FIELD', 'OPEN', 'OPEN'],
  ['HILL', 'HILL', 'ROAD', 'ROAD', 'OPEN', 'OPEN', 'OPEN', 'PLOUGHED_FIELD', 'BUILDING', 'ROAD'],
  ['OPEN', 'ROAD', 'BUILDING', 'ROAD', 'ROAD', 'OPEN', 'OPEN', 'OPEN', 'OPEN', 'OPEN'],
  ['OPEN', 'ROAD', 'PLOUGHED_FIELD', 'OPEN', 'ROAD', 'ROAD', 'OPEN', 'OPEN', 'OPEN', 'OPEN'],
  ['OPEN', 'ROAD', 'PLOUGHED_FIELD', 'ROAD', 'ROAD', 'ROAD', 'OPEN', 'OPEN', 'OPEN', 'OPEN'],
  ['ROAD', 'ROAD', 'ROAD', 'ROAD', 'WOODS', 'ROAD', 'ROAD', 'ROAD', 'HILL', 'OPEN'],
  ['OPEN', 'OPEN', 'OPEN', 'OPEN', 'WOODS', 'WOODS', 'OPEN', 'ROAD', 'HILL', 'HILL'],
  ['OPEN', 'OPEN', 'OPEN', 'OPEN', 'OPEN', 'OPEN', 'OPEN', 'ROAD', 'HILL', 'HILL'],
  ['OPEN', 'OPEN', 'OPEN', 'OPEN', 'OPEN', 'OPEN', 'OPEN', 'ROAD', 'HILL', 'HILL'],
];

// Rotate a square (N x N) grid 90° clockwise, `times` times.
function rotateGrid90CW(grid){
  const n = grid.length;
  const out = [];
  for(let y=0;y<n;y++){ const row=[]; for(let x=0;x<n;x++) row.push(null); out.push(row); }
  for(let y=0;y<n;y++) for(let x=0;x<n;x++) out[x][n-1-y] = grid[y][x];
  return out;
}
function rotateGridTimes(grid, times){
  let g = grid;
  const n = ((times%4)+4)%4;
  for(let i=0;i<n;i++) g = rotateGrid90CW(g);
  return g;
}

function boardTerrainFor(key, rotation){
  const base = key==='A' ? BOARD_A_TERRAIN : BOARD_B_TERRAIN;
  return rotateGridTimes(base, rotation||0);
}

// Specific road-to-road connections to NOT draw, even though the cells are
// adjacent ROAD squares — a visually redundant loop where the road already
// connects one square earlier (Matthew's note, Aug 2026). Coordinates are
// LOCAL to that physical board (0..HALF_COLS-1), before rotation/placement.
const BOARD_EXCLUDED_ROAD_EDGES = {
  A: [],
  B: [ {x1:4,y1:4,x2:4,y2:5} ] // left edge of the 2x2 block — the road already connects one square earlier
};

function rotatePointCW(x, y, n, times){
  let px=x, py=y;
  const t = ((times%4)+4)%4;
  for(let i=0;i<t;i++){ const nx = n-1-py, ny = px; px=nx; py=ny; }
  return [px, py];
}

// Excluded edges for one physical board, transformed by its rotation and
// shifted by colOffset (0 if it landed on the left half, HALF_COLS if right).
function excludedEdgesForBoard(boardKey, rotation, colOffset){
  return (BOARD_EXCLUDED_ROAD_EDGES[boardKey]||[]).map(e=>{
    const [rx1,ry1] = rotatePointCW(e.x1,e.y1,HALF_COLS,rotation);
    const [rx2,ry2] = rotatePointCW(e.x2,e.y2,HALF_COLS,rotation);
    return { x1:rx1+colOffset, y1:ry1, x2:rx2+colOffset, y2:ry2 };
  });
}
function edgeKey(x1,y1,x2,y2){
  // undirected — normalize so (a,b) and (b,a) produce the same key
  return (x1<x2 || (x1===x2 && y1<y2)) ? `${x1},${y1}-${x2},${y2}` : `${x2},${y2}-${x1},${y1}`;
}

function buildTerrainMap(assignment, rotation){
  assignment = assignment || { red:'A', blue:'B' };
  rotation = rotation || { red:0, blue:0 };
  const leftGrid = boardTerrainFor(assignment.red, rotation.red);
  const rightGrid = boardTerrainFor(assignment.blue, rotation.blue);
  const map = [];
  for(let y=0;y<ROWS;y++) map.push(leftGrid[y].concat(rightGrid[y]));
  return map;
}

function buildExcludedRoadEdgeSet(assignment, rotation){
  assignment = assignment || { red:'A', blue:'B' };
  rotation = rotation || { red:0, blue:0 };
  const edges = [
    ...excludedEdgesForBoard(assignment.red, rotation.red, 0),
    ...excludedEdgesForBoard(assignment.blue, rotation.blue, HALF_COLS)
  ];
  const set = new Set();
  edges.forEach(e=> set.add(edgeKey(e.x1,e.y1,e.x2,e.y2)));
  return set;
}
const SIDES = { RED: 'red', BLUE: 'blue' };
const SIDE_LABEL = { red: 'Britain (Red)', blue: 'France (Blue)' };
const SIDE_COLOR = { red: '#a3403a', blue: '#2e4566' };
const SIDE_COLOR_DIM = { red: '#5c2825', blue: '#1c2a3d' };

const UNIT_TYPES = {
  BRIGADIER:   { key:'BRIGADIER',   label:'Brigadier',    move:2, canFight:false, reroll:false, shape:'star' },
  INFANTRY:    { key:'INFANTRY',    label:'Infantry',     move:1, canFight:true,  reroll:false, shape:'square', canFormSquare:true },
  GUARD:       { key:'GUARD',       label:'Guard Infantry',move:1,canFight:true,  reroll:true,   shape:'square', canFormSquare:true },
  HEAVY_CAV:   { key:'HEAVY_CAV',   label:'Heavy Cavalry', move:2, canFight:true,  reroll:true,   shape:'triangle', isCavalry:true },
  LIGHT_CAV:   { key:'LIGHT_CAV',   label:'Light Cavalry', move:2, canFight:true,  reroll:false,  shape:'triangle', isCavalry:true },
  ARTILLERY:   { key:'ARTILLERY',   label:'Artillery',    move:1, canFight:true,  reroll:false,  shape:'diamond', isArtillery:true }
};

// Full army per side, split into 3 Brigades — matches the physical box contents
// (3 Brigadiers, 2 Guard Infantry, 6 Infantry, 2 Heavy Cavalry, 2 Light Cavalry, 2 Artillery)
const BRIGADE_COMPOSITIONS = [
  ['BRIGADIER','GUARD','INFANTRY','INFANTRY','LIGHT_CAV','ARTILLERY'],
  ['BRIGADIER','INFANTRY','INFANTRY','HEAVY_CAV','ARTILLERY'],
  ['BRIGADIER','GUARD','INFANTRY','INFANTRY','HEAVY_CAV','LIGHT_CAV']
];

const TERRAIN = {
  OPEN:          { key:'OPEN', elevation:0, restrictTo:null, allowDouble:true },
  FIELD:         { key:'FIELD', elevation:0, restrictTo:null, allowDouble:true }, // cosmetic crop field, plays exactly like open ground
  PLOUGHED_FIELD:{ key:'PLOUGHED_FIELD', elevation:0, restrictTo:null, allowDouble:true, plough:true }, // hard going for horses and guns — see Movement rules
  ROAD:          { key:'ROAD', elevation:0, restrictTo:null, allowDouble:true, isRoad:true },
  WOODS:         { key:'WOODS', elevation:0, restrictTo:['INFANTRY','GUARD'], allowDouble:false, blocksLOS:true, defenseBonus:true },
  BUILDING:      { key:'BUILDING', elevation:0, restrictTo:['INFANTRY','GUARD','ARTILLERY'], allowDouble:false, blocksLOS:true, defenseBonus:true },
  HILL:          { key:'HILL', elevation:1, restrictTo:null, allowDouble:true }
};

/* =========================================================
   STATE
========================================================= */
let state = {
  gameOver: false,
  mode: 'hotseat',  // 'hotseat' | 'ai'
  aiSide: null,     // side controlled by the AI, when mode==='ai'
  aiDifficulty: 'medium', // 'easy' | 'medium' | 'hard'
  terrain: buildTerrainMap(),
  excludedRoadEdges: buildExcludedRoadEdgeSet(),
  craters: [], // {x,y} — every square an Artillery shot has hit, persists for the whole match
  units: [],       // {id, side, type, x, y, hp:'active', formation:'line'|'square', pushed:false, mustTurnOnly:false, facing}
  turn: null,      // 'red' | 'blue'
  phase: 'deploy',
  deployQueue: [],
  deployTurn: null,
  selectedUnitId: null,
  moved: new Set(), // unit ids that have moved/declined this turn
  fired: new Set(),
  fought: new Set(),
  pendingTurnarounds: [], // units that must spend next phase turning around only
  log: []
};
let uidCounter = 1;
/* =========================================================
   UNDO
   Snapshot the whole game state before each human-initiated mutating
   action. Only human actions push a snapshot — the AI's own move/fire/
   fight decisions never call pushUndoSnapshot, so there's nothing to
   rewind into on the AI's turn. The stack is reset at the start of
   every human turn (and deployment turn-change), so undo can only ever
   reach back to the start of the current turn, never before it.
========================================================= */
let undoStack = [];

function snapshotState(){
  return JSON.stringify(state, (key, value) => (value instanceof Set) ? {__isSet:true, items:[...value]} : value);
}
function restoreState(snap){
  state = JSON.parse(snap, (key, value) => (value && value.__isSet) ? new Set(value.items) : value);
}
function pushUndoSnapshot(){
  undoStack.push(snapshotState());
  if(undoStack.length>50) undoStack.shift(); // cap memory use
  updateUndoButtons();
}
function resetUndoStack(){
  undoStack = [];
  updateUndoButtons();
}
function undoLastAction(){
  if(undoStack.length===0) return;
  const snap = undoStack.pop();
  restoreState(snap);
  unitAnimations = {};
  activeActionLine = null;
  deathEffects = [];
  selectedDeployType = null;
  dragState = null;
  highlightCells = [];
  if(state.phase==='deploy') renderRoster();
  else selectUnit(null);
  syncPhaseButtons();
  updateHeader();
  draw();
  log('Undone.', 'system');
  updateUndoButtons();
}
// Ensures the visible End-Phase button always matches state.phase — called
// after undo as a defensive re-sync (the undo stack is now scoped so it can
// never actually cross a phase boundary, but this keeps the UI honest regardless).
function syncPhaseButtons(){
  const moveBtn = document.getElementById('endMoveBtn');
  const fireBtn = document.getElementById('endFireBtn');
  const fightBtn = document.getElementById('endFightBtn');
  if(!moveBtn || !fireBtn || !fightBtn) return;
  moveBtn.style.display = state.phase==='move' ? 'inline-block' : 'none';
  fireBtn.style.display = state.phase==='fire' ? 'inline-block' : 'none';
  fightBtn.style.display = state.phase==='fight' ? 'inline-block' : 'none';
}
function updateUndoButtons(){
  const disabled = undoStack.length===0;
  const b1 = document.getElementById('undoBtn'); if(b1) b1.disabled = disabled;
  const b2 = document.getElementById('undoBtnBattle'); if(b2) b2.disabled = disabled;
}

function newUnit(side, typeKey, x, y, brigadeId){
  return {
    id: 'u'+(uidCounter++), side, type: typeKey, brigadeId,
    x, y, removed:false, formation:'line', pushed:false,
    turnOnly:false, // true = can only turn around this coming turn
    rallying:false,
    charged:false,          // clean 2-square Cavalry run this turn — wins ties in the ensuing fight
    leadershipUsed:false,   // Brigadiers only: one guaranteed Rally save per match
    hidden:false,           // Woodland Ambush — invisible to artillery and to the AI's own targeting
    ambushSpentThisRound:false, // sprang an ambush this round — no woods defence bonus until side's next turn
    noActionThisTurn:false, // stood down an ambush without springing — can't move or fight for the rest of this turn
    smokeActive:false       // fired this cycle — shows muzzle smoke until this unit's side's next turn
  };
}

/* =========================================================
   LOGGING
========================================================= */
function log(msg, cls){
  const el = document.getElementById('log');
  const div = document.createElement('div');
  div.className = 'entry'+(cls?(' '+cls):'');
  div.textContent = msg;
  el.appendChild(div);
  el.scrollTop = el.scrollHeight;
}
const PIP_LAYOUT = {1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
function dieFaceHTML(value, extraClass){
  const active = PIP_LAYOUT[value] || [];
  let cells = '';
  for(let i=0;i<9;i++) cells += active.includes(i) ? '<span class="pip"></span>' : '<span></span>';
  return `<div class="die ${extraClass||''}">${cells}</div>`;
}

// groups: [{label, rolls:[1,4], keptValue:4, ...}] — rolls is every die actually
// rolled for that side (bonus/re-roll dice included), keptValue is the one that counts.
// The animation is purely cosmetic: the real values are already decided by the time
// this is called, so it briefly flickers random faces before settling on them.
function showDice(groups, resultText, resultCls){
  const overlay = document.getElementById('diceOverlay');
  const groupsEl = overlay.querySelector('.dice-groups');
  const resultEl = overlay.querySelector('.dice-result');
  clearTimeout(showDice._fadeT);
  clearInterval(showDice._rollT);

  function renderFrame(final){
    groupsEl.innerHTML = groups.map((g,i)=>{
      const diceHTML = g.rolls.map(v=>{
        const shown = final ? v : (1+Math.floor(Math.random()*6));
        const cls = final ? (v===g.keptValue ? 'kept' : (g.rolls.length>1 ? 'discard' : '')) : 'rolling';
        return dieFaceHTML(shown, cls);
      }).join('');
      const sep = i<groups.length-1 ? '<div class="dice-vs">vs</div>' : '';
      return `<div class="dice-group"><div class="glabel">${g.label}</div><div class="dice-set">${diceHTML}</div></div>${sep}`;
    }).join('');
  }

  overlay.classList.add('show');
  resultEl.textContent = '';
  resultEl.className = 'dice-result';
  renderFrame(false);
  let ticks = 0;
  showDice._rollT = setInterval(()=>{
    ticks++;
    if(ticks>=4){
      clearInterval(showDice._rollT);
      renderFrame(true);
      resultEl.textContent = resultText || '';
      resultEl.className = 'dice-result ' + (resultCls||'');
    } else {
      renderFrame(false);
    }
  }, 180);
  showDice._fadeT = setTimeout(()=>overlay.classList.remove('show'), 3400);
}

/* =========================================================
   GEOMETRY HELPERS
========================================================= */
function inBounds(x,y){ return x>=0 && x<COLS && y>=0 && y<ROWS; }
function terrainAt(x,y){ return TERRAIN[state.terrain[y][x]]; }
function unitsAt(x,y){ return state.units.filter(u=>!u.removed && u.x===x && u.y===y); }
function unitAt(x,y, excludeId){ return state.units.find(u=>!u.removed && u.x===x && u.y===y && u.id!==excludeId); }

// Stacked squares (doubled infantry in open terrain) hold up to 2 units.
// A single tap only ever reached the first one — repeated taps on the same
// square now cycle through whichever units are actually there.
function pickUnitAtCell(x,y){
  const list = unitsAt(x,y);
  if(list.length===0) return null;
  if(list.length===1) return list[0];
  const key = x+','+y;
  if(state._stackCycle && state._stackCycle.key===key){
    state._stackCycle.idx = (state._stackCycle.idx+1) % list.length;
  } else {
    state._stackCycle = {key, idx:0};
  }
  return list[state._stackCycle.idx];
}
function isAdjacent(a,b){ return Math.max(Math.abs(a.x-b.x), Math.abs(a.y-b.y)) === 1; }
function neighbors8(x,y){
  const out=[];
  for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){
    if(dx===0&&dy===0) continue;
    const nx=x+dx, ny=y+dy;
    if(inBounds(nx,ny)) out.push({x:nx,y:ny,dx,dy});
  }
  return out;
}

/* =========================================================
   COHESION: which units in a brigade can currently move
   (must trace a touching-chain, incl. diagonal, back to the Brigadier)
   Computed per-Brigade — a side fields 3 independent Brigades, each
   with its own Brigadier and its own chain.
========================================================= */
function movableUnitsForSide(side){
  const mine = state.units.filter(u=>!u.removed && u.side===side);
  const brigadeIds = [...new Set(mine.map(u=>u.brigadeId))];
  const connected = new Set();
  for(const bId of brigadeIds){
    const group = mine.filter(u=>u.brigadeId===bId);
    const brig = group.find(u=>u.type==='BRIGADIER');
    if(!brig){ group.forEach(u=>connected.add(u.id)); continue; } // Brigadier down: this Brigade's survivors act independently
    const local = new Set([brig.id]);
    let changed = true;
    while(changed){
      changed = false;
      for(const u of group){
        if(local.has(u.id)) continue;
        for(const other of group){
          if(!local.has(other.id)) continue;
          if(isAdjacent(u, other)){ local.add(u.id); changed = true; break; }
        }
      }
    }
    local.forEach(id=>connected.add(id));
  }
  return connected;
}

/* =========================================================
   MOVEMENT: BFS over grid, diagonal = 1 step, respects terrain
   and stacking, road bonus if start & end both on road.
========================================================= */
// Artillery brigaded entirely with Cavalry (no other combat unit types in the
// same Brigade) fights as Horse Artillery: moves at Cavalry speed everywhere
// except a ploughed field.
function isHorseArtillery(u){
  if(u.type !== 'ARTILLERY') return false;
  const groupmates = state.units.filter(o=>!o.removed && o.side===u.side && o.brigadeId===u.brigadeId && o.id!==u.id && o.type!=='BRIGADIER');
  if(groupmates.length===0) return false;
  return groupmates.every(o => UNIT_TYPES[o.type].isCavalry);
}
function isCavalryOrHorseArtillery(u){
  return UNIT_TYPES[u.type].isCavalry || isHorseArtillery(u);
}
function brigadeCavalryCount(u){
  return state.units.filter(o=>!o.removed && o.side===u.side && o.brigadeId===u.brigadeId && UNIT_TYPES[o.type].isCavalry).length;
}
function brigadeHasCavalryEscort(u){
  const available = brigadeCavalryCount(u);
  const key = u.side+'-'+u.brigadeId;
  const used = (state.ploughEscortUsed && state.ploughEscortUsed[key]) || 0;
  return used < available;
}
function consumePloughEscort(u){
  if(!state.ploughEscortUsed) state.ploughEscortUsed = {};
  const key = u.side+'-'+u.brigadeId;
  state.ploughEscortUsed[key] = (state.ploughEscortUsed[key]||0) + 1;
}

// A clean 2-square Cavalry run in one consistent direction (no pivot), not
// crossing a ploughed field. Detected purely from start/end coordinates:
// covering a 2-square straight-line displacement in exactly 2 steps is only
// possible without a pivot, so no separate path-tracking is needed.
function isCleanChargeRun(fromX, fromY, toX, toY){
  const dx = toX - fromX, dy = toY - fromY;
  const straight = (dx===0 || Math.abs(dx)===2) && (dy===0 || Math.abs(dy)===2) && !(dx===0 && dy===0);
  if(!straight) return false;
  const midX = fromX + dx/2, midY = fromY + dy/2;
  if(terrainAt(fromX,fromY).plough || terrainAt(midX,midY).plough || terrainAt(toX,toY).plough) return false;
  return true;
}
// Is `pos` adjacent to at least one enemy this side could legally charge? (not in
// Square, and not on higher ground than the charging destination — matches the
// "can't charge uphill or against a Square" restriction).
function hasChargeableTargetAt(side, pos){
  return state.units.some(o=>!o.removed && o.side!==side && isAdjacent(pos,o) &&
    o.formation!=='square' && terrainAt(o.x,o.y).elevation<=terrainAt(pos.x,pos.y).elevation);
}
// Every legal move for a Cavalry unit that would count as a clean charge run
// AND land it adjacent to something worth charging — the set of squares the
// Charge button highlights.
function computeChargeDestinations(u){
  if(!UNIT_TYPES[u.type].isCavalry) return [];
  return legalMoves(u).filter(m => isCleanChargeRun(u.x,u.y,m.x,m.y) && hasChargeableTargetAt(u.side, m));
}

function unitBaseMove(u){
  if(isHorseArtillery(u)) return UNIT_TYPES.HEAVY_CAV.move;
  return UNIT_TYPES[u.type].move;
}

function legalMoves(u){
  if(u.formation==='square') return []; // squares don't move
  if(u.turnOnly) return [];
  if(state.moved && state.moved.has(u.id)) return []; // already moved (or explicitly stood pat) this phase
  const connected = movableUnitsForSide(u.side);
  if(!connected.has(u.id)) return [];

  let allowance = unitBaseMove(u);
  const startRoad = terrainAt(u.x,u.y).isRoad;
  const cavOrHorseArty = isCavalryOrHorseArtillery(u);
  const isFootArtillery = UNIT_TYPES[u.type].isArtillery && !isHorseArtillery(u);
  const hasEscort = isFootArtillery ? brigadeHasCavalryEscort(u) : false;

  const dist = new Map();
  const startKey = u.x+','+u.y;
  dist.set(startKey, 0);
  const queue = [{x:u.x,y:u.y,d:0}];
  const results = [];
  const maxSteps = allowance + (startRoad?1:0); // optimistic cap; road bonus validated per-destination below

  while(queue.length){
    const cur = queue.shift();
    if(cur.d >= maxSteps) continue;
    for(const n of neighbors8(cur.x, cur.y)){
      const key = n.x+','+n.y;
      const nd = cur.d + 1;
      if(dist.has(key) && dist.get(key) <= nd) continue;
      const terr = terrainAt(n.x,n.y);
      const t = UNIT_TYPES[u.type];
      if(terr.restrictTo && !terr.restrictTo.includes(t.key)) continue;
      if(terr.plough && isFootArtillery && !hasEscort) continue; // Foot Artillery needs a Cavalry escort in its Brigade to cross a ploughed field
      // occupancy check
      const occ = unitsAt(n.x,n.y).filter(o=>o.id!==u.id && o.side===u.side);
      const enemyUnitsHere = unitsAt(n.x,n.y).filter(o=>o.side!==u.side);
      const enemyOcc = enemyUnitsHere.length>0 && !(enemyUnitsHere.length===1 && enemyUnitsHere[0].type==='BRIGADIER');
      if(enemyOcc) continue; // can't move onto an enemy square (that's a fight, not a move) — except a lone Brigadier, who gets shoved aside instead
      if(occ.length>0){
        const canDouble = terr.allowDouble && (t.key==='INFANTRY'||t.key==='GUARD') && occ.every(o=>UNIT_TYPES[o.type].key==='INFANTRY'||UNIT_TYPES[o.type].key==='GUARD') && occ.length<2;
        if(!canDouble) continue;
      }
      dist.set(key, nd);
      queue.push({x:n.x,y:n.y,d:nd});
    }
  }

  const startPlough = terrainAt(u.x,u.y).plough;
  for(const [key,d] of dist){
    if(key===startKey) continue;
    const [x,y] = key.split(',').map(Number);
    const endRoad = terrainAt(x,y).isRoad;
    let effAllowance = (startRoad && endRoad) ? allowance+1 : allowance;
    const endPlough = terrainAt(x,y).plough;
    if(cavOrHorseArty && (startPlough || endPlough)) effAllowance = Math.min(effAllowance, 1); // hard going for horses starting or ending on a ploughed field
    if(d <= effAllowance) results.push({x,y,steps:d});
  }
  return results;
}

/* =========================================================
   ARTILLERY: RANGE, LINE OF SIGHT
========================================================= */
function chebyshev(a,b){ return Math.max(Math.abs(a.x-b.x), Math.abs(a.y-b.y)); }

function lineCells(a,b){
  // Bresenham-ish supercover line between cell centers, used for LOS sampling
  const cells = [];
  let x0=a.x, y0=a.y, x1=b.x, y1=b.y;
  const dx = Math.abs(x1-x0), dy = Math.abs(y1-y0);
  const sx = x0<x1?1:-1, sy = y0<y1?1:-1;
  let err = dx-dy, x=x0, y=y0;
  while(true){
    cells.push({x,y});
    if(x===x1 && y===y1) break;
    const e2 = 2*err;
    if(e2 > -dy){ err -= dy; x += sx; }
    if(e2 < dx){ err += dx; y += sy; }
  }
  return cells;
}

function hasLOS(gun, target){
  if(chebyshev(gun,target) > 6) return false;
  const path = lineCells(gun,target).slice(1,-1); // exclude endpoints
  const gunElev = terrainAt(gun.x,gun.y).elevation;
  const tgtElev = terrainAt(target.x,target.y).elevation;
  const shooterElevated = gunElev > 0 || tgtElev > 0;
  let blockedCount = 0;
  for(const c of path){
    const terr = terrainAt(c.x,c.y);
    const occ = unitsAt(c.x,c.y).length>0;
    const blocksHere = terr.blocksLOS || occ;
    if(blocksHere){
      // overhead fire allowed if gun or target is on higher ground than the obstruction
      if(shooterElevated && terr.elevation <= Math.max(gunElev,tgtElev)) continue;
      blockedCount++;
    }
  }
  // "needs to see half or more of target" -> simplified: no more than half the path may be blocked
  return blockedCount === 0 || (blockedCount / Math.max(path.length,1)) < 0.5;
}

function artilleryTargets(gun){
  if(gun.turnOnly) return []; // pushed/shaken: can only turn around, not fire
  if(state.fired && state.fired.has(gun.id)) return []; // already fired this phase
  if(state.moved && state.moved.has(gun.id)) return []; // moved this turn — Artillery is move OR fire, never both
  if(isInActiveFight(gun)) return []; // in contact with an enemy: it joins the Fight phase instead of firing at range
  return state.units.filter(t=>!t.removed && !t.hidden && t.type!=='BRIGADIER' && t.side!==gun.side && hasLOS(gun,t) && !isInActiveFight(t));
}
function isInActiveFight(u){
  return state.units.some(o=>!o.removed && o.side!==u.side && isAdjacent(o,u));
}

/* =========================================================
   COMBAT
========================================================= */
function rollD6(){ return 1+Math.floor(Math.random()*6); }
function rollBest(n){ let best=0; const all=[]; for(let i=0;i<n;i++){const r=rollD6(); all.push(r); if(r>best) best=r;} return {value:best, rolls:all}; }

// Two Infantry/Guard units doubled into the same open-terrain square form
// a Column: a genuine combat bonus, not just shared artillery vulnerability.
function stackPartner(u){
  if(!(u.type==='INFANTRY'||u.type==='GUARD')) return null;
  return state.units.find(o=>!o.removed && o.id!==u.id && o.side===u.side && o.x===u.x && o.y===u.y && (o.type==='INFANTRY'||o.type==='GUARD'));
}
function isInColumn(u){ return !!stackPartner(u); }

function bonusDiceCount(unit, opponent, defending){
  const t = UNIT_TYPES[unit.type];
  let n = 1;
  if(t.reroll) n = 2; // Guard Infantry / Heavy Cavalry re-roll (treated as best-of-2)
  const terr = terrainAt(unit.x,unit.y);
  const eligibleDefender = t.key==='INFANTRY' || t.key==='GUARD' || t.key==='ARTILLERY';
  // A unit that sprang a Woodland Ambush this round gets no woods defence bonus until its side's next turn.
  const ambushSuppressed = terr.key==='WOODS' && unit.ambushSpentThisRound;
  if(defending && terr.defenseBonus && eligibleDefender && !ambushSuppressed) n = Math.max(n,2);
  const oppT = UNIT_TYPES[opponent.type];
  if(oppT.isCavalry && (t.key==='INFANTRY'||t.key==='GUARD') && unit.formation==='square') n = Math.max(n,2);
  if((t.key==='INFANTRY'||t.key==='GUARD') && isInColumn(unit)) n = Math.max(n,2); // Attack Column
  return n;
}

function resolveFight(attacker, defender, ambushMode){
  showActionLine(attacker, defender, '#a8720b', 3800);
  const aType = UNIT_TYPES[attacker.type], dType = UNIT_TYPES[defender.type];
  let aDice = bonusDiceCount(attacker, defender, false);
  let dDice = bonusDiceCount(defender, attacker, true);
  if(ambushMode==='advance') aDice = Math.max(aDice, 2); // committing to advance also grants a genuine second die
  // cavalry fighting non-square infantry: cavalry gets bonus die
  if(aType.isCavalry && (dType.key==='INFANTRY'||dType.key==='GUARD') && defender.formation!=='square') aDice = Math.max(aDice,2);
  if(dType.isCavalry && (aType.key==='INFANTRY'||aType.key==='GUARD') && attacker.formation!=='square') dDice = Math.max(dDice,2);
  // non-square infantry fighting square infantry: the non-square side gets bonus die
  if(aType.key==='INFANTRY' && attacker.formation!=='square' && (dType.key==='INFANTRY'||dType.key==='GUARD') && defender.formation==='square') aDice = Math.max(aDice,2);
  if(dType.key==='INFANTRY' && defender.formation!=='square' && (aType.key==='INFANTRY'||aType.key==='GUARD') && attacker.formation==='square') dDice = Math.max(dDice,2);

  const aRoll = rollBest(aDice);
  const dRoll = rollBest(dDice);
  if(ambushMode){ aRoll.value = Math.min(6, aRoll.value+1); } // ambush: +1 to the rolled value, capped at 6

  const aName = SIDE_LABEL[attacker.side].split(' ')[0], dName = SIDE_LABEL[defender.side].split(' ')[0];
  const isTie = aRoll.value === dRoll.value;

  // A defender on higher ground wins any tie against an attacker from lower ground.
  const defenderHillTieWin = isTie &&
    terrainAt(defender.x,defender.y).elevation > terrainAt(attacker.x,attacker.y).elevation;

  // A clean 2-square Cavalry charge wins ties in this first fight — but not uphill, and not against a Square.
  const attackerChargeTieWin = isTie && !defenderHillTieWin && attacker.charged &&
    UNIT_TYPES[attacker.type].isCavalry && defender.formation!=='square' &&
    terrainAt(defender.x,defender.y).elevation <= terrainAt(attacker.x,attacker.y).elevation;

  // An Attack Column (2 Infantry/Guard stacked) wins ties while attacking.
  const attackerColumnTieWin = isTie && !defenderHillTieWin && !attackerChargeTieWin &&
    (aType.key==='INFANTRY'||aType.key==='GUARD') && isInColumn(attacker);

  const genuineDraw = isTie && !defenderHillTieWin && !attackerChargeTieWin && !attackerColumnTieWin;

  let resultText, resultCls;
  if(genuineDraw){ resultText = 'Drawn — continues next turn'; resultCls = 'draw'; }
  else if(defenderHillTieWin){ resultText = `${dName} holds the high ground`; resultCls = 'win'; }
  else if(attackerChargeTieWin){ resultText = `${aName}'s charge carries the tie`; resultCls = 'win'; }
  else if(attackerColumnTieWin){ resultText = `${aName}'s Column carries the tie`; resultCls = 'win'; }
  else if(aRoll.value > dRoll.value){ resultText = `${aName} wins by ${aRoll.value-dRoll.value}`; resultCls = 'win'; }
  else { resultText = `${dName} wins by ${dRoll.value-aRoll.value}`; resultCls = 'win'; }
  showDice([
    {label:aName, rolls:aRoll.rolls, keptValue:aRoll.value},
    {label:dName, rolls:dRoll.rolls, keptValue:dRoll.value}
  ], resultText, resultCls);

  attacker.charged = false; // spent, win or lose — a charge is a one-shot burst of momentum

  if(genuineDraw){
    log(`${aType.label} vs ${dType.label}: ${aRoll.value}-${dRoll.value}, drawn — fight continues next turn.`, 'combat');
    return;
  }
  if(defenderHillTieWin){
    log(`${dType.label} holds the high ground against ${aType.label}: ${aRoll.value}-${dRoll.value} tie goes to the defender.`, 'combat');
    pushBack(attacker, defender);
    return;
  }
  if(attackerChargeTieWin || attackerColumnTieWin){
    const reason = attackerChargeTieWin ? 'a clean charge' : 'a Column formation';
    log(`${aType.label}'s ${reason} carries the ${aRoll.value}-${dRoll.value} tie against ${dType.label}.`, 'combat');
    pushBack(defender, attacker);
    return;
  }
  const winnerIsAttacker = aRoll.value > dRoll.value;
  const winner = winnerIsAttacker ? attacker : defender;
  const loser = winnerIsAttacker ? defender : attacker;
  const diff = Math.abs(aRoll.value - dRoll.value);
  log(`${aType.label} (${SIDE_LABEL[attacker.side]}) vs ${dType.label} (${SIDE_LABEL[defender.side]}): ${aRoll.value}-${dRoll.value}. ${UNIT_TYPES[loser.type].label} of ${SIDE_LABEL[loser.side]} takes the worse of it.`, 'combat');

  const columnPartner = stackPartner(loser); // a broken Column takes both units with it
  if(diff===1){
    pushBack(loser, winner);
  } else if(diff===2){
    retreatAndRally(loser);
    if(columnPartner) retreatAndRally(columnPartner);
  } else {
    removeUnit(loser, 'destroyed in combat');
    if(columnPartner) removeUnit(columnPartner, 'Column broken alongside its partner');
  }
}

function pushBack(loser, winner){
  const dx = Math.sign(loser.x - winner.x) || 0;
  const dy = Math.sign(loser.y - winner.y) || 0;
  const nx = loser.x + dx, ny = loser.y + dy;
  if(inBounds(nx,ny) && !unitsAt(nx,ny).some(o=>o.side!==loser.side)){
    // shove any friendly unit already standing in the landing square one further step back
    const blocker = unitsAt(nx,ny).find(o=>o.side===loser.side && o.id!==loser.id);
    let landingClear = true;
    if(blocker){
      const bx = nx+dx, by = ny+dy;
      if(inBounds(bx,by) && unitsAt(bx,by).length===0){
        animateUnitTo(blocker, bx, by);
        blocker.turnOnly = true;
        log(`${UNIT_TYPES[blocker.type].label} is shoved back by the retreat.`, 'combat');
      } else {
        landingClear = false; // nowhere for the blocker to go — loser can't retreat into it either
      }
    }
    if(landingClear){ animateUnitTo(loser, nx, ny); }
  }
  loser.turnOnly = true;
  log(`${UNIT_TYPES[loser.type].label} pushed back and turned around; can only turn around next turn.`, 'combat');
}

function retreatAndRally(loser){
  const brig = state.units.find(u=>!u.removed && u.side===loser.side && u.type==='BRIGADIER' && u.brigadeId===loser.brigadeId);
  const edgeY = loser.side===SIDES.RED ? ROWS-1 : 0;
  const preferredX = brig ? clamp(brig.x,0,COLS-1) : loser.x;
  const cell = findNearestFreeEdgeCell(edgeY, preferredX, loser.id);
  animateUnitTo(loser, cell.x, cell.y);
  loser.turnOnly = true;
  loser.rallying = true;
  const t = UNIT_TYPES[loser.type];
  let successOn = [4,5,6];
  if(t.key==='GUARD') successOn = [3,4,5,6];
  if(t.key==='ARTILLERY') successOn = [5,6];
  const r = rollD6();
  showDice([{label:'Rally', rolls:[r], keptValue:r}], successOn.includes(r) ? 'Rallies!' : 'Fails to rally', successOn.includes(r) ? 'win' : 'lose');
  if(successOn.includes(r)){
    log(`${t.label} falls back to the board edge and RALLIES (rolled ${r}).`, 'combat');
  } else if(brig && !brig.leadershipUsed){
    brig.leadershipUsed = true;
    log(`${t.label} fails to rally (rolled ${r}), but the Brigadier's Leadership Roll guarantees it — saved! (one-time use, now spent)`, 'combat');
  } else {
    log(`${t.label} fails to rally (rolled ${r}) and is removed from the field.`, 'combat');
    removeUnit(loser, 'failed rally');
  }
}

function findNearestFreeEdgeCell(edgeY, preferredX, excludeId){
  let candidates = [];
  for(let x=0;x<COLS;x++){
    if(unitsAt(x,edgeY).some(o=>o.id!==excludeId)) continue;
    candidates.push({x, y:edgeY, dist: Math.abs(x-preferredX)});
  }
  if(candidates.length===0) return {x:clamp(preferredX,0,COLS-1), y:edgeY}; // edge is full — fall back to overlap rather than throw
  candidates.sort((a,b)=>a.dist-b.dist);
  return candidates[0];
}

function clamp(v,min,max){ return Math.max(min,Math.min(max,v)); }

function removeUnit(u, reason){
  u.removed = true;
  addDeathEffect(u.x, u.y);
  log(`${UNIT_TYPES[u.type].label} (${SIDE_LABEL[u.side]}) removed: ${reason}.`, 'system');
  if(u.type!=='BRIGADIER'){
    const brig = state.units.find(o=>!o.removed && o.side===u.side && o.brigadeId===u.brigadeId && o.type==='BRIGADIER');
    if(brig){
      const remaining = state.units.filter(o=>!o.removed && o.side===u.side && o.brigadeId===u.brigadeId && o.type!=='BRIGADIER');
      if(remaining.length===0){
        brig.removed = true; // withdraws, not killed — no death effect for a non-combat unit
        log(`${SIDE_LABEL[brig.side]}'s Brigadier withdraws — the Brigade is broken.`, 'system');
      }
    }
  }
  checkWinCondition();
  renderBrigadeStatus();
}

function checkWinCondition(){
  for(const side of [SIDES.RED, SIDES.BLUE]){
    let brokenCount = 0;
    for(let bId=0; bId<3; bId++){
      const group = state.units.filter(u=>u.side===side && u.brigadeId===bId);
      if(group.length===0) continue;
      const remaining = group.filter(u=>!u.removed && u.type!=='BRIGADIER');
      if(remaining.length===0) brokenCount++;
    }
    if(brokenCount>=2){
      const winner = side===SIDES.RED ? SIDES.BLUE : SIDES.RED;
      endGame(winner);
      return;
    }
  }
}

function endGame(winner){
  state.gameOver = true;
  document.getElementById('overlayTitle').textContent = `${SIDE_LABEL[winner]} Victory`;
  document.getElementById('overlayText').textContent = `Two of the enemy's three Brigades are broken. ${SIDE_LABEL[winner]} holds the field.`;
  const modeChoices = document.getElementById('modeChoices');
  if(modeChoices) modeChoices.style.display = 'none';
  document.getElementById('overlayBtn').style.display = 'inline-block';
  document.getElementById('overlayBtn').textContent = 'New Battle';
  document.getElementById('overlay').classList.add('show');
  document.getElementById('overlayBtn').onclick = ()=> location.reload();
}

/* =========================================================
   RENDERING
========================================================= */
// You always sit behind your own troops on screen, regardless of which
// side you're playing. Purely a rendering/input transform — internal
// board coordinates, movement, LOS, and board rotation are untouched.
// Self-inverse (flipping twice returns the original), so the same
// function converts board->screen and screen->board.
function screenFlipActive(){
  return state.mode==='ai' && state.aiSide===SIDES.RED; // human is playing France (Blue), whose zone is internally "top"
}
function sy(y){
  return screenFlipActive() ? (ROWS-1-y) : y;
}

/* =========================================================
   UNIT MOVEMENT ANIMATION
   Units jumped instantly to their new square, which made rapid AI
   turns hard to follow. animateUnitTo() updates the logical position
   immediately (game logic never waits on animation) but the VISUAL
   position eases toward it over a short duration; drawUnit reads the
   interpolated position instead of u.x/u.y directly.
========================================================= */
let unitAnimations = {}; // unitId -> {fromX, fromY, toX, toY, startTime, duration}
let activeActionLine = null; // {fromX, fromY, toX, toY, color, expiresAt} — who's firing/fighting whom
let deathEffects = []; // {x, y, startTime} — skull for 2s, then smoke fades over another 2s
let animFrameHandle = null;

const DEATH_SKULL_MS = 2000, DEATH_SMOKE_MS = 2000;
function addDeathEffect(x, y){
  deathEffects.push({x, y, startTime: Date.now()});
  ensureAnimationLoopRunning();
}
function addCrater(x, y){
  if(state.craters.some(c=>c.x===x && c.y===y)) return; // already scarred, don't stack markers
  state.craters.push({x, y});
}

function getUnitVisualPos(u){
  const anim = unitAnimations[u.id];
  if(!anim) return {x:u.x, y:u.y};
  const elapsed = Date.now() - anim.startTime;
  const t = Math.min(1, elapsed/anim.duration);
  if(t>=1){ delete unitAnimations[u.id]; return {x:u.x, y:u.y}; }
  const eased = 1 - Math.pow(1-t, 2); // ease-out — starts fast, settles gently
  return { x: anim.fromX + (anim.toX-anim.fromX)*eased, y: anim.fromY + (anim.toY-anim.fromY)*eased };
}

// A Brigadier is never blocked from having an enemy move into his square —
// he's simply shoved 1-2 squares clear. Called right before completing a
// move onto a square a lone enemy Brigadier currently occupies.
function displaceBrigadierIfPresent(x, y, fromX, fromY){
  const occupant = state.units.find(o=>!o.removed && o.x===x && o.y===y && o.type==='BRIGADIER');
  if(!occupant) return;
  const dx = Math.sign(x-fromX) || 0, dy = Math.sign(y-fromY) || 0;
  const candidates = [
    {x:x+dx*2, y:y+dy*2}, {x:x+dx, y:y+dy},
    {x:x+dx, y:y}, {x:x, y:y+dy},
    ...neighbors8(x,y)
  ];
  for(const c of candidates){
    if(inBounds(c.x,c.y) && unitsAt(c.x,c.y).length===0){
      occupant.x = c.x; occupant.y = c.y;
      log(`${SIDE_LABEL[occupant.side]}'s Brigadier is shoved clear.`, 'system');
      return;
    }
  }
}

function animateUnitTo(u, newX, newY){
  const start = getUnitVisualPos(u); // current rendered position, in case a prior animation was still mid-flight
  u.x = newX; u.y = newY; // logical position updates immediately — game rules never wait on animation
  unitAnimations[u.id] = { fromX:start.x, fromY:start.y, toX:newX, toY:newY, startTime:Date.now(), duration:520 };
  ensureAnimationLoopRunning();
}

function showActionLine(fromUnit, toUnit, color, durationMs, dashed){
  activeActionLine = { fromX:fromUnit.x, fromY:fromUnit.y, toX:toUnit.x, toY:toUnit.y, color, dashed:!!dashed, expiresAt: Date.now()+(durationMs||1800) };
  ensureAnimationLoopRunning();
}

function ensureAnimationLoopRunning(){
  if(animFrameHandle) return;
  function tick(){
    draw();
    const stillAnimating = Object.keys(unitAnimations).length>0;
    const lineActive = activeActionLine && Date.now() < activeActionLine.expiresAt;
    if(!lineActive) activeActionLine = null;
    const now = Date.now();
    deathEffects = deathEffects.filter(d => now - d.startTime < DEATH_SKULL_MS + DEATH_SMOKE_MS);
    const deathActive = deathEffects.length>0;
    if(stillAnimating || lineActive || deathActive){
      animFrameHandle = requestAnimationFrame(tick);
    } else {
      animFrameHandle = null;
    }
  }
  animFrameHandle = requestAnimationFrame(tick);
}

const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');

function computeCellSize(){
  const wrap = document.getElementById('boardWrap');
  const viewportW = document.documentElement.clientWidth || window.innerWidth;
  const availW = Math.max(200, Math.min(wrap.clientWidth, viewportW) - 16);
  const availH = Math.max(200, wrap.clientHeight - 16);
  const byWidth = Math.floor(availW / COLS);
  const byHeight = Math.floor(availH / ROWS);
  return Math.max(22, Math.min(byWidth, byHeight, 68));
}

function sizeCanvas(){
  CELL = computeCellSize();
  const dpr = window.devicePixelRatio || 1;
  canvas.style.width = (COLS*CELL) + 'px';
  canvas.style.height = (ROWS*CELL) + 'px';
  canvas.width = COLS*CELL*dpr;
  canvas.height = ROWS*CELL*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  draw();
}

function terrainColor(key){
  return { OPEN: '#3c4a34', FIELD:'#8a7d3f', PLOUGHED_FIELD:'#b89a3f', ROAD:'#8a7350', WOODS:'#26361f', BUILDING:'#6b5847', HILL:'#3c4a34' }[key];
}

/* =========================================================
   TERRAIN RENDERING HELPERS
   The map is meant to read as geomorphic and analogue, not a rigid
   grid — the grid only matters for movement/LOS/combat range. These
   helpers group same-type terrain into connected regions and render
   them as one organic shape rather than a tile-by-tile stamp.
========================================================= */
function findConnectedRegions(terrain, key){
  const h = terrain.length, w = terrain[0].length;
  const regions = [];
  const visited = new Set();
  for(let y=0;y<h;y++){
    for(let x=0;x<w;x++){
      if(terrain[y][x]!==key) continue;
      const k = x+','+y;
      if(visited.has(k)) continue;
      const region = [];
      const stack = [[x,y]];
      visited.add(k);
      while(stack.length){
        const [cx,cy] = stack.pop();
        region.push([cx,cy]);
        for(const [dx,dy] of [[0,-1],[0,1],[-1,0],[1,0]]){
          const nx=cx+dx, ny=cy+dy;
          if(nx<0||nx>=w||ny<0||ny>=h) continue;
          const nk = nx+','+ny;
          if(visited.has(nk) || terrain[ny][nx]!==key) continue;
          visited.add(nk);
          stack.push([nx,ny]);
        }
      }
      regions.push(region);
    }
  }
  return regions;
}
function seededWobble(seed){
  const v = Math.sin(seed*12.9898)*43758.5453;
  return (v - Math.floor(v)) - 0.5; // -0.5..0.5
}
function roundedBlobPath(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function draw(){
  const flip = screenFlipActive();
  ctx.clearRect(0,0,canvas.width,canvas.height);
  const terrain = state.terrain;

  // base fill — road cells fill as open ground; Hill matches Open (elevation is
  // shown by its border, not a colour change); the ploughed-field/woods passes
  // paint over their own cells next.
  for(let y=0;y<ROWS;y++){
    const sy_ = sy(y);
    for(let x=0;x<COLS;x++){
      const key = terrain[y][x];
      ctx.fillStyle = terrainColor(key==='ROAD' ? 'OPEN' : key);
      ctx.fillRect(x*CELL,sy_*CELL,CELL,CELL);
    }
  }

  // Ploughed fields: wheat yellow with furrow lines along the field's long axis,
  // computed per contiguous group so a whole field reads as one shape.
  const ploughRegions = findConnectedRegions(terrain, 'PLOUGHED_FIELD');
  for(const region of ploughRegions){
    ctx.save();
    ctx.beginPath();
    for(const [x,y] of region) ctx.rect(x*CELL, sy(y)*CELL, CELL, CELL);
    ctx.clip();
    const screenYs = region.map(([,y])=>sy(y));
    const minX=Math.min(...region.map(c=>c[0])), maxX=Math.max(...region.map(c=>c[0]));
    const minSY=Math.min(...screenYs), maxSY=Math.max(...screenYs);
    const widthPx = (maxX-minX+1)*CELL, heightPx = (maxSY-minSY+1)*CELL;
    const horizontal = widthPx >= heightPx;
    ctx.strokeStyle = 'rgba(120,88,32,0.55)';
    ctx.lineWidth = Math.max(1, CELL*0.045);
    const spacing = CELL*0.24;
    if(horizontal){
      for(let ly=minSY*CELL; ly<(maxSY+1)*CELL; ly+=spacing){
        ctx.beginPath(); ctx.moveTo(minX*CELL,ly); ctx.lineTo((maxX+1)*CELL,ly); ctx.stroke();
      }
    } else {
      for(let lx=minX*CELL; lx<(maxX+1)*CELL; lx+=spacing){
        ctx.beginPath(); ctx.moveTo(lx,minSY*CELL); ctx.lineTo(lx,(maxSY+1)*CELL); ctx.stroke();
      }
    }
    ctx.restore();
  }

  // Woods: each cell is an inflated, jittered rounded blob; adjacent woods
  // cells overlap into one organic tree-mass instead of a grid of squares.
  const woodsRegions = findConnectedRegions(terrain, 'WOODS');
  ctx.fillStyle = terrainColor('WOODS');
  for(const region of woodsRegions){
    for(const [x,y] of region){
      const sy_ = sy(y);
      const jx = seededWobble(x*13+y*71+1) * CELL*0.12;
      const jy = seededWobble(x*47+y*19+2) * CELL*0.12;
      const pad = CELL*0.10, rad = CELL*0.34;
      roundedBlobPath(ctx, x*CELL-pad+jx, sy_*CELL-pad+jy, CELL+pad*2, CELL+pad*2, rad);
      ctx.fill();
    }
  }

  // Roads: one gently-curved stroke per unique connection, not filling the
  // whole square. 90-degree turns pull their anchor toward the inside corner
  // instead of routing dead-through the cell centre, softening the bend. A
  // small deterministic wobble per edge gives a hand-drawn feel rather than
  // rigid geometry, and stays stable across redraws (not re-randomized).
  function roadPoint(x,y){ return { x:x*CELL+CELL/2, y:sy(y)*CELL+CELL/2 }; }
  const excluded = state.excludedRoadEdges || new Set();
  const roadConn = {};
  for(let y=0;y<ROWS;y++) for(let x=0;x<COLS;x++){
    if(terrain[y][x]!=='ROAD') continue;
    const list = [];
    for(const [dx,dy] of [[0,-1],[0,1],[-1,0],[1,0]]){
      const nx=x+dx, ny=y+dy;
      if(!inBounds(nx,ny) || terrain[ny][nx]!=='ROAD') continue;
      const ekey = (x<nx || (x===nx && y<ny)) ? `${x},${y}-${nx},${ny}` : `${nx},${ny}-${x},${y}`;
      if(excluded.has(ekey)) continue;
      list.push({x:nx,y:ny});
    }
    roadConn[x+','+y] = list;
  }
  function roadAnchor(x,y){
    const list = roadConn[x+','+y] || [];
    const center = roadPoint(x,y);
    if(list.length !== 2) return center;
    const isOpposite = (list[0].x-x)===-(list[1].x-x) && (list[0].y-y)===-(list[1].y-y);
    if(isOpposite) return center; // straight through, no turn to soften
    const p1 = roadPoint(list[0].x,list[0].y), p2 = roadPoint(list[1].x,list[1].y);
    const midX=(p1.x+p2.x)/2, midY=(p1.y+p2.y)/2;
    const dirX=midX-center.x, dirY=midY-center.y;
    const len = Math.hypot(dirX,dirY) || 1;
    const pull = CELL*0.20;
    return { x:center.x+(dirX/len)*pull, y:center.y+(dirY/len)*pull };
  }
  ctx.strokeStyle = terrainColor('ROAD');
  ctx.lineWidth = Math.max(3, CELL*0.16);
  ctx.lineCap = 'round';
  const drawnEdges = new Set();
  for(let y=0;y<ROWS;y++){
    for(let x=0;x<COLS;x++){
      if(terrain[y][x]!=='ROAD') continue;
      const list = roadConn[x+','+y] || [];
      const a1 = roadAnchor(x,y);
      for(const n of list){
        const key = (x<n.x || (x===n.x && y<n.y)) ? `${x},${y}-${n.x},${n.y}` : `${n.x},${n.y}-${x},${y}`;
        if(drawnEdges.has(key)) continue;
        drawnEdges.add(key);
        const a2 = roadAnchor(n.x,n.y);
        const seed = x*17 + y*131 + n.x*29 + n.y*271;
        const wobble = seededWobble(seed) * CELL * 0.28;
        const dx=a2.x-a1.x, dy=a2.y-a1.y, len=Math.hypot(dx,dy)||1;
        const px=-dy/len, py=dx/len;
        const mx=(a1.x+a2.x)/2+px*wobble, my=(a1.y+a2.y)/2+py*wobble;
        ctx.beginPath(); ctx.moveTo(a1.x,a1.y); ctx.quadraticCurveTo(mx,my,a2.x,a2.y); ctx.stroke();
      }
      // a short stub into any adjacent Building, so roads visibly reach the buildings they serve
      for(const [dx,dy] of [[0,-1],[0,1],[-1,0],[1,0]]){
        const nx=x+dx, ny=y+dy;
        if(!inBounds(nx,ny) || terrain[ny][nx]!=='BUILDING') continue;
        const p1 = a1, p2 = roadPoint(nx,ny);
        ctx.beginPath();
        ctx.moveTo(p1.x + (p2.x-p1.x)*0.35, p1.y + (p2.y-p1.y)*0.35);
        ctx.lineTo(p2.x, p2.y);
        ctx.stroke();
      }
      if(list.length===0){ const c = roadPoint(x,y); ctx.beginPath(); ctx.arc(c.x,c.y,CELL*0.08,0,Math.PI*2); ctx.fillStyle=terrainColor('ROAD'); ctx.fill(); }
    }
  }
  ctx.lineCap = 'butt';

  // Hills: same grass fill as Open — elevation reads through a light rocky
  // border traced around the outer edge of each connected hill mass, not
  // per-tile, so a cluster reads as one landform (matches the real boards).
  const hillRegions = findConnectedRegions(terrain, 'HILL');
  ctx.strokeStyle = 'rgba(176,172,156,0.95)';
  ctx.lineWidth = Math.max(2, CELL*0.09);
  ctx.lineCap = 'round';
  for(const region of hillRegions){
    const cellSet = new Set(region.map(([x,y])=>x+','+y));
    for(const [x,y] of region){
      for(const {dx,dy} of [{dx:0,dy:-1},{dx:0,dy:1},{dx:-1,dy:0},{dx:1,dy:0}]){
        const nx=x+dx, ny=y+dy;
        if(inBounds(nx,ny) && cellSet.has(nx+','+ny)) continue; // interior edge, no border needed
        const sy0 = sy(y);
        let p1,p2;
        if(dy===-1){
          const nsy = sy(y-1);
          if(nsy<sy0){ p1=[x*CELL,sy0*CELL]; p2=[(x+1)*CELL,sy0*CELL]; }
          else { p1=[x*CELL,(sy0+1)*CELL]; p2=[(x+1)*CELL,(sy0+1)*CELL]; }
        } else if(dy===1){
          const nsy = sy(y+1);
          if(nsy<sy0){ p1=[x*CELL,sy0*CELL]; p2=[(x+1)*CELL,sy0*CELL]; }
          else { p1=[x*CELL,(sy0+1)*CELL]; p2=[(x+1)*CELL,(sy0+1)*CELL]; }
        } else if(dx===-1){ p1=[x*CELL,sy0*CELL]; p2=[x*CELL,(sy0+1)*CELL]; }
        else { p1=[(x+1)*CELL,sy0*CELL]; p2=[(x+1)*CELL,(sy0+1)*CELL]; }
        const seed = x*31 + y*57 + dx*211 + dy*97;
        const wobble = seededWobble(seed) * CELL * 0.22;
        const mx=(p1[0]+p2[0])/2, my=(p1[1]+p2[1])/2;
        const perpX=-(p2[1]-p1[1]), perpY=(p2[0]-p1[0]);
        const plen = Math.hypot(perpX,perpY) || 1;
        const cx_ = mx+(perpX/plen)*wobble, cy_ = my+(perpY/plen)*wobble;
        ctx.beginPath(); ctx.moveTo(p1[0],p1[1]); ctx.quadraticCurveTo(cx_,cy_,p2[0],p2[1]); ctx.stroke();
      }
    }
  }
  ctx.lineCap = 'butt';

  // terrain icons: quick at-a-glance recognition for hill/building (woods/field
  // are already visually distinct via their new shapes/colour, no icon needed)
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = Math.floor(CELL*0.46)+'px sans-serif';
  const ICONS = { HILL:'\u{26F0}', BUILDING:'\u{1F3E0}' };
  for(let y=0;y<ROWS;y++){
    for(let x=0;x<COLS;x++){
      const icon = ICONS[terrain[y][x]];
      if(!icon) continue;
      ctx.fillText(icon, x*CELL+CELL/2, sy(y)*CELL+CELL/2);
    }
  }

  // craters: every square Artillery has hit this match, above terrain, below units
  for(const c of state.craters){
    const cx = c.x*CELL+CELL/2, cy = sy(c.y)*CELL+CELL/2;
    ctx.save();
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = '#1a1710';
    ctx.beginPath(); ctx.arc(cx, cy, CELL*0.20, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 0.28;
    ctx.fillStyle = '#3a332a';
    ctx.beginPath(); ctx.arc(cx, cy, CELL*0.30, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }

  // grid
  ctx.strokeStyle = 'rgba(184,147,79,0.18)';
  ctx.lineWidth = 1;
  for(let x=0;x<=COLS;x++){ ctx.beginPath(); ctx.moveTo(x*CELL,0); ctx.lineTo(x*CELL,ROWS*CELL); ctx.stroke(); }
  for(let y=0;y<=ROWS;y++){ ctx.beginPath(); ctx.moveTo(0,y*CELL); ctx.lineTo(COLS*CELL,y*CELL); ctx.stroke(); }

  // seam between the two physical boards
  ctx.strokeStyle = 'rgba(233,228,214,0.35)';
  ctx.lineWidth = 2;
  ctx.setLineDash([6,4]);
  ctx.beginPath(); ctx.moveTo(HALF_COLS*CELL,0); ctx.lineTo(HALF_COLS*CELL,ROWS*CELL); ctx.stroke();
  ctx.setLineDash([]);
  ctx.lineWidth = 1;

  // deployment zone tint during deploy phase (Blue = rows 0-1, Red = rows ROWS-2..ROWS-1)
  if(state.phase==='deploy'){
    const blueTop = Math.min(sy(0), sy(1));
    ctx.fillStyle = 'rgba(46,69,102,0.14)';
    ctx.fillRect(0, blueTop*CELL, COLS*CELL, 2*CELL);
    const redTop = Math.min(sy(ROWS-2), sy(ROWS-1));
    ctx.fillStyle = 'rgba(163,64,58,0.10)';
    ctx.fillRect(0, redTop*CELL, COLS*CELL, 2*CELL);
  }

  // movement / target highlights
  if(highlightCells && highlightCells.length){
    for(const c of highlightCells){
      ctx.fillStyle = c.kind==='move' ? 'rgba(184,147,79,0.35)' : c.kind==='charge' ? 'rgba(224,110,30,0.5)' : 'rgba(181,69,63,0.4)';
      ctx.fillRect(c.x*CELL+3, sy(c.y)*CELL+3, CELL-6, CELL-6);
    }
  }

  // drag-and-drop hover cell during deployment
  if(dragState && dragState.dragging && dragState.hoverCell){
    ctx.fillStyle = 'rgba(184,147,79,0.5)';
    ctx.fillRect(dragState.hoverCell.x*CELL+2, sy(dragState.hoverCell.y)*CELL+2, CELL-4, CELL-4);
    ctx.strokeStyle = 'rgba(253,246,227,0.9)'; ctx.lineWidth=2;
    ctx.strokeRect(dragState.hoverCell.x*CELL+2, sy(dragState.hoverCell.y)*CELL+2, CELL-4, CELL-4);
  }

  // who's firing/fighting whom — fades out on its own after a couple of seconds
  if(activeActionLine && Date.now() < activeActionLine.expiresAt){
    const ln = activeActionLine;
    const fx = ln.fromX*CELL+CELL/2, fy = sy(ln.fromY)*CELL+CELL/2;
    const tx = ln.toX*CELL+CELL/2, ty = sy(ln.toY)*CELL+CELL/2;
    const remaining = (ln.expiresAt - Date.now()) / 3800;
    const alpha = Math.max(0, Math.min(1, remaining*2.2)); // hold steady, then fade in the last stretch
    ctx.save();
    ctx.strokeStyle = ln.color;
    ctx.globalAlpha = alpha;
    ctx.lineWidth = Math.max(2, CELL*0.06);
    if(ln.dashed) ctx.setLineDash([CELL*0.12, CELL*0.10]);
    ctx.beginPath(); ctx.moveTo(fx,fy); ctx.lineTo(tx,ty); ctx.stroke();
    ctx.setLineDash([]);
    // arrowhead at the target end
    const ang = Math.atan2(ty-fy, tx-fx);
    const ah = CELL*0.16;
    ctx.beginPath();
    ctx.moveTo(tx,ty);
    ctx.lineTo(tx-ah*Math.cos(ang-Math.PI/7), ty-ah*Math.sin(ang-Math.PI/7));
    ctx.lineTo(tx-ah*Math.cos(ang+Math.PI/7), ty-ah*Math.sin(ang+Math.PI/7));
    ctx.closePath();
    ctx.fillStyle = ln.color;
    ctx.fill();
    ctx.restore();
  }

  // units — stacked squares (doubled infantry) are offset so both are visible
  const stackGroups = {};
  for(const u of state.units){
    if(u.removed) continue;
    const key = u.x+','+u.y;
    (stackGroups[key] = stackGroups[key] || []).push(u);
  }
  const STACK_OFFSETS = [{dx:-0.15,dy:-0.15,scale:0.72},{dx:0.15,dy:0.15,scale:0.72}];
  for(const key in stackGroups){
    const list = stackGroups[key];
    if(list.length===1){ drawUnit(list[0]); }
    else { list.forEach((u,i)=> drawUnit(u, STACK_OFFSETS[i % STACK_OFFSETS.length])); }
  }

  // muzzle smoke: lingers around a gun from the moment it fires until its side's next turn
  for(const u of state.units){
    if(u.removed || !u.smokeActive) continue;
    const vp = getUnitVisualPos(u);
    const cx = vp.x*CELL+CELL/2, cy = sy(vp.y)*CELL+CELL/2;
    ctx.save();
    ctx.fillStyle = '#f4f1e8';
    [[-0.22,-0.30,0.16],[0.10,-0.36,0.13],[0.28,-0.18,0.11]].forEach(([ox,oy,r])=>{
      ctx.globalAlpha = 0.45;
      ctx.beginPath(); ctx.arc(cx+ox*CELL, cy+oy*CELL, r*CELL, 0, Math.PI*2); ctx.fill();
    });
    ctx.restore();
  }

  // death markers: skull holds for a beat, then fades into drifting smoke
  const now = Date.now();
  for(const d of deathEffects){
    const elapsed = now - d.startTime;
    const cx = d.x*CELL+CELL/2, cy = sy(d.y)*CELL+CELL/2;
    if(elapsed < DEATH_SKULL_MS){
      ctx.save();
      ctx.globalAlpha = 1;
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.font = Math.floor(CELL*0.5)+'px sans-serif';
      ctx.fillText('\u{1F480}', cx, cy);
      ctx.restore();
    } else {
      const smokeT = (elapsed - DEATH_SKULL_MS) / DEATH_SMOKE_MS; // 0..1
      const fade = 1 - smokeT;
      ctx.save();
      ctx.fillStyle = '#d8d4c8';
      [[-0.15,-0.1,0.18],[0.15,-0.15,0.15],[0,0.05,0.20]].forEach(([ox,oy,r])=>{
        ctx.globalAlpha = 0.4*fade;
        const drift = smokeT*0.25;
        ctx.beginPath(); ctx.arc(cx+ox*CELL, cy+(oy-drift)*CELL, (r+smokeT*0.15)*CELL, 0, Math.PI*2); ctx.fill();
      });
      ctx.restore();
    }
  }
}

function drawUnit(u, off){
  off = off || {dx:0, dy:0, scale:1};
  const vp = getUnitVisualPos(u);
  const cx = vp.x*CELL+CELL/2 + off.dx*CELL, cy = sy(vp.y)*CELL+CELL/2 + off.dy*CELL;
  const t = UNIT_TYPES[u.type];
  const isSel = state.selectedUnitId===u.id;
  const col = SIDE_COLOR[u.side];
  const r = CELL*0.30*off.scale;

  ctx.save();
  ctx.translate(cx,cy);
  if(u.formation==='square') ctx.rotate(Math.PI/4);

  ctx.globalAlpha = u.hidden ? 0.55 : 1;
  ctx.fillStyle = col;
  ctx.strokeStyle = isSel ? '#f4e9c9' : 'rgba(0,0,0,0.4)';
  ctx.lineWidth = isSel ? 3 : 1.5;
  if(u.hidden) ctx.setLineDash([3,2]);

  switch(t.shape){
    case 'square':
      ctx.beginPath(); ctx.rect(-r,-r,r*2,r*2); ctx.fill(); ctx.stroke();
      break;
    case 'triangle':
      ctx.beginPath(); ctx.moveTo(0,-r); ctx.lineTo(r,r); ctx.lineTo(-r,r); ctx.closePath(); ctx.fill(); ctx.stroke();
      break;
    case 'diamond':
      ctx.beginPath(); ctx.moveTo(0,-r); ctx.lineTo(r,0); ctx.lineTo(0,r); ctx.lineTo(-r,0); ctx.closePath(); ctx.fill(); ctx.stroke();
      break;
    case 'star':
      ctx.beginPath();
      for(let i=0;i<5;i++){
        const ang = -Math.PI/2 + i*(2*Math.PI/5);
        const ang2 = ang + Math.PI/5;
        ctx.lineTo(Math.cos(ang)*r, Math.sin(ang)*r);
        ctx.lineTo(Math.cos(ang2)*r*0.45, Math.sin(ang2)*r*0.45);
      }
      ctx.closePath(); ctx.fill(); ctx.stroke();
      break;
  }
  ctx.setLineDash([]);
  ctx.globalAlpha = 1;
  ctx.restore();

  // status pips
  if(u.turnOnly){
    ctx.fillStyle = '#c9a24a';
    ctx.beginPath(); ctx.arc(cx+r*0.9, cy-r*0.9, 5, 0, Math.PI*2); ctx.fill();
  }
  if(t.reroll){
    ctx.fillStyle='#f4e9c9';
    ctx.font='9px IBM Plex Mono';
    ctx.textAlign='center';
    ctx.fillText('★', cx, cy+r+11);
  }
}

let highlightCells = [];

/* =========================================================
   DEPLOYMENT PHASE
   Rulebook: players alternate placing whole Brigades, not individual
   units, and choose freely which units go into each Brigade — the
   only constraint is a Brigadier first, then at least 2 more units.
   state.deployPool[side] holds every not-yet-placed unit type for
   that side (starts as the full 17-unit army). state.deployBrigadeIndex
   tracks which Brigade (0-2) a side is currently filling. Control only
   passes to the other side once the active side confirms their current
   Brigade (Brigadier + at least 2 more units).
========================================================= */
const FULL_ARMY_POOL = BRIGADE_COMPOSITIONS.flat(); // 3 Brigadier, 2 Guard, 6 Infantry, 2 Heavy Cav, 2 Light Cav, 2 Artillery

function initDeployment(){
  state.deployPool = { red: [...FULL_ARMY_POOL], blue: [...FULL_ARMY_POOL] };
  state.deployBrigadeIndex = { red: 0, blue: 0 };
  state.currentBrigadeHasBrigadier = { red: false, blue: false };
  state.currentBrigadeCount = { red: 0, blue: 0 };
  state.deployTurn = Math.random()<0.5 ? SIDES.RED : SIDES.BLUE;
  resetUndoStack();
  log(`Roll for first placement: ${SIDE_LABEL[state.deployTurn]} places their first Brigade.`, 'system');
  document.getElementById('rosterPanel').style.display='flex';
  document.getElementById('battlePanel').style.display='none';
  renderRoster();
  updateHeader();
  if(state.mode==='ai' && state.deployTurn===state.aiSide){
    setTimeout(aiDeployStep, 500);
  }
}

function sideFullyDeployed(side){ return state.deployBrigadeIndex[side] >= 3; }

// How many more non-Brigadier units side may add to their CURRENT Brigade
// right now without leaving a future Brigade short of its 2-unit minimum.
function canAddMoreToCurrentBrigade(side){
  const bIdx = state.deployBrigadeIndex[side];
  const remainingBrigadesAfter = 2 - bIdx;
  const poolNonBrig = state.deployPool[side].filter(t=>t!=='BRIGADIER').length;
  return (poolNonBrig - 1) >= 2*remainingBrigadesAfter;
}

let selectedDeployType = null;
function renderRoster(){
  const list = document.getElementById('rosterList');
  const progress = document.getElementById('brigadeProgress');
  const confirmBtn = document.getElementById('confirmBrigadeBtn');
  list.innerHTML = '';
  const side = state.deployTurn;

  if(sideFullyDeployed(side)){
    document.getElementById('rosterTitle').textContent = `${SIDE_LABEL[side]}: fully deployed`;
    progress.textContent = '';
    confirmBtn.style.display = 'none';
    checkDeployAdvance();
    return;
  }

  const bIdx = state.deployBrigadeIndex[side];
  const hasBrig = state.currentBrigadeHasBrigadier[side];
  const count = state.currentBrigadeCount[side];
  document.getElementById('rosterTitle').textContent = `${SIDE_LABEL[side]}: Brigade ${bIdx+1} of 3`;
  progress.textContent = !hasBrig
    ? 'Place a Brigadier to start this Brigade'
    : `${count} unit${count===1?'':'s'} placed (minimum 2)`;

  const pool = state.deployPool[side];
  const showTypes = !hasBrig
    ? pool.filter(t=>t==='BRIGADIER')
    : pool.filter(t=>t!=='BRIGADIER');
  const capped = hasBrig && !canAddMoreToCurrentBrigade(side);

  // de-duplicate for display (e.g. 6x Infantry shows as one chip you can tap repeatedly)
  const seen = {};
  showTypes.forEach((typeKey)=>{
    if(seen[typeKey]) return;
    seen[typeKey] = true;
    const remainingOfType = showTypes.filter(t=>t===typeKey).length;
    const t = UNIT_TYPES[typeKey];
    const chip = document.createElement('div');
    const disabled = capped;
    chip.className = 'roster-chip' + (selectedDeployType===typeKey ? ' selected' : '') + (disabled ? ' placed' : '');
    chip.innerHTML = `<div class="swatch" style="background:${SIDE_COLOR[side]}"></div><div>${t.label} ${remainingOfType>1?`(${remainingOfType} left)`:''}</div>`;
    if(!disabled){
      chip.onclick = ()=>{ selectedDeployType = typeKey; renderRoster(); };
      chip.addEventListener('pointerdown', (e)=> startChipDrag(e, typeKey));
    }
    list.appendChild(chip);
  });
  if(capped){
    const note = document.createElement('div');
    note.style.cssText = 'color:var(--ink-dim);font-size:11px;padding:4px 2px;font-style:italic;';
    note.textContent = 'Remaining units are reserved for your other Brigades.';
    list.appendChild(note);
  }

  confirmBtn.style.display = hasBrig ? 'inline-block' : 'none';
  confirmBtn.disabled = !(hasBrig && count>=2);
  draw();
}

/* =========================================================
   DEPLOYMENT: DRAG AND DROP
   A roster chip can be tapped (existing select-then-tap-board flow,
   unchanged) or dragged straight onto the board. Movement past a small
   threshold counts as a drag; anything less falls through to a normal
   tap so short/imprecise taps still work.
========================================================= */
let dragState = null; // {typeKey, startX, startY, dragging, hoverCell}

function startChipDrag(e, typeKey){
  if(state.phase!=='deploy') return;
  dragState = { typeKey, startX:e.clientX, startY:e.clientY, dragging:false, hoverCell:null };
  const move = (ev)=>{
    if(!dragState) return;
    const dx = ev.clientX-dragState.startX, dy = ev.clientY-dragState.startY;
    if(!dragState.dragging && Math.hypot(dx,dy) > 8){
      dragState.dragging = true;
      const ghost = document.getElementById('dragGhost');
      ghost.classList.add('show');
      ghost.style.background = SIDE_COLOR[state.deployTurn];
      ghost.textContent = UNIT_TYPES[typeKey].label;
    }
    if(dragState.dragging){
      const ghost = document.getElementById('dragGhost');
      ghost.style.left = (ev.clientX-22)+'px';
      ghost.style.top = (ev.clientY-22)+'px';
      updateDragHoverCell(ev.clientX, ev.clientY);
      draw();
    }
  };
  const up = (ev)=>{
    document.removeEventListener('pointermove', move);
    document.removeEventListener('pointerup', up);
    if(dragState && dragState.dragging){
      document.getElementById('dragGhost').classList.remove('show');
      if(dragState.hoverCell){
        pushUndoSnapshot();
        const placed = attemptDeployAt(dragState.typeKey, dragState.hoverCell.x, dragState.hoverCell.y);
        if(!placed) undoStack.pop();
      }
    }
    dragState = null;
    draw();
  };
